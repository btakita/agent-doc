\* The happy path across an upgrade must stay reachable: a dispatch that
\* arrives mid-`auto_install_reexec` is still delivered once the replacement
\* reaches its watch loop. Asserting the negation, so this MUST be violated —
\* otherwise `StampedRecycleNeverRefuses` could pass by never delivering.
SPECIFICATION Spec

CONSTANTS
    Horizon = 6
    Ttl = 3
    WaitBudget = 1
    SingleShotVerdict = FALSE
    Stamped = TRUE
    TtlIsProof = FALSE

INVARIANT NeverDelivered
