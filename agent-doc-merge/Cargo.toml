[package]
name = "agent-doc-merge"
version = "0.35.28"
edition = "2024"
description = "Pure merge policy functions for agent-doc documents"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_merge"

[dependencies]
agent-doc-state-scope = { path = "../agent-doc-state-scope", version = "0.35.28" }
# `#relaylockpoison`: locks here are parking_lot, not `std::sync` — the workspace
# keeps `panic=unwind` so the cdylib's `catch_unwind` guards survive a panic in a
# host IDE, but that unwind passes THROUGH any live guard, so a poisoning mutex
# turns a survivable panic into a permanent process-wide outage.
parking_lot = "0.12"
agent-doc-element = { path = "../agent-doc-element", version = "0.35.28" }
agent-doc-element-queue = { path = "../agent-doc-element-queue", version = "0.35.28" }
agent-doc-document = { path = "../agent-doc-document", version = "0.35.28" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.35.28" }
agent-doc-markdown-ast = { path = "../agent-doc-markdown-ast", version = "0.35.28" }
agent-doc-markdown-lossless = { path = "../agent-doc-markdown-lossless", version = "0.35.28" }
anyhow = "1"
base64 = "0.22"
lazily = { version = "0.51.1", features = ["serde", "thread-safe", "lossless-tree"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
similar = "3"
zstd = "0.13"

[dev-dependencies]
serde_json = "1"
