name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The 156-crate test graph exceeds the hosted runner disk when Cargo
      # retains incremental state and full debug info for every test binary.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    # #ci-per-test-timeout-guard: CI installs cargo-nextest (step below) so
    # `make check` takes the nextest path and every individual test inherits the
    # per-test deadlock guard in .config/nextest.toml (60s x 3 = 180s, then the
    # hung test is killed and named). A lock/IPC deadlock now fails fast with a
    # backtrace instead of silently hanging. The job-level cap stays as a
    # backstop for NON-test hangs the per-test guard can't see (compile, doc
    # tests, tmux-ci): well above a legitimate cold run (~25-40 min) yet far
    # below GitHub's 6-hour default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check out agent-kit path dependency
        run: git clone --depth 1 https://github.com/btakita/agent-kit ../agent-kit

      - name: Check out tmux-router patch dependency
        run: git clone --depth 1 https://github.com/btakita/tmux-router ../tmux-router

      - name: Check out lazily-rs path dependency
        run: git clone --depth 1 https://github.com/btakita/lazily-rs ../lazily-rs

      - name: Check out lazily-spec schema dependency
        run: git clone --depth 1 https://github.com/lazily-hub/lazily-spec ../lazily-spec

      - name: Check out lazily-kt composite dependency
        run: git clone --depth 1 https://github.com/lazily-hub/lazily-kt ../lazily-kt

      - name: Install tmux for integration tests
        run: sudo apt-get update && sudo apt-get install -y tmux

      # #ci25gradle: JDK 25 (listed last, so it is the default JAVA_HOME) runs
      # Gradle 9.2.1 for editors/jetbrains-262. The classic editors/jetbrains
      # build stays on its Gradle 8.14 wrapper, whose Groovy cannot read JDK 25
      # class files ("Unsupported class file major version 69"); its
      # gradle/gradle-daemon-jvm.properties pins the daemon to Temurin 21,
      # which this step installs so the daemon needs no download.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install VS Code plugin dependencies
        run: npm ci --prefix editors/vscode

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # #ci-per-test-timeout-guard: install nextest so `make check` uses the
      # nextest path, activating the per-test slow-timeout deadlock guard in
      # .config/nextest.toml. Without this, CI falls back to plain `cargo test`,
      # which has no per-test timeout.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # #lz262resolve: publish the lazily-kt release the 262 backend pins into
      # mavenLocal. Shared with release.yml via the script (#relcimavenlocal).
      - name: Publish pinned lazily-kt release to mavenLocal (JetBrains 262)
        run: bash scripts/publish-pinned-lazily-kt.sh

      - name: Verify collision-free JetBrains release contract
        run: |
          python3 scripts/check_plugin_versions.py --self-test
          python3 scripts/check_plugin_versions.py

      - name: Run make check
        run: make check

      - name: Run make tmux-ci
        run: |
          echo "Running make tmux-ci"
          make tmux-ci
