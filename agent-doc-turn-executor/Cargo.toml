[package]
name = "agent-doc-turn-executor"
version = "0.34.85"
edition = "2024"
description = "Shared turn executor model vocabulary for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_turn_executor"

[dependencies]
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.34.85" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.34.85" }
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
