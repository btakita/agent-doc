agent-doc-preflight-io = { path = "../agent-doc-preflight-io", version = "0.35.87" }
agent-doc-preflight-runtime-io = { path = "../agent-doc-preflight-runtime-io", version = "0.35.87" }
agent-doc-project-root-io = { path = "../agent-doc-project-root-io", version = "0.35.87" }
agent-doc-queue = { path = "../agent-doc-queue", version = "0.35.87" }
agent-doc-queue-io = { path = "../agent-doc-queue-io", version = "0.35.87" }
agent-doc-repair-io = { path = "../agent-doc-repair-io", version = "0.35.87" }
agent-doc-run-context-io = { path = "../agent-doc-run-context-io", version = "0.35.87" }
agent-doc-session-check-io = { path = "../agent-doc-session-check-io", version = "0.35.87" }
agent-doc-session-registry-io = { path = "../agent-doc-session-registry-io", version = "0.35.87" }
agent-doc-snapshot-io = { path = "../agent-doc-snapshot-io", version = "0.35.87" }
agent-doc-status-io = { path = "../agent-doc-status-io", version = "0.35.87" }
