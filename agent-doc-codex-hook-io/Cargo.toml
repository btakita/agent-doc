[package]
name = "agent-doc-codex-hook-io"
version = "0.34.152"
edition = "2024"
description = "Codex hook sidecar I/O for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_codex_hook_io"

[dependencies]
agent-doc-hash = { path = "../agent-doc-hash", version = "0.34.152" }
agent-doc-model-tier = { path = "../agent-doc-model-tier", version = "0.34.152" }
agent-doc-ops-log-io = { path = "../agent-doc-ops-log-io", version = "0.34.152" }
agent-doc-prompt-contract = { path = "../agent-doc-prompt-contract", version = "0.34.152" }
agent-doc-project-root-io = { path = "../agent-doc-project-root-io", version = "0.34.152" }
agent-doc-queue = { path = "../agent-doc-queue", version = "0.34.152" }
agent-doc-session-accretion-io = { path = "../agent-doc-session-accretion-io", version = "0.34.152" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

[dev-dependencies]
agent-doc-harness = { path = "../agent-doc-harness", version = "0.34.152" }
tempfile = "3"
