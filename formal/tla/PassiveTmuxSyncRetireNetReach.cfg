    MaxCopies = 1
    MaxGen = 0
    MaxSeq = 3
    MaxCGen = 3
    MaxHandoffs = 1
    RetireOnNewerReply = FALSE
    ReregisterOnRetired = TRUE
    RetireRaisesFence = TRUE
    RetiredFence = TRUE

INVARIANT NeverReregisters

