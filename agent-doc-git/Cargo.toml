[package]
name = "agent-doc-git"
version = "0.35.561"
edition = "2024"
description = "Pure git command and path policy helpers for agent-doc"
license = "Apache-2.0"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_git"

[dependencies]
agent-doc-diff = { path = "../agent-doc-diff", version = "0.35.561" }
agent-doc-document = { path = "../agent-doc-document", version = "0.35.561" }
agent-doc-document-realtime = { path = "../agent-doc-document-realtime", version = "0.35.561" }
agent-doc-element = { path = "../agent-doc-element", version = "0.35.561" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.35.561" }
agent-doc-markdown-ast = { path = "../agent-doc-markdown-ast", version = "0.35.561" }
agent-doc-template = { path = "../agent-doc-template", version = "0.35.561" }
agent-doc-turn = { path = "../agent-doc-turn", version = "0.35.561" }

[dev-dependencies]
tempfile = "3"
