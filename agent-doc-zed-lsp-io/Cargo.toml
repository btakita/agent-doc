[package]
name = "agent-doc-zed-lsp-io"
version = "0.35.558"
edition = "2024"
description = "Supplemental Markdown language server for agent-doc Zed integration"
license = "Apache-2.0"
repository = "https://github.com/btakita/agent-doc"
publish = false

[dependencies]
agent-doc-controller-io = { path = "../agent-doc-controller-io", version = "0.35.558" }
agent-doc-document-realtime = { path = "../agent-doc-document-realtime", version = "0.35.558" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.35.558" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.35.558" }
agent-doc-merge = { path = "../agent-doc-merge", version = "0.35.558" }
agent-doc-project-root-io = { path = "../agent-doc-project-root-io", version = "0.35.558" }
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
