[package]
name = "agent-doc-orchestration"
version = "0.1.0"
edition = "2024"
description = "Orchestration layer for agent-doc (routing, git, sessions, IPC, supervision, sync) — sits between the CLI and agent-doc-core"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_orchestration"

[features]
# Exposes the in-process controller test short-circuits to downstream crates'
# test builds (the `agent-doc` CLI shell enables this in dev-dependencies so its
# tests that call `project_controller` behave as they did pre-extraction).
test-support = []

[dependencies]
agent-doc-core = { path = "../agent-doc-core" }
agent-doc-sqlite = { path = "../agent-doc-sqlite" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
similar = "2"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
tempfile = "3"
zip = "2"
uuid = { version = "1", features = ["v4"] }
notify = "7"
agent-kit = { path = "../../agent-kit", version = "0.4.0", features = ["hooks"] }
instruction-files = "0.2"
tmux-router = "0.3.10"
pulldown-cmark = "0.12"
regex = "1"
yrs = "0.21"
interprocess = { version = "2", default-features = false }
htmd = "0.5.3"
indexmap = { version = "2", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
libc = "0.2"
portable-pty = "0.8"
alacritty_terminal = "0.26"
signal-hook = "0.3"
tagpath = { version = "0.12", default-features = false }
tiny_http = { version = "0.12", default-features = false, features = ["ssl-rustls"] }

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
# Controller-state tests open `agent-doc-sqlite`'s state DB directly to assert
# the schema/rows the `state_store` seam writes. The SQLite layer itself lives
# in `agent-doc-sqlite`; this dev-only dependency keeps those tests compiling
# without pulling `rusqlite` into orchestration's normal build graph.
rusqlite = { version = "0.32", features = ["bundled"] }
