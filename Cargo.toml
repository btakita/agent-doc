serde_json = "1"
similar = "3"
toml = "1.1"
ureq = { version = "3", features = ["json"] }
tempfile = "3"
zip = "8"
uuid = { version = "1", features = ["v4"] }
notify = "8"
agent-kit = { version = "0.4.1", features = ["hooks"] }
