# cargo-nextest configuration.
#
# #ci-per-test-timeout-guard: bound every individual test so a lock/IPC deadlock
# (e.g. the run_stream `doc_lock` self-deadlock that once hung `make check` ~15
# minutes at 0% CPU) fails fast with the offending test named, instead of hanging
# the whole suite. The Makefile `test` target uses `cargo nextest run` whenever
# cargo-nextest is installed, so this applies to every local/CI run on that path.
#
# A test running past `period` is logged as slow; after `terminate-after` periods
# nextest kills it and reports a timeout failure (so the suite still terminates
# and names the hung test). 60s × 3 = 180s ceiling — comfortably above the
# slowest ordinary IPC-replay integration test (~20s) yet far below a hang.
# `#testisolationtests`: setup scripts export the discovery ceiling (see the
# `test-isolation` script at the end of this file).
experimental = ["setup-scripts"]

[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }

# Queue-accretion restart covers a full multi-turn queue drain and fresh backend
# handoff. It routinely takes over 60s on local/shared runners, so give it a
# higher slow threshold without widening the hang ceiling beyond the default
# class of deadlock guard.
[[profile.default.overrides]]
filter = 'test(run_auto_queue_starts_fresh_backend_session_after_accretion_threshold)'
slow-timeout = { period = "120s", terminate-after = 2 }

# CI mirrors the default ceiling; kept explicit so a future `--profile ci` run
# inherits the same deadlock guard.
[profile.ci]
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.ci.overrides]]
filter = 'test(run_auto_queue_starts_fresh_backend_session_after_accretion_threshold)'
slow-timeout = { period = "120s", terminate-after = 2 }

# Affected-scope edit-loop runs fail at the first regression. Controller-heavy
# packages are deliberately batched by Cargo outside nextest, so this profile
# covers only the remaining selected packages.
[profile.dev-fast]
inherits = "default"
fail-fast = true

# `#testisolationtests`: refuse a TMPDIR inside an agent-doc project (e.g. under
# `$HOME`, whose `~/.agent-doc` is the operator's real state) and export the
# project-root discovery ceiling to every test process, so a raw
# `cargo nextest run` is isolated the same way `make test` is. An explicit
# AGENT_DOC_ROOT_CEILING_DIRECTORIES (the Makefile export) is preserved.
[scripts.setup.test-isolation]
command = "scripts/check-test-tmpdir --nextest-env"

[[profile.default.scripts]]
filter = "all()"
setup = "test-isolation"

[[profile.ci.scripts]]
filter = "all()"
setup = "test-isolation"
