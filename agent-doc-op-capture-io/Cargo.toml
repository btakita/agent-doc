[package]
name = "agent-doc-op-capture-io"
version = "0.34.102"
edition = "2024"
description = "Durable editor operation capture sidecar I/O for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_op_capture_io"

[dependencies]
agent-doc-fs = { path = "../agent-doc-fs", version = "0.34.102" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.34.102" }
agent-doc-merge = { path = "../agent-doc-merge", version = "0.34.102" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
