[package]
name = "agent-doc-document"
version = "0.34.65"
edition = "2024"
description = "Pure document projection rules for agent-doc realtime state"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_document"

[dependencies]
agent-doc-element = { path = "../agent-doc-element", version = "0.34.65" }
agent-doc-element-backlog = { path = "../agent-doc-element-backlog", version = "0.34.65" }
agent-doc-element-registry = { path = "../agent-doc-element-registry", version = "0.34.65" }
agent-doc-diff = { path = "../agent-doc-diff", version = "0.34.65" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.34.65" }
agent-doc-prompt-lines = { path = "../agent-doc-prompt-lines", version = "0.34.65" }
anyhow = "1"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
