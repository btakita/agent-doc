[package]
name = "agent-doc-memory"
version = "0.35.79"
edition = "2024"
description = "Pure semantic memory ranking and event-shaping helpers for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_memory"

[dependencies]
agent-doc-element-backlog = { path = "../agent-doc-element-backlog", version = "0.35.79" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.35.79" }
serde = { version = "1", features = ["derive"] }
tsift-memory = "0.1.70"
