\* A refresh (re-request or install fan-out) that restarts the consumption
\* clock re-admits an overdue pane. MUST violate NoFlapAfterOverdueRefusal —
\* proof that keeping the FIRST unconsumed request time carries it.
SPECIFICATION Spec

CONSTANTS
    MaxWidth = 3
    MaxPublications = 3
    MaxFanouts = 1
    GuardOverdue = TRUE
    GuardWiden = TRUE
    DurableRequest = TRUE
