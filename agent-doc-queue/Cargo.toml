[package]
name = "agent-doc-queue"
version = "0.35.24"
edition = "2024"
description = "Pure queue scheduling and drain policy for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_queue"

[dependencies]
agent-doc-document = { path = "../agent-doc-document", version = "0.35.24" }
agent-doc-diff = { path = "../agent-doc-diff", version = "0.35.24" }
agent-doc-element = { path = "../agent-doc-element", version = "0.35.24" }
agent-doc-element-backlog = { path = "../agent-doc-element-backlog", version = "0.35.24" }
agent-doc-element-queue = { path = "../agent-doc-element-queue", version = "0.35.24" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.35.24" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.35.24" }
agent-doc-lease = { path = "../agent-doc-lease", version = "0.35.24" }
agent-doc-markdown-ast = { path = "../agent-doc-markdown-ast", version = "0.35.24" }
agent-doc-prompt-lines = { path = "../agent-doc-prompt-lines", version = "0.35.24" }
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
tempfile = "3"
