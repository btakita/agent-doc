SPECIFICATION Spec

\* The stated boundary. `NoDuplicateItem` (every component) MUST be violated by
\* the shipped rule: a component only disk changed is still merged, and when
\* that change is the editor's own in-flight typing it arrives twice. A
\* text-only rule cannot tell it from independent disk work (Reach); closing it
\* needs provenance, so the shipped claim is NoDuplicateInConcurrentComponent.
CONSTANTS
    Policy = "exclusive"
    N = 4

INVARIANT TypeOK
INVARIANT NoDuplicateItem
