[package]
name = "agent-doc-session-accretion-io"
version = "0.34.67"
edition = "2024"
description = "Session accretion filesystem adapters for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_session_accretion_io"

[dependencies]
agent-doc-fs = { path = "../agent-doc-fs", version = "0.34.67" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.34.67" }
agent-doc-log-time = { path = "../agent-doc-log-time", version = "0.34.67" }
agent-doc-ops-log-io = { path = "../agent-doc-ops-log-io", version = "0.34.67" }
agent-doc-project-config-io = { path = "../agent-doc-project-config-io", version = "0.34.67" }
agent-doc-session-accretion = { path = "../agent-doc-session-accretion", version = "0.34.67" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
