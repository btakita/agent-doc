[package]
name = "agent-doc-editor-surface-io"
version = "0.35.594"
edition = "2024"
description = "Project-scoped editor-surface graphs and their tmux consequence for agent-doc"
license = "Apache-2.0"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_editor_surface_io"

[dependencies]
agent-doc-controller-io = { path = "../agent-doc-controller-io", version = "0.35.594" }
agent-doc-document = { path = "../agent-doc-document", version = "0.35.594" }
agent-doc-editor-surface = { path = "../agent-doc-editor-surface", version = "0.35.594" }
agent-doc-element = { path = "../agent-doc-element", version = "0.35.594" }
agent-doc-element-queue = { path = "../agent-doc-element-queue", version = "0.35.594" }
agent-doc-fs = { path = "../agent-doc-fs", version = "0.35.594" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.35.594" }
agent-doc-markdown-ast = { path = "../agent-doc-markdown-ast", version = "0.35.594" }
agent-doc-merge = { path = "../agent-doc-merge", version = "0.35.594" }
agent-doc-queue = { path = "../agent-doc-queue", version = "0.35.594" }
agent-doc-state-scope = { path = "../agent-doc-state-scope", version = "0.35.594" }
agent-doc-tmux-io = { path = "../agent-doc-tmux-io", version = "0.35.594" }
anyhow = "1"
lazily = { version = "0.64.0", features = ["thread-safe"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
