[package]
name = "agent-doc-document"
version = "0.34.98"
edition = "2024"
description = "Pure document projection rules for agent-doc realtime state"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_document"

[dependencies]
agent-doc-element = { path = "../agent-doc-element", version = "0.34.98" }
agent-doc-element-backlog = { path = "../agent-doc-element-backlog", version = "0.34.98" }
agent-doc-element-registry = { path = "../agent-doc-element-registry", version = "0.34.98" }
agent-doc-diff = { path = "../agent-doc-diff", version = "0.34.98" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.34.98" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.34.98" }
agent-doc-markdown-ast = { path = "../agent-doc-markdown-ast", version = "0.34.98" }
agent-doc-prompt-lines = { path = "../agent-doc-prompt-lines", version = "0.34.98" }
agent-doc-topic = { path = "../agent-doc-topic", version = "0.34.98" }
anyhow = "1"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
