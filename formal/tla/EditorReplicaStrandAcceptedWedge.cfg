\* The obligation that matters for `#acceptedneverserved`, and the reason the
\* module needs a wedge PER EDGE rather than one for the module.
\*
\* The rejection edge is ENABLED here and the acceptance edge is not. If the
\* rejection edge covered the accepted-but-never-served shape, this would pass —
\* so it must violate the liveness property, proving the original fix does not
\* reach the state the cdylib reload actually produces. Without a per-edge wedge
\* the shipped edge would keep the module green while the production wedge stayed
\* open, which is exactly how this one survived the first fix.
SPECIFICATION Spec

CONSTANTS
    MaxReregisterAttempts = 3
    DemoteOnDefinitiveRejection = TRUE
    DemoteOnAcceptedWithoutServing = FALSE

INVARIANT TypeOK
INVARIANT NeverReadsDiskWhileEndpointServes
INVARIANT DemotionRequiresProof
INVARIANT DemotionRequiresAnAnswer

PROPERTY AnsweredEndpointAlwaysEventuallyResolves

\* Deadlock checking is off BY DESIGN. A permanently silent endpoint is an
\* intended resting state: silence is not proof, this design will not demote on
\* it, and TLC would report that correct refusal as a deadlock. The signal here
\* is `AnsweredEndpointAlwaysEventuallyResolves`, which ignores the silent case
\* precisely because its antecedent is only reachable through an action the
\* endpoint took.
CHECK_DEADLOCK FALSE
