name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tmux for integration tests
        run: sudo apt-get update && sudo apt-get install -y tmux

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run make check
        run: make check

      - name: Run make tmux-ci
        run: |
          echo "Running make tmux-ci"
          make tmux-ci
