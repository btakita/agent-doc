agent-doc-tmux-commands = { path = "../agent-doc-tmux-commands", version = "0.34.162" }
agent-doc-tmux-io = { path = "../agent-doc-tmux-io", version = "0.34.162" }
anyhow = "1"
tmux-router = { path = "../../tmux-router", version = "0.3.14" }
