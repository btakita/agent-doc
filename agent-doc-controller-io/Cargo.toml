[package]
name = "agent-doc-controller-io"
version = "0.35.28"
edition = "2024"
description = "Controller filesystem/log adapters for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_controller_io"

[features]
test-support = []

[dependencies]
agent-doc-state-scope = { path = "../agent-doc-state-scope", version = "0.35.28" }
parking_lot = "0.12"
agent-doc-controller = { path = "../agent-doc-controller", version = "0.35.28" }
agent-doc-capture-io = { path = "../agent-doc-capture-io", version = "0.35.28" }
agent-doc-crdt-relay-io = { path = "../agent-doc-crdt-relay-io", version = "0.35.28" }
agent-doc-cycle-state-io = { path = "../agent-doc-cycle-state-io", version = "0.35.28" }
agent-doc-debounce = { path = "../agent-doc-debounce", version = "0.35.28" }
agent-doc-document = { path = "../agent-doc-document", version = "0.35.28" }
agent-doc-document-realtime = { path = "../agent-doc-document-realtime", version = "0.35.28" }
agent-doc-flow = { path = "../agent-doc-flow", version = "0.35.28" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.35.28" }
agent-doc-frontmatter-io = { path = "../agent-doc-frontmatter-io", version = "0.35.28" }
agent-doc-fs = { path = "../agent-doc-fs", version = "0.35.28" }
agent-doc-lease = { path = "../agent-doc-lease", version = "0.35.28" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.35.28" }
agent-doc-harness = { path = "../agent-doc-harness", version = "0.35.28" }
agent-doc-merge = { path = "../agent-doc-merge", version = "0.35.28" }
agent-doc-ipc-io = { path = "../agent-doc-ipc-io", version = "0.35.28" }
agent-doc-ops-log-io = { path = "../agent-doc-ops-log-io", version = "0.35.28" }
agent-doc-process-owner-io = { path = "../agent-doc-process-owner-io", version = "0.35.28" }
agent-doc-project-config-io = { path = "../agent-doc-project-config-io", version = "0.35.28" }
agent-doc-project-root-io = { path = "../agent-doc-project-root-io", version = "0.35.28" }
agent-doc-queue = { path = "../agent-doc-queue", version = "0.35.28" }
agent-doc-reliable-sync-io = { path = "../agent-doc-reliable-sync-io", version = "0.35.28" }
agent-doc-secret-redact = { path = "../agent-doc-secret-redact", version = "0.35.28" }
agent-doc-session-actor-io = { path = "../agent-doc-session-actor-io", version = "0.35.28" }
agent-doc-session-registry-io = { path = "../agent-doc-session-registry-io", version = "0.35.28" }
agent-doc-snapshot-io = { path = "../agent-doc-snapshot-io", version = "0.35.28" }
agent-doc-sqlite = { path = "../agent-doc-sqlite", version = "0.35.28" }
agent-doc-state-backbone = { path = "../agent-doc-state-backbone", version = "0.35.28" }
agent-doc-state-wire = { path = "../agent-doc-state-wire", version = "0.35.28" }
agent-doc-supervisor = { path = "../agent-doc-supervisor", version = "0.35.28" }
agent-doc-supervisor-io = { path = "../agent-doc-supervisor-io", version = "0.35.28" }
agent-doc-supervisor-process = { path = "../agent-doc-supervisor-process", version = "0.35.28" }
agent-doc-tmux = { path = "../agent-doc-tmux", version = "0.35.28" }
agent-doc-tmux-commands = { path = "../agent-doc-tmux-commands", version = "0.35.28" }
agent-doc-tmux-io = { path = "../agent-doc-tmux-io", version = "0.35.28" }
agent-doc-turn-executor = { path = "../agent-doc-turn-executor", version = "0.35.28" }
agent-doc-turn = { path = "../agent-doc-turn", version = "0.35.28" }
anyhow = "1"
base64 = "0.22"
interprocess = { version = "2", default-features = false }
lazily = { version = "0.49.0", features = ["thread-safe", "ipc", "durable-sqlite"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tmux-router = { path = "../../tmux-router", version = "0.3.14" }
tracing = "0.1"

# S4b cross-platform process-exit watcher: Windows liveness via a process handle.
# Unix (Linux + macOS) uses `libc::kill(pid, 0)` above; this covers the Windows leg.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
