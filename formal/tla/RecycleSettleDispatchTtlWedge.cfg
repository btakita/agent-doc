\* Pre-R9 (`#netadv5`): an elapsed TTL is read as proof that the settle was
\* lost, so dispatch proceeds while the supervisor is alive and still recycling.
\* MUST violate NeverProceedsPastALiveRecycle.
SPECIFICATION Spec

CONSTANTS
    Horizon = 6
    Ttl = 3
    WaitBudget = 1
    SingleShotVerdict = FALSE
    Stamped = TRUE
    TtlIsProof = TRUE

INVARIANT NeverProceedsPastALiveRecycle
