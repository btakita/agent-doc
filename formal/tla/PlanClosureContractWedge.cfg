\* Non-vacuity obligation: with the derivation ungated, the plan pre-fills
\* `--done` for every head still sitting in the queue component - including a
\* queue preflight has already resolved as inactive, and including an
\* `[operator-verify]` id no agent turn can ever execute. `scripts/run_tla.sh`
\* lists this cfg as must-violate.
SPECIFICATION Spec

CONSTANTS
    Ids = {a, b}
    OperatorGated = {b}
    GateDoneOnDispatch = FALSE

INVARIANT TypeOK
INVARIANT NeverClosesUnexecutedWork
INVARIANT NeverClosesOperatorGatedWork
INVARIANT QueueResidueIsNotDispatch
