[package]
name = "agent-doc-diff"
version = "0.34.164"
edition = "2024"
description = "Pure diff annotation, classification, and prompt-bearing change policy for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_diff"

[dependencies]
agent-doc-element = { path = "../agent-doc-element", version = "0.34.164" }
agent-doc-element-backlog = { path = "../agent-doc-element-backlog", version = "0.34.164" }
agent-doc-prompt-lines = { path = "../agent-doc-prompt-lines", version = "0.34.164" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.34.164" }
agent-doc-markdown-ast = { path = "../agent-doc-markdown-ast", version = "0.34.164" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"

[dev-dependencies]
tempfile = "3"
