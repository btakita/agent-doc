[package]
name = "agent-doc-run-context-io"
version = "0.35.188"
edition = "2024"
description = "Lazily-backed run and actor context IO cache for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_run_context_io"

[dependencies]
# `#relaylockpoison`: locks here are parking_lot, not `std::sync` — the workspace
# keeps `panic=unwind` so the cdylib's `catch_unwind` guards survive a panic in a
# host IDE, but that unwind passes THROUGH any live guard, so a poisoning mutex
# turns a survivable panic into a permanent process-wide outage.
parking_lot = "0.12"
agent-doc-config = { path = "../agent-doc-config", version = "0.35.188" }
agent-doc-cycle-state-io = { path = "../agent-doc-cycle-state-io", version = "0.35.188" }
agent-doc-document-realtime = { path = "../agent-doc-document-realtime", version = "0.35.188" }
agent-doc-element = { path = "../agent-doc-element", version = "0.35.188" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.35.188" }
agent-doc-frontmatter-io = { path = "../agent-doc-frontmatter-io", version = "0.35.188" }
agent-doc-fs = { path = "../agent-doc-fs", version = "0.35.188" }
agent-doc-git-io = { path = "../agent-doc-git-io", version = "0.35.188" }
agent-doc-model-tier = { path = "../agent-doc-model-tier", version = "0.35.188" }
agent-doc-project-config-io = { path = "../agent-doc-project-config-io", version = "0.35.188" }
agent-doc-project-root-io = { path = "../agent-doc-project-root-io", version = "0.35.188" }
agent-doc-session-registry-io = { path = "../agent-doc-session-registry-io", version = "0.35.188" }
agent-doc-snapshot-io = { path = "../agent-doc-snapshot-io", version = "0.35.188" }
anyhow = "1"
lazily = "0.56.0"
tmux-router = { path = "../../tmux-router", version = "0.3.14" }

[dev-dependencies]
agent-doc-ops-log-io = { path = "../agent-doc-ops-log-io", version = "0.35.188" }
tempfile = "3"
