[package]
name = "agent-doc-syntax"
version = "0.34.74"
edition = "2024"
description = "Pure editor visual syntax tokenization for agent-doc documents"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_syntax"

[dependencies]
agent-doc-element = { path = "../agent-doc-element", version = "0.34.74" }
serde = { version = "1", features = ["derive"] }
