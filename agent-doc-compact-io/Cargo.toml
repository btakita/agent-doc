[package]
name = "agent-doc-compact-io"
version = "0.34.67"
edition = "2024"
description = "Compact command I/O for agent-doc session archives"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_compact_io"

[dependencies]
agent-doc-capture-io = { path = "../agent-doc-capture-io", version = "0.34.67" }
agent-doc-cycle-state-io = { path = "../agent-doc-cycle-state-io", version = "0.34.67" }
agent-doc-document = { path = "../agent-doc-document", version = "0.34.67" }
agent-doc-element = { path = "../agent-doc-element", version = "0.34.67" }
agent-doc-element-backlog = { path = "../agent-doc-element-backlog", version = "0.34.67" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.34.67" }
agent-doc-fs = { path = "../agent-doc-fs", version = "0.34.67" }
agent-doc-git-io = { path = "../agent-doc-git-io", version = "0.34.67" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.34.67" }
agent-doc-ipc-io = { path = "../agent-doc-ipc-io", version = "0.34.67" }
agent-doc-merge = { path = "../agent-doc-merge", version = "0.34.67" }
agent-doc-merge-io = { path = "../agent-doc-merge-io", version = "0.34.67" }
agent-doc-ops-log-io = { path = "../agent-doc-ops-log-io", version = "0.34.67" }
agent-doc-project-root-io = { path = "../agent-doc-project-root-io", version = "0.34.67" }
agent-doc-session-accretion-io = { path = "../agent-doc-session-accretion-io", version = "0.34.67" }
agent-doc-snapshot-io = { path = "../agent-doc-snapshot-io", version = "0.34.67" }
agent-doc-sqlite = { path = "../agent-doc-sqlite", version = "0.34.67" }
agent-doc-template = { path = "../agent-doc-template", version = "0.34.67" }
agent-doc-topic = { path = "../agent-doc-topic", version = "0.34.67" }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
agent-doc-controller-io = { path = "../agent-doc-controller-io", version = "0.34.67" }
agent-doc-commit-io = { path = "../agent-doc-commit-io", version = "0.34.67", features = ["test-support"] }
agent-doc-crdt-relay-io = { path = "../agent-doc-crdt-relay-io", version = "0.34.67" }
agent-doc-debounce = { path = "../agent-doc-debounce", version = "0.34.67" }
agent-doc-document-realtime-io = { path = "../agent-doc-document-realtime-io", version = "0.34.67", features = ["test-support"] }
agent-doc-markdown-ast = { path = "../agent-doc-markdown-ast", version = "0.34.67" }
agent-doc-plugin-owner = { path = "../agent-doc-plugin-owner", version = "0.34.67" }
agent-doc-write-converge-io = { path = "../agent-doc-write-converge-io", version = "0.34.67", features = ["test-support"] }
serde_json = "1"
tempfile = "3"
