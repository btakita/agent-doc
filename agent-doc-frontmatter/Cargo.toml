[package]
name = "agent-doc-frontmatter"
version = "0.35.562"
edition = "2024"
description = "Pure frontmatter and project configuration parsing for agent-doc"
license = "Apache-2.0"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_frontmatter"

[dependencies]
agent-doc-model-tier = { path = "../agent-doc-model-tier", version = "0.35.562" }
agent-doc-queue-icons = { path = "../agent-doc-queue-icons", version = "0.35.562" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
toml = "1.1"
uuid = { version = "1", features = ["v4"] }
