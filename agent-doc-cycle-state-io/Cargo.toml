[package]
name = "agent-doc-cycle-state-io"
version = "0.35.172"
edition = "2024"
description = "Durable per-document closeout state-machine I/O for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[features]
test-support = []

[lib]
name = "agent_doc_cycle_state_io"

[dependencies]
agent-doc-controller = { path = "../agent-doc-controller", version = "0.35.172" }
agent-doc-document = { path = "../agent-doc-document", version = "0.35.172" }
agent-doc-element-backlog = { path = "../agent-doc-element-backlog", version = "0.35.172" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.35.172" }
agent-doc-fs = { path = "../agent-doc-fs", version = "0.35.172" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.35.172" }
agent-doc-merge = { path = "../agent-doc-merge", version = "0.35.172" }
agent-doc-queue = { path = "../agent-doc-queue", version = "0.35.172" }
agent-doc-project-root-io = { path = "../agent-doc-project-root-io", version = "0.35.172" }
agent-doc-sqlite = { path = "../agent-doc-sqlite", version = "0.35.172" }
agent-doc-state-backbone = { path = "../agent-doc-state-backbone", version = "0.35.172" }
agent-doc-state-wire = { path = "../agent-doc-state-wire", version = "0.35.172" }
agent-doc-supervisor-io = { path = "../agent-doc-supervisor-io", version = "0.35.172" }
agent-doc-turn = { path = "../agent-doc-turn", version = "0.35.172" }
anyhow = "1"
lazily = { version = "0.56.0", features = ["ipc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
