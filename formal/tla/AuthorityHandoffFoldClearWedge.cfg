\* `#orphanhandoffoverlay` tempting fix: clear the entry because its row is gone,
\* without folding the ledger. Reads lose the authority the overlay held. MUST
\* violate OverlayClearImpliesFolded.
SPECIFICATION Spec

CONSTANTS
    FoldOnLateDuplicate = TRUE
    ReconcileAckReceipts = TRUE
    OrphanRule = "clear"

INVARIANT OverlayClearImpliesFolded

CHECK_DEADLOCK FALSE
