[package]
name = "agent-doc"
version = "0.35.214"
edition = "2024"
description = "Interactive document sessions with AI agents"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false
readme = "README.md"
exclude = [
    "editors/jetbrains/build/**",
    "editors/jetbrains/gradle/**",
    "editors/jetbrains/.gradle/**",
    "editors/vscode/node_modules/**",
    "editors/vscode/out/**",
    ".agent-doc/**",
    "docs/book/**",
]

[lib]
name = "agent_doc"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "agent-doc"
path = "src/main.rs"

[dependencies]
# `#relaylockpoison`: locks here are parking_lot, not `std::sync` — the workspace
# keeps `panic=unwind` so the cdylib's `catch_unwind` guards survive a panic in a
# host IDE, but that unwind passes THROUGH any live guard, so a poisoning mutex
# turns a survivable panic into a permanent process-wide outage.
parking_lot = "0.12"
agent-doc-admin-io = { path = "agent-doc-admin-io", version = "0.35.214" }
agent-doc-archive-io = { path = "agent-doc-archive-io", version = "0.35.214" }
