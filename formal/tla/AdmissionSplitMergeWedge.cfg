SPECIFICATION Spec

\* Non-vacuity. The pre-fix ladder: an `equals_authority` answer falls through
\* to the line rung and nothing checks for added lines. `NoDuplicateItem` MUST
\* be violated -- the infra.md duplicate of 2026-09-30. The twin collapse is
\* ON here: it does not cover two edits of a BASELINE item, so the count guard
\* stays load-bearing beside it.
CONSTANTS
    StopOnEqualsAuthority = FALSE
    DuplicateGuard = FALSE
    TwinPairGuard = TRUE
    TwinCollapse = "input"

INVARIANT TypeOK
INVARIANT NoDuplicateItem
