[package]
name = "agent-doc-start-io"
version = "0.34.162"
edition = "2024"
description = "Start command runtime I/O for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_start_io"

[dependencies]
