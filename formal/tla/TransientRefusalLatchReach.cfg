\* REACH obligation: asserting progress never happens must itself be violated.
\* `StableResponderIsEventuallyServed` is a conditional property, so without
\* this it could pass because its consequent is unreachable by modelling rather
\* than because the design delivers it.
SPECIFICATION Spec

