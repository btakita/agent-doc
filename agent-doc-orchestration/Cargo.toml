[package]
name = "agent-doc-orchestration"
version = "0.34.66"
edition = "2024"
description = "Orchestration layer for agent-doc (routing, git, sessions, IPC, supervision, sync) — adapts the CLI to focused domain crates"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_orchestration"

[features]
# Exposes the in-process controller test short-circuits to downstream crates'
# test builds (the `agent-doc` CLI shell enables this in dev-dependencies so its
# tests that call `project_controller` behave as they did pre-extraction).
test-support = []

[dependencies]
agent-doc-config = { path = "../agent-doc-config", version = "0.34.66" }
agent-doc-callback-io = { path = "../agent-doc-callback-io", version = "0.34.66" }
agent-doc-controller = { path = "../agent-doc-controller", version = "0.34.66" }
agent-doc-debounce = { path = "../agent-doc-debounce", version = "0.34.66" }
agent-doc-diff = { path = "../agent-doc-diff", version = "0.34.66" }
agent-doc-document = { path = "../agent-doc-document", version = "0.34.66" }
agent-doc-document-realtime = { path = "../agent-doc-document-realtime", version = "0.34.66" }
agent-doc-element = { path = "../agent-doc-element", version = "0.34.66" }
agent-doc-element-backlog = { path = "../agent-doc-element-backlog", version = "0.34.66" }
agent-doc-element-boundary = { path = "../agent-doc-element-boundary", version = "0.34.66" }
agent-doc-element-exchange = { path = "../agent-doc-element-exchange", version = "0.34.66" }
agent-doc-element-queue = { path = "../agent-doc-element-queue", version = "0.34.66" }
agent-doc-element-review = { path = "../agent-doc-element-review", version = "0.34.66" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.34.66" }
agent-doc-fs = { path = "../agent-doc-fs", version = "0.34.66" }
agent-doc-git = { path = "../agent-doc-git", version = "0.34.66" }
agent-doc-git-io = { path = "../agent-doc-git-io", version = "0.34.66" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.34.66" }
agent-doc-harness = { path = "../agent-doc-harness", version = "0.34.66" }
agent-doc-ipc-protocol = { path = "../agent-doc-ipc-protocol", version = "0.34.66" }
agent-doc-lease = { path = "../agent-doc-lease", version = "0.34.66" }
agent-doc-log-time = { path = "../agent-doc-log-time", version = "0.34.66" }
agent-doc-markdown-ast = { path = "../agent-doc-markdown-ast", version = "0.34.66" }
agent-doc-memory = { path = "../agent-doc-memory", version = "0.34.66" }
agent-doc-merge = { path = "../agent-doc-merge", version = "0.34.66" }
agent-doc-model-tier = { path = "../agent-doc-model-tier", version = "0.34.66" }
agent-doc-plugin-owner = { path = "../agent-doc-plugin-owner", version = "0.34.66" }
agent-doc-project-config-io = { path = "../agent-doc-project-config-io", version = "0.34.66" }
agent-doc-prompt-cache = { path = "../agent-doc-prompt-cache", version = "0.34.66" }
agent-doc-prompt-contract = { path = "../agent-doc-prompt-contract", version = "0.34.66" }
agent-doc-prompt-context = { path = "../agent-doc-prompt-context", version = "0.34.66" }
agent-doc-prompt-lines = { path = "../agent-doc-prompt-lines", version = "0.34.66" }
agent-doc-queue = { path = "../agent-doc-queue", version = "0.34.66" }
agent-doc-queue-io = { path = "../agent-doc-queue-io", version = "0.34.66" }
agent-doc-response-toc-io = { path = "../agent-doc-response-toc-io", version = "0.34.66" }
agent-doc-secret-redact = { path = "../agent-doc-secret-redact", version = "0.34.66" }
agent-doc-session-accretion = { path = "../agent-doc-session-accretion", version = "0.34.66" }
agent-doc-sqlite = { path = "../agent-doc-sqlite", version = "0.34.66" }
agent-doc-supervisor = { path = "../agent-doc-supervisor", version = "0.34.66" }
agent-doc-supervisor-io = { path = "../agent-doc-supervisor-io", version = "0.34.66" }
agent-doc-supervisor-process = { path = "../agent-doc-supervisor-process", version = "0.34.66" }
agent-doc-sync = { path = "../agent-doc-sync", version = "0.34.66" }
agent-doc-template = { path = "../agent-doc-template", version = "0.34.66" }
agent-doc-tmux = { path = "../agent-doc-tmux", version = "0.34.66" }
agent-doc-tmux-commands = { path = "../agent-doc-tmux-commands", version = "0.34.66" }
agent-doc-tmux-io = { path = "../agent-doc-tmux-io", version = "0.34.66" }
agent-doc-topic = { path = "../agent-doc-topic", version = "0.34.66" }
agent-doc-turn-executor = { path = "../agent-doc-turn-executor", version = "0.34.66" }
agent-doc-turn-executor-tmux = { path = "../agent-doc-turn-executor-tmux", version = "0.34.66" }
agent-doc-turn-status-io = { path = "../agent-doc-turn-status-io", version = "0.34.66" }
agent-doc-turn = { path = "../agent-doc-turn", version = "0.34.66" }
agent-doc-watch-io = { path = "../agent-doc-watch-io", version = "0.34.66" }
agent-doc-workflow = { path = "../agent-doc-workflow", version = "0.34.66" }
agent-doc-work-graph = { path = "../agent-doc-work-graph", version = "0.34.66" }
lazily = "0.13.1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
similar = "3"
toml = "1.1"
ureq = { version = "3", features = ["json"] }
tempfile = "3"
zip = "8"
uuid = { version = "1", features = ["v4"] }
notify = "8"
agent-kit = { version = "0.4.1", features = ["hooks"] }
instruction-files = "0.3"
tmux-router = { path = "../../tmux-router", version = "0.3.11" }
base64 = "0.22"
regex = "1"
yrs = "0.27"
interprocess = { version = "2", default-features = false }
htmd = "0.5.3"
indexmap = { version = "2", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
libc = "0.2"
portable-pty = "0.9"
alacritty_terminal = "0.26"
tagpath = { version = "0.12.1", default-features = false }
tiny_http = { version = "0.12", default-features = false, features = ["ssl-rustls"] }
tsift-memory = "0.1.70"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
# Property tests for the unified queue convergence (`#cgfx`) prove idempotence /
# no-op-re-emit over generated duplication shapes (`#rt83qflood`, `#qdedupsync`,
# `#qauthorder`, `#qdup-bare-id`, `#pushpinaccum`). Matches the existing
# proptest-based closeout model coverage in the binary crate's `tests/`.
proptest = "1"
# Controller-state tests open `agent-doc-sqlite`'s state DB directly to assert
# the schema/rows the `state_store` seam writes. The SQLite layer itself lives
# in `agent-doc-sqlite`; this dev-only dependency keeps those tests compiling
# without pulling `rusqlite` into orchestration's normal build graph.
rusqlite = { version = "0.40", features = ["bundled"] }
