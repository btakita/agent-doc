name: PyPI

# `#pypislim`: PyPI carries one platform-independent bootstrap wheel, not four
# copies of the native executable and FFI library. The launcher downloads the
# matching checksummed archive from this version's GitHub Release on first run.
# The wheel is small enough to publish on every tag without consuming the
# project's storage quota, and publish waits for SHA256SUMS so a newly visible
# wheel never points at release assets that are still being assembled.
#
# `release: published` is kept for releases published by hand. Tag pushes stayed
# the trigger of record because GitHub deliberately does not raise
# workflow-triggering events for token-authored actions, so `release: published`
# silently stopped firing once release creation moved into CI and 0.35.97
# through 0.35.118 never reached PyPI. `skip-existing` makes the overlap
# harmless.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test and build the bootstrap wheel
        run: |
          set -euo pipefail
          python -m unittest discover -s python/tests -v
          python -m pip install --disable-pip-version-check build
          python -m build --wheel

      - name: Verify the wheel is universal and contains no native payload
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, os, sys, zipfile

          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              sys.exit(f"expected one wheel, found {wheels}")
          wheel = wheels[0]
          names = zipfile.ZipFile(wheel).namelist()
          native_suffixes = (".so", ".dylib", ".dll", ".exe")
          if not wheel.endswith("py3-none-any.whl") or any(name.endswith(native_suffixes) for name in names):
              sys.exit(f"wheel is not a native-free py3-none-any bootstrap: {wheel}\n" + "\n".join(names))
          if os.path.getsize(wheel) > 256 * 1024:
              sys.exit(f"bootstrap wheel unexpectedly exceeds 256 KiB: {wheel}")
          print(f"{wheel}: {os.path.getsize(wheel)} bytes, native-free")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-bootstrap
          path: dist
          retention-days: 1

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - name: Wait for the matching GitHub Release checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          for attempt in $(seq 1 90); do
            if gh release download "$tag" --pattern SHA256SUMS --dir /tmp/agent-doc-release-ready >/dev/null 2>&1; then
              echo "GitHub Release $tag is ready"
              exit 0
            fi
            sleep 20
          done
          echo "::error::GitHub Release $tag did not publish SHA256SUMS within 30 minutes"
          exit 1

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  # GH #52 part 2: PyPI drifted 20 versions behind the newest tag without
  # surfacing anywhere, because a failed upload only reddens a job nobody was
  # watching. Assert the version this run was supposed to publish is actually
  # resolvable on PyPI, so a quota block or a skipped upload fails loudly at the
  # moment it happens instead of being discovered by a user whose
  # `pip install --upgrade` silently downgraded them.
  verify:
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Verify the tagged version is live on PyPI
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/v}"
          for attempt in 1 2 3 4 5 6; do
            if curl -sfL "https://pypi.org/pypi/agent-doc/${version}/json" >/dev/null; then
              echo "agent-doc ${version} is live on PyPI"
              exit 0
            fi
            echo "attempt ${attempt}: agent-doc ${version} not visible yet; waiting"
            sleep 20
          done
          echo "::error::agent-doc ${version} is not on PyPI after a successful publish job — check the project size quota (pypi/support#12214) and the upload logs"
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify a clean PyPI install fetches the pinned native release
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python -m venv /tmp/agent-doc-pypi-verify
          /tmp/agent-doc-pypi-verify/bin/pip install --disable-pip-version-check --no-cache-dir "agent-doc==${version}"
          installed=$(/tmp/agent-doc-pypi-verify/bin/agent-doc --version)
          test "$installed" = "agent-doc ${version}"
