[package]
name = "agent-doc-prompt-context"
version = "0.35.25"
edition = "2024"
description = "Pure prompt context rendering helpers for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_prompt_context"

[dependencies]
agent-doc-diff = { path = "../agent-doc-diff", version = "0.35.25" }
agent-doc-element = { path = "../agent-doc-element", version = "0.35.25" }
agent-doc-element-backlog = { path = "../agent-doc-element-backlog", version = "0.35.25" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.35.25" }
agent-doc-session-accretion = { path = "../agent-doc-session-accretion", version = "0.35.25" }
lazily = "0.48.1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
