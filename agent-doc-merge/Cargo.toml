[package]
name = "agent-doc-merge"
version = "0.34.69"
edition = "2024"
description = "Pure merge policy functions for agent-doc documents"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_merge"

[dependencies]
agent-doc-element = { path = "../agent-doc-element", version = "0.34.69" }
agent-doc-element-queue = { path = "../agent-doc-element-queue", version = "0.34.69" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.34.69" }
agent-doc-markdown-ast = { path = "../agent-doc-markdown-ast", version = "0.34.69" }
agent-doc-markdown-lossless = { path = "../agent-doc-markdown-lossless", version = "0.34.69" }
anyhow = "1"
lazily = { version = "0.21", features = ["serde", "thread-safe"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"

[dev-dependencies]
serde_json = "1"
