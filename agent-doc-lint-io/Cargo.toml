[package]
name = "agent-doc-lint-io"
version = "0.35.69"
edition = "2024"
description = "Tagpath lint gate adapter for agent-doc finalize flows"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_lint_io"

[dependencies]
agent-doc-document-realtime-io = { path = "../agent-doc-document-realtime-io", version = "0.35.69" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.35.69" }
agent-doc-element = { path = "../agent-doc-element", version = "0.35.69" }
agent-doc-element-registry = { path = "../agent-doc-element-registry", version = "0.35.69" }
agent-doc-project-config-io = { path = "../agent-doc-project-config-io", version = "0.35.69" }
anyhow = "1"
tagpath = { version = "0.12.1", default-features = false }

[dev-dependencies]
tempfile = "3"
