\* Safety of the fixed design under the adversary with a reconnect, two frontend
\* handoffs and three observations (invariants only; no fairness needed).
\* Duplication is checked separately (PassiveTmuxSyncRetireNetDuplicateSafety):
\* with both at once the bag of in-flight messages exceeds 10^8 states.
SPECIFICATION Spec

CONSTANTS
    MaxCopies = 1
    MaxGen = 1
    MaxSeq = 3
    MaxCGen = 3
    MaxHandoffs = 2
    RetireOnNewerReply = FALSE
    ReregisterOnRetired = TRUE
    RetireRaisesFence = TRUE
    RetiredFence = TRUE

INVARIANT TypeOK
INVARIANT NoRetiredResurrection
INVARIANT ControllerGenerationNeverAheadOfEditor

\* A settled focus is a resting state, not a deadlock.
CHECK_DEADLOCK FALSE
