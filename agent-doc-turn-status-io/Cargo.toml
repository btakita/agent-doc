[package]
name = "agent-doc-turn-status-io"
version = "0.34.65"
edition = "2024"
description = "Turn-status marker and tmux title I/O for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_turn_status_io"

[dependencies]
agent-doc-fs = { path = "../agent-doc-fs", version = "0.34.65" }
agent-doc-turn = { path = "../agent-doc-turn", version = "0.34.65" }
anyhow = "1"
serde_json = "1"
tmux-router = { path = "../../tmux-router", version = "0.3.11" }

[dev-dependencies]
tempfile = "3"
