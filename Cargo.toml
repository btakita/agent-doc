[package]
name = "agent-doc"
version = "0.34.65"
edition = "2024"
description = "Interactive document sessions with AI agents"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
readme = "README.md"
exclude = [
    "editors/jetbrains/build/**",
    "editors/jetbrains/gradle/**",
    "editors/jetbrains/.gradle/**",
    "editors/vscode/node_modules/**",
    "editors/vscode/out/**",
    ".agent-doc/**",
    "docs/book/**",
]

[lib]
name = "agent_doc"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "agent-doc"
path = "src/main.rs"

[dependencies]
agent-doc-controller = { path = "agent-doc-controller", version = "0.34.65" }
agent-doc-debounce = { path = "agent-doc-debounce", version = "0.34.65" }
agent-doc-diff = { path = "agent-doc-diff", version = "0.34.65" }
agent-doc-document-realtime = { path = "agent-doc-document-realtime", version = "0.34.65" }
agent-doc-element = { path = "agent-doc-element", version = "0.34.65" }
agent-doc-element-backlog = { path = "agent-doc-element-backlog", version = "0.34.65" }
agent-doc-element-boundary = { path = "agent-doc-element-boundary", version = "0.34.65" }
agent-doc-element-review = { path = "agent-doc-element-review", version = "0.34.65" }
agent-doc-ffi = { path = "agent-doc-ffi", version = "0.34.65" }
agent-doc-frontmatter = { path = "agent-doc-frontmatter", version = "0.34.65" }
agent-doc-fs = { path = "agent-doc-fs", version = "0.34.65" }
agent-doc-hash = { path = "agent-doc-hash", version = "0.34.65" }
agent-doc-markdown-ast = { path = "agent-doc-markdown-ast", version = "0.34.65" }
agent-doc-merge = { path = "agent-doc-merge", version = "0.34.65" }
agent-doc-model-tier = { path = "agent-doc-model-tier", version = "0.34.65" }
agent-doc-orchestration = { path = "agent-doc-orchestration", version = "0.34.65" }
agent-doc-project-config-io = { path = "agent-doc-project-config-io", version = "0.34.65" }
agent-doc-prompt-context = { path = "agent-doc-prompt-context", version = "0.34.65" }
agent-doc-prompt-contract = { path = "agent-doc-prompt-contract", version = "0.34.65" }
agent-doc-queue = { path = "agent-doc-queue", version = "0.34.65" }
agent-doc-response-toc-io = { path = "agent-doc-response-toc-io", version = "0.34.65" }
agent-doc-secret-redact = { path = "agent-doc-secret-redact", version = "0.34.65" }
agent-doc-session-accretion = { path = "agent-doc-session-accretion", version = "0.34.65" }
agent-doc-sqlite = { path = "agent-doc-sqlite", version = "0.34.65" }
agent-doc-supervisor = { path = "agent-doc-supervisor", version = "0.34.65" }
agent-doc-template = { path = "agent-doc-template", version = "0.34.65" }
agent-doc-tmux-commands = { path = "agent-doc-tmux-commands", version = "0.34.65" }
agent-doc-turn = { path = "agent-doc-turn", version = "0.34.65" }
agent-doc-turn-executor = { path = "agent-doc-turn-executor", version = "0.34.65" }
agent-doc-workflow = { path = "agent-doc-workflow", version = "0.34.65" }
agent-doc-work-graph = { path = "agent-doc-work-graph", version = "0.34.65" }
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
toml = "1.1"
ureq = { version = "3", features = ["json"] }
tempfile = "3"
zip = "8"
uuid = { version = "1", features = ["v4"] }
notify = "8"
agent-kit = { version = "0.4.1", features = ["hooks"] }
instruction-files = "0.3"
tmux-router = { path = "../tmux-router", version = "0.3.11" }
pulldown-cmark = "0.13"
indexmap = { version = "2", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
libc = "0.2"
tiny_http = { version = "0.12", default-features = false, features = ["ssl-rustls"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

# Heavy deps removed from the CLI shell in #bz6s Wave 5 — now reached only
# transitively through agent-doc-orchestration (acceptance criterion #2):
# alacritty_terminal, fs2, hex, htmd, interprocess, portable-pty, regex,
# rusqlite, serde_yaml, signal-hook, tagpath, yrs.

[dev-dependencies]
# Enable orchestration's in-process controller test short-circuits for the CLI
# shell's own tests (project_controller moved to orchestration in #bz6s).
agent-doc-element-queue = { path = "agent-doc-element-queue", version = "0.34.65" }
agent-doc-orchestration = { path = "agent-doc-orchestration", version = "0.34.65", features = ["test-support"] }
assert_cmd = "2"
existence = "0.4"
filetime = "0.2"
module-harness = "0.2.1"
predicates = "3"
proptest = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-local]
inherits = "release"
lto = "off"
codegen-units = 256
incremental = true
strip = false
