[package]
name = "agent-doc-work-graph"
version = "0.34.100"
edition = "2024"
description = "Pure work-graph analysis and rendering for agent-doc work items"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_work_graph"

[dependencies]
agent-doc-element = { path = "../agent-doc-element", version = "0.34.100" }
agent-doc-element-backlog = { path = "../agent-doc-element-backlog", version = "0.34.100" }
agent-doc-flow = { path = "../agent-doc-flow", version = "0.34.100" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
