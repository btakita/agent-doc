[package]
name = "agent-doc-cycle-state-io"
version = "0.34.67"
edition = "2024"
description = "Durable per-document cycle-state sidecar I/O for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_cycle_state_io"

[dependencies]
agent-doc-document = { path = "../agent-doc-document", version = "0.34.67" }
agent-doc-element-backlog = { path = "../agent-doc-element-backlog", version = "0.34.67" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.34.67" }
agent-doc-fs = { path = "../agent-doc-fs", version = "0.34.67" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.34.67" }
agent-doc-merge = { path = "../agent-doc-merge", version = "0.34.67" }
agent-doc-queue = { path = "../agent-doc-queue", version = "0.34.67" }
agent-doc-supervisor-io = { path = "../agent-doc-supervisor-io", version = "0.34.67" }
agent-doc-turn = { path = "../agent-doc-turn", version = "0.34.67" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
