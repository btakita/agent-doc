SPECIFICATION Spec

\* Non-vacuity. The shipped behaviour: registration adopts the CRDT over the
\* editor and a handoff reseeds the CRDT from disk. `NoRollback` MUST be
\* violated -- the api.md rollback of 2026-09-29.
CONSTANTS
    Editors = {e1, e2}
    OperatorAtoms = {o1, o2}
    AgentAtoms = {a1}
    EditorAuthority = FALSE

INVARIANT TypeOK
INVARIANT NoRollback
