\* Non-vacuity obligation (reach): the editor-native save through a STILL
\* SERVING live editor must remain reachable. Asserted negated, so this cfg is
\* must-violate. Without it, a "fix" that pushed every document through the
\* drop/detached-write path would satisfy the liveness property while having
\* silently abandoned the native-save path the receipt exists to gate.
SPECIFICATION Spec

CONSTANTS
    MaxNonconvergence = 2
    DropOnDefinitiveRefusal = TRUE

INVARIANT TypeOK
INVARIANT NeverSavesThroughLiveEditor
