[package]
name = "agent-doc-callback-io"
version = "0.35.154"
edition = "2024"
description = "State-machine-backed callback request and response transport for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_callback_io"

[dependencies]
agent-doc-fs = { path = "../agent-doc-fs", version = "0.35.154" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.35.154" }
agent-doc-ipc-protocol = { path = "../agent-doc-ipc-protocol", version = "0.35.154" }
agent-doc-sqlite = { path = "../agent-doc-sqlite", version = "0.35.154" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
