SPECIFICATION Spec

\* `#keylogrebase`: the residual the text-only rule left open is closed by
\* provenance. With a correctly based op ledger that covers the authority's
\* and the native save's cuts, no component holding only the editor's own text
\* ever holds an item twice, and an attributed component converges to the
\* editor's final text exactly once.
CONSTANTS
    Policy = "provenance"
    N = 4
    LedgerBased = TRUE

INVARIANT TypeOK
INVARIANT NoDuplicateWhenCovered
INVARIANT ConvergesAttributed
INVARIANT NoDuplicateInConcurrentComponent
