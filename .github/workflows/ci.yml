name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # #ci-per-test-timeout-guard: CI installs cargo-nextest (step below) so
    # `make check` takes the nextest path and every individual test inherits the
    # per-test deadlock guard in .config/nextest.toml (60s x 3 = 180s, then the
    # hung test is killed and named). A lock/IPC deadlock now fails fast with a
    # backtrace instead of silently hanging. The job-level cap stays as a
    # backstop for NON-test hangs the per-test guard can't see (compile, doc
    # tests, tmux-ci): well above a legitimate cold run (~25-40 min) yet far
    # below GitHub's 6-hour default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check out agent-kit path dependency
        run: git clone --depth 1 https://github.com/btakita/agent-kit ../agent-kit

      - name: Check out tmux-router patch dependency
        run: git clone --depth 1 https://github.com/btakita/tmux-router ../tmux-router

      - name: Check out lazily-rs path dependency
        run: git clone --depth 1 https://github.com/btakita/lazily-rs ../lazily-rs

      - name: Install tmux for integration tests
        run: sudo apt-get update && sudo apt-get install -y tmux

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # #ci-per-test-timeout-guard: install nextest so `make check` uses the
      # nextest path, activating the per-test slow-timeout deadlock guard in
      # .config/nextest.toml. Without this, CI falls back to plain `cargo test`,
      # which has no per-test timeout.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run make check
        run: make check

      - name: Run make tmux-ci
        run: |
          echo "Running make tmux-ci"
          make tmux-ci
