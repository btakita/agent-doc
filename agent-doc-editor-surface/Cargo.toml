[package]
name = "agent-doc-editor-surface"
version = "0.35.517"
edition = "2024"
description = "Pure editor-surface observation and tmux-intent derivation for agent-doc"
license = "Apache-2.0"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_editor_surface"

[dependencies]
agent-doc-hash = { path = "../agent-doc-hash", version = "0.35.517" }
agent-doc-state-scope = { path = "../agent-doc-state-scope", version = "0.35.517" }
agent-doc-turn = { path = "../agent-doc-turn", version = "0.35.517" }
lazily = { version = "0.57.1", features = ["thread-safe"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
proptest = "1"
serde_json = "1"
