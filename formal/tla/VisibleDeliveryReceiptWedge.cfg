\* Non-vacuity obligation: with the drop edge removed, the refused-and-released
\* replica has no outgoing transition and the canonical cut never reaches disk.
\* `scripts/run_tla.sh` lists this cfg as must-violate, so a future change that
\* makes the wedge unreachable-by-modelling rather than unreachable-by-design
\* fails `make check` instead of passing it.
SPECIFICATION Spec

CONSTANTS
    MaxNonconvergence = 2
    DropOnDefinitiveRefusal = FALSE
    BuildMismatchIsDefinitive = TRUE

INVARIANT TypeOK
INVARIANT AvailabilityIsNotAReceipt
INVARIANT NeverSavesWithoutReceipt
INVARIANT DropRequiresDefinitiveRefusal
INVARIANT RefusalRequiresAnAnswer

PROPERTY CanonicalAlwaysEventuallyReachesDisk
