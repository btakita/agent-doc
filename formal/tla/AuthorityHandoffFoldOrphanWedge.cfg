\* `#orphanhandoffoverlay` pre-fix: the drain only walks durable rows, so an
\* overlay entry whose row a retired predecessor ACKed is never cleared. MUST
\* violate NoOrphanAtRest.
SPECIFICATION Spec

CONSTANTS
    FoldOnLateDuplicate = TRUE
    OrphanRule = "ignore"

INVARIANT NoOrphanAtRest

CHECK_DEADLOCK FALSE
