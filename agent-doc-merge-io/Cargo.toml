[package]
name = "agent-doc-merge-io"
version = "0.34.173"
edition = "2024"
description = "Git merge-file adapter for agent-doc merge policy"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_merge_io"

[dependencies]
agent-doc-fs = { path = "../agent-doc-fs", version = "0.34.173" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.34.173" }
agent-doc-merge = { path = "../agent-doc-merge", version = "0.34.173" }
agent-doc-op-capture-io = { path = "../agent-doc-op-capture-io", version = "0.34.173" }
agent-doc-snapshot-io = { path = "../agent-doc-snapshot-io", version = "0.34.173" }
anyhow = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
