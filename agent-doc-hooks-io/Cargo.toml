[package]
name = "agent-doc-hooks-io"
version = "0.35.51"
edition = "2024"
description = "Hook registry and document-hook I/O adapters for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_hooks_io"

[dependencies]
agent-doc-capture-io = { path = "../agent-doc-capture-io", version = "0.35.51" }
agent-doc-cycle-state-io = { path = "../agent-doc-cycle-state-io", version = "0.35.51" }
agent-doc-document-realtime-io = { path = "../agent-doc-document-realtime-io", version = "0.35.51" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.35.51" }
agent-doc-lease-io = { path = "../agent-doc-lease-io", version = "0.35.51" }
agent-doc-memory-io = { path = "../agent-doc-memory-io", version = "0.35.51" }
agent-doc-model-tier = { path = "../agent-doc-model-tier", version = "0.35.51" }
agent-kit = { version = "0.4.1", features = ["hooks"] }
agent-doc-turn = { path = "../agent-doc-turn", version = "0.35.51" }
agent-doc-element = { path = "../agent-doc-element", version = "0.35.51" }
agent-doc-fs = { path = "../agent-doc-fs", version = "0.35.51" }
agent-doc-session-registry-io = { path = "../agent-doc-session-registry-io", version = "0.35.51" }
anyhow = "1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
