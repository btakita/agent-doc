SPECIFICATION Spec

\* `#keylogrebase` wedge: provenance over the pre-fix ledger, labelled with the
\* merge baseline the editor looked up instead of the text its offsets are
\* relative to (`merge_base=97b41a5fa5b6` after the 2026-10-15 compaction). It
\* never replays onto the baseline, so nothing is attributed and
\* `NoDuplicateWhenCovered` MUST be violated: the ledger fix carries the claim.
CONSTANTS
    Policy = "provenance"
    N = 4
    LedgerBased = FALSE

INVARIANT TypeOK
INVARIANT NoDuplicateWhenCovered
