[package]
name = "agent-doc-merge"
version = "0.34.154"
edition = "2024"
description = "Pure merge policy functions for agent-doc documents"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_merge"

[dependencies]
agent-doc-element = { path = "../agent-doc-element", version = "0.34.154" }
agent-doc-element-queue = { path = "../agent-doc-element-queue", version = "0.34.154" }
agent-doc-document = { path = "../agent-doc-document", version = "0.34.154" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.34.154" }
agent-doc-markdown-ast = { path = "../agent-doc-markdown-ast", version = "0.34.154" }
agent-doc-markdown-lossless = { path = "../agent-doc-markdown-lossless", version = "0.34.154" }
anyhow = "1"
base64 = "0.22"
lazily = { version = "0.40.0", features = ["serde", "thread-safe", "lossless-tree"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
similar = "3"
zstd = "0.13"

[dev-dependencies]
serde_json = "1"
