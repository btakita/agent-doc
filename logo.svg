<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 320" width="256" height="320">
  <defs>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3728"/>
      <stop offset="100%" stop-color="#2d1f14"/>
    </linearGradient>
    <linearGradient id="doc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f0f0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fedora hat -->
  <!-- Hat brim -->
  <ellipse cx="128" cy="95" rx="110" ry="22" fill="url(#hat)" stroke="#1a1008" stroke-width="1.5"/>
  <!-- Hat crown -->
  <path d="M 58 95 Q 58 40 128 35 Q 198 40 198 95" fill="url(#hat)" stroke="#1a1008" stroke-width="1.5"/>
  <!-- Hat band -->
  <rect x="58" y="82" width="140" height="13" rx="2" fill="#c8a96e"/>
  <!-- Hat dent -->
  <path d="M 88 55 Q 128 42 168 55 Q 158 38 128 35 Q 98 38 88 55" fill="#3d2a1a" opacity="0.5"/>

  <!-- Document body -->
  <g filter="url(#shadow)">
    <!-- Page with folded corner -->
    <path d="M 48 100 L 48 300 L 208 300 L 208 140 L 168 100 Z" fill="url(#doc)" stroke="#cccccc" stroke-width="1.5"/>
    <!-- Folded corner -->
    <path d="M 168 100 L 168 140 L 208 140" fill="#e0e0e0" stroke="#cccccc" stroke-width="1.5"/>
  </g>

  <!-- Markdown symbol (M with down arrow) -->
  <g transform="translate(128, 205)" fill="#333333">
    <!-- M shape -->
    <path d="M -48 -35 L -48 35 L -36 35 L -36 -5 L -18 20 L 0 -5 L 0 35 L 12 35 L 12 -35 L 0 -35 L -18 -5 L -36 -35 Z"/>
    <!-- Down arrow -->
    <path d="M 24 -35 L 24 10 L 14 10 L 30 35 L 46 10 L 36 10 L 36 -35 Z"/>
  </g>

  <!-- Agent "eyes" on the document — gives it personality -->
  <g transform="translate(128, 145)">
    <!-- Left eye -->
    <ellipse cx="-22" cy="0" rx="10" ry="11" fill="white" stroke="#555" stroke-width="1.5"/>
    <circle cx="-20" cy="1" r="5" fill="#333"/>
    <circle cx="-18" cy="-1" r="2" fill="white"/>
    <!-- Right eye -->
    <ellipse cx="22" cy="0" rx="10" ry="11" fill="white" stroke="#555" stroke-width="1.5"/>
    <circle cx="24" cy="1" r="5" fill="#333"/>
    <circle cx="26" cy="-1" r="2" fill="white"/>
  </g>
</svg>
