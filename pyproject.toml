[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-doc"
version = "0.35.402"
description = "Interactive document sessions with AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Topic :: Software Development :: Documentation",
]

[project.scripts]
agent-doc = "agent_doc_bootstrap.cli:main"

[project.urls]
Homepage = "https://github.com/btakita/agent-doc"
Documentation = "https://btakita.github.io/agent-doc"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["agent_doc_bootstrap*"]
