[package]
name = "agent-doc-config"
version = "0.34.154"
edition = "2024"
description = "Global user configuration types and file loading for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_config"

[dependencies]
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.34.154" }
agent-doc-model-tier = { path = "../agent-doc-model-tier", version = "0.34.154" }
anyhow = "1"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
