[package]
name = "agent-doc-cycle-state-io"
version = "0.34.76"
edition = "2024"
description = "Durable per-document cycle-state sidecar I/O for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_cycle_state_io"

[dependencies]
agent-doc-document = { path = "../agent-doc-document", version = "0.34.76" }
agent-doc-element-backlog = { path = "../agent-doc-element-backlog", version = "0.34.76" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.34.76" }
agent-doc-fs = { path = "../agent-doc-fs", version = "0.34.76" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.34.76" }
agent-doc-merge = { path = "../agent-doc-merge", version = "0.34.76" }
agent-doc-queue = { path = "../agent-doc-queue", version = "0.34.76" }
agent-doc-project-root-io = { path = "../agent-doc-project-root-io", version = "0.34.76" }
agent-doc-sqlite = { path = "../agent-doc-sqlite", version = "0.34.76" }
agent-doc-state-backbone = { path = "../agent-doc-state-backbone", version = "0.34.76" }
agent-doc-supervisor-io = { path = "../agent-doc-supervisor-io", version = "0.34.76" }
agent-doc-turn = { path = "../agent-doc-turn", version = "0.34.76" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
