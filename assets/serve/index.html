<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>agent-doc</title>
  <style>
    :root { --bg: #0f1115; --fg: #e6e6e6; --muted: #888; --accent: #4ea1ff; --warn: #ffb454; --err: #ff6b6b; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; gap: 12px; align-items: center; padding: 8px 12px; background: #181b22; border-bottom: 1px solid #232735; flex-shrink: 0; }
    header h1 { font-size: 14px; margin: 0; font-weight: 600; }
    header .status { color: var(--muted); flex: 1; font-family: ui-monospace, monospace; font-size: 12px; }
    header .status.ok { color: #6cdf6c; }
    header .status.warn { color: var(--warn); }
    header .status.err { color: var(--err); }
    button { background: var(--accent); color: #fff; border: 0; border-radius: 4px; padding: 6px 14px; font-size: 13px; cursor: pointer; font-weight: 600; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: #2a2f3a; color: var(--fg); }
    .workspace { flex: 1; min-height: 0; display: grid; grid-template-columns: 260px minmax(0, 1fr) 340px; }
    .workspace.single-doc { grid-template-columns: minmax(0, 1fr) 340px; }
    .doc-nav { min-width: 0; min-height: 0; overflow: auto; background: #12151c; border-right: 1px solid #232735; }
    .doc-nav[hidden] { display: none; }
    .doc-list { display: flex; flex-direction: column; gap: 2px; padding: 8px; }
    .doc-list button { width: 100%; min-height: 32px; padding: 6px 8px; text-align: left; border-radius: 4px; background: transparent; color: var(--fg); font-weight: 500; overflow-wrap: anywhere; }
    .doc-list button.active { background: #1b202a; color: #fff; }
    .doc-list button.missing { color: var(--warn); }
    .editor-shell { min-width: 0; min-height: 0; display: grid; grid-template-columns: 56px minmax(0, 1fr); background: #0b0d11; }
    .gutter { padding: 16px 10px; color: #5c6370; background: #11141a; border-right: 1px solid #232735; font: 13px/1.5 ui-monospace, "SF Mono", Menlo, monospace; text-align: right; overflow: hidden; user-select: none; white-space: pre; }
    textarea { width: 100%; height: 100%; background: #0b0d11; color: var(--fg); border: 0; padding: 16px; font: 13px/1.5 ui-monospace, "SF Mono", Menlo, monospace; resize: none; outline: none; tab-size: 2; line-height: 1.5; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
    .inspector { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: #12151c; border-left: 1px solid #232735; }
    .tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid #232735; }
    .tabs button { border-radius: 0; padding: 8px 6px; background: transparent; color: var(--muted); border-right: 1px solid #232735; }
    .tabs button.active { color: var(--fg); background: #1b202a; }
    .panels { min-height: 0; flex: 1; overflow: hidden; }
    agent-doc-component { display: block; height: 100%; }
    agent-doc-component[hidden] { display: none; }
    .component-panel { height: 100%; display: flex; flex-direction: column; min-height: 0; }
    .component-meta { display: flex; gap: 12px; padding: 8px 10px; color: var(--muted); border-bottom: 1px solid #232735; font: 11px/1.4 ui-monospace, monospace; }
    .component-content { flex: 1; min-height: 0; margin: 0; overflow: auto; padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; color: #d8dee9; font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; }
    .footer { padding: 6px 12px; background: #181b22; border-top: 1px solid #232735; color: var(--muted); font-size: 11px; font-family: ui-monospace, monospace; display: flex; gap: 16px; flex-shrink: 0; }
    @media (max-width: 900px) {
      .workspace { grid-template-columns: minmax(0, 1fr); grid-template-rows: 160px minmax(0, 1fr) 220px; }
      .workspace.single-doc { grid-template-rows: minmax(0, 1fr) 220px; }
      .doc-nav { border-right: 0; border-bottom: 1px solid #232735; }
      .inspector { border-left: 0; border-top: 1px solid #232735; }
    }
  </style>
</head>
<body>
  <header>
    <h1>agent-doc</h1>
    <div class="status" id="status">loading…</div>
    <button id="reload" class="secondary" title="Discard unsaved edits and reload from disk">reload</button>
    <button id="save" disabled>save (Ctrl+S)</button>
  </header>
  <main class="workspace">
    <aside class="doc-nav" id="docNav" aria-label="Session documents" hidden>
      <div class="doc-list" id="docList"></div>
    </aside>
    <section class="editor-shell" aria-label="Markdown editor">
      <pre class="gutter" id="gutter" aria-hidden="true">1</pre>
      <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="soft"></textarea>
    </section>
    <aside class="inspector" aria-label="Document components">
      <div class="tabs" id="tabs" role="tablist" aria-label="Document components">
        <button class="active" data-panel="exchange" type="button">exchange</button>
        <button data-panel="backlog" type="button">backlog</button>
        <button data-panel="queue" type="button">queue</button>
        <button data-panel="review" type="button">review</button>
      </div>
      <div class="panels">
        <agent-doc-component data-name="exchange"></agent-doc-component>
        <agent-doc-component data-name="backlog" hidden></agent-doc-component>
        <agent-doc-component data-name="queue" hidden></agent-doc-component>
        <agent-doc-component data-name="review" hidden></agent-doc-component>
      </div>
    </aside>
  </main>
  <div class="footer">
    <span id="bytes">0 bytes</span>
    <span id="head">HEAD —</span>
    <span id="dirty"></span>
  </div>

  <script>
    const workspace = document.querySelector(".workspace");
    const docNav = document.getElementById("docNav");
    const docList = document.getElementById("docList");
    const editor = document.getElementById("editor");
    const gutter = document.getElementById("gutter");
    const status = document.getElementById("status");
    const saveBtn = document.getElementById("save");
    const reloadBtn = document.getElementById("reload");
    const bytesEl = document.getElementById("bytes");
    const headEl = document.getElementById("head");
    const dirtyEl = document.getElementById("dirty");
    const tabs = document.getElementById("tabs");

    let savedContent = "";
    let saving = false;
    let events = null;
    let sessions = [];
    let selectedDoc = "";

    class AgentDocComponent extends HTMLElement {
      set data(component) {
        const state = component.present ? "present" : "missing";
        const content = component.present ? component.content : "component missing";
        this.innerHTML = "";
        const panel = document.createElement("section");
        panel.className = "component-panel";
        const meta = document.createElement("div");
        meta.className = "component-meta";
        meta.textContent = `${component.name} · ${state} · ${component.lines} lines · ${component.items} items`;
        const pre = document.createElement("pre");
        pre.className = "component-content";
        pre.textContent = content;
        panel.append(meta, pre);
        this.append(panel);
      }
    }
    customElements.define("agent-doc-component", AgentDocComponent);

    function setStatus(text, cls) {
      status.textContent = text;
      status.className = "status " + (cls || "");
    }

    function updateDirty() {
      const dirty = editor.value !== savedContent;
      saveBtn.disabled = saving || !dirty;
      dirtyEl.textContent = dirty ? "● unsaved" : "";
      bytesEl.textContent = editor.value.length + " bytes";
    }

    function updateGutter() {
      const lineCount = Math.max(1, editor.value.split("\n").length);
      gutter.textContent = Array.from({ length: lineCount }, (_, i) => String(i + 1)).join("\n");
      gutter.scrollTop = editor.scrollTop;
    }

    function hasUnsavedEdits() {
      return editor.value !== savedContent;
    }

    function docUrl(base) {
      return selectedDoc ? `${base}/${encodeURIComponent(selectedDoc)}` : base;
    }

    function hashSelection() {
      if (!window.location.hash.startsWith("#/")) return "";
      try {
        return decodeURIComponent(window.location.hash.slice(2));
      } catch (_) {
        return "";
      }
    }

    async function loadSessions() {
      try {
        const r = await fetch("/api/sessions", { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const projection = await r.json();
        sessions = projection.sessions || [];
        const hashDoc = hashSelection();
        selectedDoc = sessions.some((session) => session.path === hashDoc)
          ? hashDoc
          : (projection.selected || sessions.find((session) => session.exists)?.path || "");
        renderSessions();
      } catch (e) {
        sessions = [];
        selectedDoc = "";
        setStatus("session list failed: " + e.message, "err");
      }
    }

    function renderSessions() {
      docList.textContent = "";
      const showNav = sessions.length > 1;
      docNav.hidden = !showNav;
      workspace.classList.toggle("single-doc", !showNav);
      for (const session of sessions) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = session.path;
        button.title = session.absolute;
        button.classList.toggle("active", session.path === selectedDoc);
        button.classList.toggle("missing", !session.exists);
        button.addEventListener("click", () => selectDoc(session.path));
        docList.append(button);
      }
    }

    function selectDoc(path) {
      if (path === selectedDoc) return;
      if (hasUnsavedEdits() && !confirm("Discard unsaved edits and switch documents?")) return;
      selectedDoc = path;
      window.location.hash = "#/" + encodeURIComponent(path);
      renderSessions();
      loadDoc("loading " + path + "…");
      connectEvents();
    }

    async function loadDoc(reason) {
      setStatus(reason || "loading…");
      if (!selectedDoc && sessions.length === 0) {
        setStatus("no session documents found", "warn");
        return;
      }
      try {
        const r = await fetch(docUrl("/doc"), { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const text = await r.text();
        savedContent = text;
        editor.value = text;
        setStatus("loaded", "ok");
        updateDirty();
        updateGutter();
        loadProjection();
      } catch (e) {
        setStatus("load failed: " + e.message, "err");
      }
    }

    async function loadProjection() {
      try {
        const r = await fetch(docUrl("/api/projection"), { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const projection = await r.json();
        renderProjection(projection);
      } catch (e) {
        setStatus("component projection failed: " + e.message, "err");
      }
    }

    function renderProjection(projection) {
      for (const panel of document.querySelectorAll("agent-doc-component")) {
        const name = panel.dataset.name;
        const component = projection.components.find((item) => item.name === name) || {
          name,
          present: false,
          lines: 0,
          items: 0,
          content: "",
        };
        panel.data = component;
      }
    }

    async function saveDoc() {
      if (saving) return;
      saving = true;
      saveBtn.disabled = true;
      setStatus("saving document…");
      try {
        const r = await fetch(docUrl("/save"), {
          method: "POST",
          headers: { "Content-Type": "text/markdown; charset=utf-8" },
          body: editor.value,
        });
        if (!r.ok) {
          const err = await r.text();
          throw new Error(err.split("\n")[0] || ("HTTP " + r.status));
        }
        const result = await r.json();
        savedContent = editor.value;
        headEl.textContent = "HEAD " + (result.head || "—");
        setStatus("saved (HEAD " + result.head + ")", "ok");
        loadProjection();
      } catch (e) {
        setStatus("save failed: " + e.message, "err");
      } finally {
        saving = false;
        updateDirty();
      }
    }

    function connectEvents() {
      if (!window.EventSource) {
        setStatus("live updates unavailable; manual reload still works", "warn");
        return;
      }
      if (events) events.close();
      events = new EventSource(docUrl("/events"));
      events.addEventListener("ready", () => {
        setStatus("live updates connected", "ok");
      });
      events.addEventListener("doc-changed", () => {
        loadSessions();
        if (hasUnsavedEdits()) {
          setStatus("file changed on disk; reload to discard local edits", "warn");
          return;
        }
        loadDoc("file changed on disk; reloading…");
      });
      events.addEventListener("doc-error", (e) => {
        try {
          const payload = JSON.parse(e.data || "{}");
          setStatus("live update error: " + (payload.message || "unknown"), "err");
        } catch (_) {
          setStatus("live update error", "err");
        }
      });
      events.onerror = () => {
        setStatus("live updates disconnected; manual reload still works", "warn");
      };
    }

    tabs.addEventListener("click", (e) => {
      const button = e.target.closest("button[data-panel]");
      if (!button) return;
      for (const tab of tabs.querySelectorAll("button")) {
        tab.classList.toggle("active", tab === button);
      }
      for (const panel of document.querySelectorAll("agent-doc-component")) {
        panel.hidden = panel.dataset.name !== button.dataset.panel;
      }
    });
    editor.addEventListener("input", () => {
      updateDirty();
      updateGutter();
    });
    editor.addEventListener("scroll", () => {
      gutter.scrollTop = editor.scrollTop;
    });
    saveBtn.addEventListener("click", saveDoc);
    reloadBtn.addEventListener("click", () => {
      if (editor.value !== savedContent &&
          !confirm("Discard unsaved edits and reload from disk?")) return;
      loadDoc();
    });
    document.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "s") {
        e.preventDefault();
        if (!saveBtn.disabled) saveDoc();
      }
    });

    window.addEventListener("hashchange", () => {
      const hashDoc = hashSelection();
      if (hashDoc && sessions.some((session) => session.path === hashDoc)) {
        selectDoc(hashDoc);
      }
    });

    loadSessions().then(() => {
      loadDoc();
      connectEvents();
    });
  </script>
</body>
</html>
