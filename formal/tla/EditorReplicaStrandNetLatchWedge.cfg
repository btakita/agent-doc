\* ERS-1 pre-fix: a budget whose receipts were ALL lost is latched against an
\* unchanged liveness witness, so self-heal pauses forever and an endpoint that
\* does answer is never demoted (or re-attached). MUST violate the liveness.
SPECIFICATION Spec

CONSTANTS
    MaxReregisterAttempts = 2
    MaxCopies = 2
    MaxGen = 0
    RearmUnanswered = FALSE
    GiveUpIsRefusal = FALSE

INVARIANT TypeOK
PROPERTY AnsweringEndpointResolves

\* A permanently silent endpoint is an intended resting state (silence is not
\* proof), so deadlock checking is off; the liveness properties carry the signal.
CHECK_DEADLOCK FALSE
