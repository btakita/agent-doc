\* Non-vacuity obligation, other direction. A build clock is carried over
\* verbatim when the change is in a member package, so two peers running
\* DIFFERENT code must be admitted somewhere in the state graph — the handshake
\* silently not running. If this config ever passes, the completeness property
\* has stopped constraining the identity function.
SPECIFICATION Spec

CONSTANTS
    MaxCode = 3
    MaxClock = 3
    ContentDerived = FALSE

INVARIANT TypeOK
INVARIANT DivergentCodeIsRejected
