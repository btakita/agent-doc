[package]
name = "agent-doc-sync"
version = "0.34.78"
edition = "2024"
description = "Pure sync scope and layout-state planning policy for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_sync"

[dependencies]
agent-doc-fs = { path = "../agent-doc-fs", version = "0.34.78" }
agent-doc-harness = { path = "../agent-doc-harness", version = "0.34.78" }
agent-doc-turn = { path = "../agent-doc-turn", version = "0.34.78" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
