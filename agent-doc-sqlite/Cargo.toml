[package]
name = "agent-doc-sqlite"
version = "0.35.48"
edition = "2024"
description = "SQLite-backed persistence layer for agent-doc (archive index, controller state store) — isolates the bundled-SQLite C build from agent-doc-orchestration recompiles"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_sqlite"

[dependencies]
# `#relaylockpoison`: locks here are parking_lot, not `std::sync` — the workspace
# keeps `panic=unwind` so the cdylib's `catch_unwind` guards survive a panic in a
# host IDE, but that unwind passes THROUGH any live guard, so a poisoning mutex
# turns a survivable panic into a permanent process-wide outage.
parking_lot = "0.12"
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.35.48" }
agent-doc-diff = { path = "../agent-doc-diff", version = "0.35.48" }
agent-doc-log-time = { path = "../agent-doc-log-time", version = "0.35.48" }
agent-doc-topic = { path = "../agent-doc-topic", version = "0.35.48" }
agent-doc-turn = { path = "../agent-doc-turn", version = "0.35.48" }
anyhow = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
