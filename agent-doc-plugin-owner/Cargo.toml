[package]
name = "agent-doc-plugin-owner"
version = "0.34.109"
edition = "2024"
description = "Filesystem-backed single-owner editor plugin lease policy for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_plugin_owner"

[dependencies]
agent-doc-document-realtime = { path = "../agent-doc-document-realtime", version = "0.34.109" }
agent-doc-fs = { path = "../agent-doc-fs", version = "0.34.109" }
agent-doc-lease = { path = "../agent-doc-lease", version = "0.34.109" }
agent-doc-merge = { path = "../agent-doc-merge", version = "0.34.109" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
