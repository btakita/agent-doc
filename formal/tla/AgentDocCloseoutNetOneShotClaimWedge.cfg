\* F4 pre-fix: a one-shot claim with a fresh owner id per attempt. The CAS
\* applied but its reply was lost; the re-run in the same live process is
\* refused by its own orphaned lease. MUST violate NoSelfConflict.
SPECIFICATION Spec

CONSTANTS
    MaxCopies = 2
    MaxGen = 0
    StableOwnerId = FALSE
    HeartbeatRetries = TRUE
    AbortOnLeaseLoss = TRUE
    CommitFenced = FALSE

INVARIANT NoSelfConflict

\* Every closeout reaches a terminal phase; that is a resting state, not a deadlock.
CHECK_DEADLOCK FALSE
