[package]
name = "agent-doc-queue-io"
version = "0.34.65"
edition = "2024"
description = "Queue-related marker storage I/O for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_queue_io"

[dependencies]
agent-doc-fs = { path = "../agent-doc-fs", version = "0.34.65" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.34.65" }
agent-doc-queue = { path = "../agent-doc-queue", version = "0.34.65" }
anyhow = "1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
