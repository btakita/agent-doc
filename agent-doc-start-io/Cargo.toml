agent-doc-frontmatter-io = { path = "../agent-doc-frontmatter-io", version = "0.34.162" }
agent-doc-harness = { path = "../agent-doc-harness", version = "0.34.162" }
agent-doc-hooks-io = { path = "../agent-doc-hooks-io", version = "0.34.162" }
agent-doc-log-time = { path = "../agent-doc-log-time", version = "0.34.162" }
agent-doc-model-tier = { path = "../agent-doc-model-tier", version = "0.34.162" }
agent-doc-ops-log-io = { path = "../agent-doc-ops-log-io", version = "0.34.162" }
