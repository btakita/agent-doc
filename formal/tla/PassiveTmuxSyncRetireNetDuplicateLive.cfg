\* The positive liveness run with DUPLICATED messages (MaxCopies = 2) at a
\* smaller sequence bound: a duplicated retired receipt or forget must not
\* starve the re-registered endpoint. MUST pass.
SPECIFICATION Spec

CONSTANTS
    MaxCopies = 2
    MaxGen = 0
    MaxSeq = 2
    MaxCGen = 2
    MaxHandoffs = 1
    RetireOnNewerReply = FALSE
    ReregisterOnRetired = TRUE
    RetireRaisesFence = TRUE
    RetiredFence = TRUE

INVARIANT TypeOK
INVARIANT NoRetiredResurrection
INVARIANT ControllerGenerationNeverAheadOfEditor

PROPERTY LiveEndpointNeverMuted
PROPERTY VisibleEventuallyMatchesEditor

\* A settled focus is a resting state, not a deadlock.
CHECK_DEADLOCK FALSE
