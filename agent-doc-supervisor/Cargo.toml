[package]
name = "agent-doc-supervisor"
version = "0.34.145"
edition = "2024"
description = "Pure supervisor realtime state model for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_supervisor"

[dependencies]
agent-doc-diff = { path = "../agent-doc-diff", version = "0.34.145" }
agent-doc-element = { path = "../agent-doc-element", version = "0.34.145" }
agent-doc-element-backlog = { path = "../agent-doc-element-backlog", version = "0.34.145" }
agent-doc-harness = { path = "../agent-doc-harness", version = "0.34.145" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.34.145" }
agent-doc-lease = { path = "../agent-doc-lease", version = "0.34.145" }
agent-doc-log-time = { path = "../agent-doc-log-time", version = "0.34.145" }
agent-doc-prompt-lines = { path = "../agent-doc-prompt-lines", version = "0.34.145" }
agent-doc-queue = { path = "../agent-doc-queue", version = "0.34.145" }
agent-doc-tmux-commands = { path = "../agent-doc-tmux-commands", version = "0.34.145" }
lazily = { version = "0.40.0", features = ["thread-safe"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
