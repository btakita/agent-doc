name: PyPI

# Tag pushes are the trigger of record. The Release workflow creates the GitHub
# Release with the default GITHUB_TOKEN, and GitHub deliberately does not raise
# workflow-triggering events for token-authored actions — so `release: published`
# silently stopped firing once release creation moved into CI, and 0.35.97
# through 0.35.118 never reached PyPI. `release: published` is kept for releases
# published by hand, and `skip-existing` makes the overlap harmless.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Check out tmux-router path dependency
        run: git clone --depth 1 https://github.com/btakita/tmux-router ../tmux-router

      - name: Check out lazily-rs path dependency
        run: git clone --depth 1 https://github.com/btakita/lazily-rs ../lazily-rs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
          docker-options: -v ${{ github.workspace }}/..:${{ github.workspace }}/..

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
