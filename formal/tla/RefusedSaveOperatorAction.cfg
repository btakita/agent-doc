\* A retained write whose endpoint keeps refusing has nowhere to go BY DESIGN --
\* disk is forbidden and authority is never demoted here. TLC would report that
\* correct resting state as a deadlock. The signal in this module is the safety
\* invariant: what the operator is TOLD in that state, not whether it ends.
CHECK_DEADLOCK FALSE
