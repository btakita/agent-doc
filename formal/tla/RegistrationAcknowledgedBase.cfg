SPECIFICATION Spec

\* `#ackedreplicabase`: registration proves containment and the clean merge from
\* the acknowledged replica text once the settled shadow proves nothing. No
\* operator or controller text is lost, a true row conflict still holds, and no
\* hold remains that the acknowledged ancestor proves mergeable.
CONSTANTS
    UseAcknowledgedBase = TRUE
    AllowRowConflict = TRUE
    MaxEdits = 3

INVARIANT TypeOK
INVARIANT NoOperatorTextLoss
INVARIANT NoControllerTextLoss
INVARIANT NoSpuriousHold

\* Registration and a hold are terminal in this model; resting there is not a deadlock.
CHECK_DEADLOCK FALSE
