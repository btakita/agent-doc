\* Non-vacuity obligation: with the demotion edge removed the
\* liveness property MUST be violated. `scripts/run_tla.sh` lists this cfg as
\* must-violate, so a future change that makes the wedge unreachable-by-modelling
\* rather than unreachable-by-design fails `make check` instead of passing it.
SPECIFICATION Spec

CONSTANTS
    MaxReregisterAttempts = 3
    DemoteOnDefinitiveRejection = FALSE

INVARIANT TypeOK
INVARIANT NeverReadsDiskWhileEndpointServes
INVARIANT DemotionRequiresDefinitiveRefusal

PROPERTY AuthorityAlwaysEventuallyResolves
