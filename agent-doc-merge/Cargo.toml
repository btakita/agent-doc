[package]
name = "agent-doc-merge"
version = "0.34.67"
edition = "2024"
description = "Pure merge policy functions for agent-doc documents"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_merge"

[dependencies]
agent-doc-element = { path = "../agent-doc-element", version = "0.34.67" }
agent-doc-element-queue = { path = "../agent-doc-element-queue", version = "0.34.67" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.34.67" }
agent-doc-markdown-ast = { path = "../agent-doc-markdown-ast", version = "0.34.67" }
anyhow = "1"
lazily = "0.13.1"
serde = { version = "1", features = ["derive"] }
similar = "3"
yrs = "0.27"

[dev-dependencies]
serde_json = "1"
