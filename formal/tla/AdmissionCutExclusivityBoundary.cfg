SPECIFICATION Spec

\* The remaining stated boundary. `NoDuplicateItem` (every component, every
\* ledger coverage) MUST be violated even with provenance: a ledger that does
\* not yet hold the saved keystrokes proves nothing about them, and a component
\* holding both the editor's in-flight typing and independent work matches no
\* ledger state. The shipped claim is therefore exactly `NoDuplicateWhenCovered`.
CONSTANTS
    Policy = "provenance"
    N = 4
    LedgerBased = TRUE

INVARIANT TypeOK
INVARIANT NoDuplicateItem
