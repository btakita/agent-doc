\* `#retiredhandoffapplyrace` fixed: a duplicate ledgered after the successor's
\* load is folded (durable reload) before the ACK clears the overlay.
\* `#orphanhandoffoverlay` fixed: an overlay entry whose row a predecessor ACKed
\* is folded the same way, then cleared.
\* `#predecessorlandandack` fixed: a row the predecessor landed AND acknowledged
\* after that load is folded from its ACK receipt.
SPECIFICATION Spec

CONSTANTS
    FoldOnLateDuplicate = TRUE
    ReconcileAckReceipts = TRUE
    OrphanRule = "refold"

INVARIANT TypeOK
INVARIANT SuccessorAckImpliesFolded
INVARIANT ReconciledImpliesFolded
INVARIANT NoOrphanAtRest
INVARIANT OverlayClearImpliesFolded
INVARIANT SingleLedgerRow

PROPERTY EventuallyAcked
PROPERTY EventuallyFolded

CHECK_DEADLOCK FALSE
