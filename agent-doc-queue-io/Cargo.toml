[package]
name = "agent-doc-queue-io"
version = "0.35.284"
edition = "2024"
description = "Queue-related I/O for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_queue_io"

[dependencies]
agent-doc-controller = { path = "../agent-doc-controller", version = "0.35.284" }
# `#relaylockpoison`: locks here are parking_lot, not `std::sync` — the workspace
# keeps `panic=unwind` so the cdylib's `catch_unwind` guards survive a panic in a
# host IDE, but that unwind passes THROUGH any live guard, so a poisoning mutex
# turns a survivable panic into a permanent process-wide outage.
parking_lot = "0.12"
agent-doc-debounce = { path = "../agent-doc-debounce", version = "0.35.284" }
agent-doc-document-realtime = { path = "../agent-doc-document-realtime", version = "0.35.284" }
agent-doc-element = { path = "../agent-doc-element", version = "0.35.284" }
agent-doc-element-backlog = { path = "../agent-doc-element-backlog", version = "0.35.284" }
agent-doc-capture-io = { path = "../agent-doc-capture-io", version = "0.35.284" }
agent-doc-controller-io = { path = "../agent-doc-controller-io", version = "0.35.284" }
agent-doc-cycle-state-io = { path = "../agent-doc-cycle-state-io", version = "0.35.284" }
agent-doc-document = { path = "../agent-doc-document", version = "0.35.284" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.35.284" }
agent-doc-fs = { path = "../agent-doc-fs", version = "0.35.284" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.35.284" }
agent-doc-markdown-ast = { path = "../agent-doc-markdown-ast", version = "0.35.284" }
agent-doc-owner-pane-io = { path = "../agent-doc-owner-pane-io", version = "0.35.284" }
agent-doc-ops-log-io = { path = "../agent-doc-ops-log-io", version = "0.35.284" }
agent-doc-queue = { path = "../agent-doc-queue", version = "0.35.284" }
agent-doc-sqlite = { path = "../agent-doc-sqlite", version = "0.35.284" }
agent-doc-lease = { path = "../agent-doc-lease", version = "0.35.284" }
agent-doc-snapshot-io = { path = "../agent-doc-snapshot-io", version = "0.35.284" }
agent-doc-state-backbone = { path = "../agent-doc-state-backbone", version = "0.35.284" }
agent-doc-turn = { path = "../agent-doc-turn", version = "0.35.284" }
agent-doc-workflow-io = { path = "../agent-doc-workflow-io", version = "0.35.284" }
anyhow = "1"
libc = "0.2"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
agent-doc-controller-io = { path = "../agent-doc-controller-io", version = "0.35.284", features = ["test-support"] }
tempfile = "3"
