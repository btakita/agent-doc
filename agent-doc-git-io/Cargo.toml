[package]
name = "agent-doc-git-io"
version = "0.34.78"
edition = "2024"
description = "Git command I/O adapters for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_git_io"

[dependencies]
agent-doc-debounce = { path = "../agent-doc-debounce", version = "0.34.78" }
agent-doc-diff = { path = "../agent-doc-diff", version = "0.34.78" }
agent-doc-document = { path = "../agent-doc-document", version = "0.34.78" }
agent-doc-element-boundary = { path = "../agent-doc-element-boundary", version = "0.34.78" }
agent-doc-element-exchange = { path = "../agent-doc-element-exchange", version = "0.34.78" }
agent-doc-element-exchange-io = { path = "../agent-doc-element-exchange-io", version = "0.34.78" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.34.78" }
agent-doc-git = { path = "../agent-doc-git", version = "0.34.78" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.34.78" }
agent-doc-merge = { path = "../agent-doc-merge", version = "0.34.78" }
agent-doc-queue = { path = "../agent-doc-queue", version = "0.34.78" }
agent-doc-template = { path = "../agent-doc-template", version = "0.34.78" }
agent-doc-turn = { path = "../agent-doc-turn", version = "0.34.78" }
anyhow = "1"
fs2 = "0.4"
similar = "2"

[dev-dependencies]
tempfile = "3"
