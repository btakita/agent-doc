[package]
name = "agent-doc-gc-io"
version = "0.34.135"
edition = "2024"
description = "Garbage collection IO boundary for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_gc_io"

[dependencies]
agent-doc-fs = { path = "../agent-doc-fs", version = "0.34.135" }
agent-doc-git-io = { path = "../agent-doc-git-io", version = "0.34.135" }
agent-doc-project-root-io = { path = "../agent-doc-project-root-io", version = "0.34.135" }
agent-doc-session-registry-io = { path = "../agent-doc-session-registry-io", version = "0.34.135" }
agent-doc-supervisor-io = { path = "../agent-doc-supervisor-io", version = "0.34.135" }
anyhow = "1"
tmux-router = { path = "../../tmux-router", version = "0.3.14" }

[dev-dependencies]
filetime = "0.2"
tempfile = "3"
