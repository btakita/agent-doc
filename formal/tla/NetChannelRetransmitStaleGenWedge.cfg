\* Non-vacuity (c): a receiver without a generation check. A Data message that
\* survives a Reconnect is applied in the new generation, and NoStaleApply MUST
\* be violated. Sequence numbers alone keep it exactly-once here, so this wedge
\* is the one that proves the generation check is load-bearing.
SPECIFICATION Spec

CONSTANTS
    N = 2
    MaxCopies = 2
    MaxGen = 1
    Retransmit = TRUE
    Idempotent = TRUE
    GenCheck = FALSE
    ChannelFair = TRUE

INVARIANT TypeOK
INVARIANT NoStaleApply

CHECK_DEADLOCK FALSE
