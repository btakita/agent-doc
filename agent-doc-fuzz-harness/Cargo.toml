[package]
name = "agent-doc-fuzz-harness"
version = "0.35.456"
edition = "2024"
description = "Stable-toolchain fuzz harness functions and corpus replay for agent-doc untrusted-input decoders"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_fuzz_harness"

[dependencies]
agent-doc-element = { path = "../agent-doc-element", version = "0.35.456" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.35.456" }
agent-doc-ipc-protocol = { path = "../agent-doc-ipc-protocol", version = "0.35.456" }
agent-doc-markdown-lossless = { path = "../agent-doc-markdown-lossless", version = "0.35.456" }
agent-doc-merge = { path = "../agent-doc-merge", version = "0.35.456" }
agent-doc-state-wire = { path = "../agent-doc-state-wire", version = "0.35.456" }
agent-doc-template = { path = "../agent-doc-template", version = "0.35.456" }
serde = "1"
serde_json = "1"

[dev-dependencies]
proptest = "1"
# Seed generation only (`examples/seed_corpus.rs` writes the legacy ADCR1
# envelope by hand so the corpus covers every historical text-op format).
base64 = "0.22"
rmp-serde = "1"
zstd = "0.13"
