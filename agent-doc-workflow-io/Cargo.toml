[package]
name = "agent-doc-workflow-io"
version = "0.34.70"
edition = "2024"
description = "Workflow proof ledger I/O for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_workflow_io"

[dependencies]
agent-doc-cycle-state-io = { path = "../agent-doc-cycle-state-io", version = "0.34.70" }
agent-doc-element-exchange = { path = "../agent-doc-element-exchange", version = "0.34.70" }
agent-doc-fs = { path = "../agent-doc-fs", version = "0.34.70" }
agent-doc-frontmatter-io = { path = "../agent-doc-frontmatter-io", version = "0.34.70" }
agent-doc-git-io = { path = "../agent-doc-git-io", version = "0.34.70" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.34.70" }
agent-doc-project-root-io = { path = "../agent-doc-project-root-io", version = "0.34.70" }
agent-doc-snapshot-io = { path = "../agent-doc-snapshot-io", version = "0.34.70" }
agent-doc-workflow = { path = "../agent-doc-workflow", version = "0.34.70" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
