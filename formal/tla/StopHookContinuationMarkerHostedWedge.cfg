\* Non-vacuity obligation. With the bound held on the reconciliation-owned
\* marker instead of keyed to the run, the hook must issue two continuation
\* requests for one run somewhere in the state graph — the production loop.
\* Reachable two ways, and the model admits both: the marker is absent when the
\* hook blocks (so nothing arms), or a reconcile clears it between two stops
\* (so an armed bound is disarmed). If this config ever passes, the bound has
\* stopped being load-bearing.
SPECIFICATION Spec

CONSTANTS
    MaxRun = 3
    MaxHead = 3
    GuardKeyedToRun = FALSE

INVARIANT TypeOK
INVARIANT AtMostOneRequestPerRun
