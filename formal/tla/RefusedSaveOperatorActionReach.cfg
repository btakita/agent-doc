SPECIFICATION Spec

\* Non-vacuity in the opposite direction. `NeverReachesAnInFlightSave` MUST be
\* violated, proving the model still reaches an ordinary in-flight save. Without
\* it the safety invariant could be satisfied by reporting
\* `inspect_editor_endpoint` for every outcome, which would tell the operator to
\* inspect the endpoint on every routine retry and so carry no information when a
\* refusal actually happens.
CONSTANTS
    MaxPasses = 4
    ClassifyRefusalAsTerminal = TRUE

INVARIANT TypeOK
INVARIANT NeverReachesAnInFlightSave

CHECK_DEADLOCK FALSE
