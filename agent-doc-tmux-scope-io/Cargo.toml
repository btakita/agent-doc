[package]
name = "agent-doc-tmux-scope-io"
version = "0.35.555"
edition = "2024"
description = "tmux-spawn systemd scope stewardship for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_tmux_scope_io"

[dependencies]
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
