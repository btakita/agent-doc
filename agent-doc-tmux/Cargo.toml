[package]
name = "agent-doc-tmux"
version = "0.34.173"
edition = "2024"
description = "Pure tmux realtime model state for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_tmux"

[dependencies]
lazily = { version = "0.40.0", features = ["thread-safe"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
