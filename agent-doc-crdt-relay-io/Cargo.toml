[package]
name = "agent-doc-crdt-relay-io"
version = "0.35.2"
edition = "2024"
description = "CRDT relay host IO boundary for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_crdt_relay_io"
doctest = false

[dependencies]
agent-doc-debounce = { path = "../agent-doc-debounce", version = "0.35.2" }
agent-doc-document-realtime = { path = "../agent-doc-document-realtime", version = "0.35.2" }
agent-doc-fs = { path = "../agent-doc-fs", version = "0.35.2" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.35.2" }
agent-doc-ipc-io = { path = "../agent-doc-ipc-io", version = "0.35.2" }
agent-doc-ipc-protocol = { path = "../agent-doc-ipc-protocol", version = "0.35.2" }
agent-doc-merge = { path = "../agent-doc-merge", version = "0.35.2" }
agent-doc-ops-log-io = { path = "../agent-doc-ops-log-io", version = "0.35.2" }
agent-doc-project-root-io = { path = "../agent-doc-project-root-io", version = "0.35.2" }
agent-doc-reliable-sync-io = { path = "../agent-doc-reliable-sync-io", version = "0.35.2" }
agent-doc-sqlite = { path = "../agent-doc-sqlite", version = "0.35.2" }
agent-doc-snapshot-io = { path = "../agent-doc-snapshot-io", version = "0.35.2" }
anyhow = "1"
lazily = { version = "0.41.0", features = ["ipc", "durable-sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
