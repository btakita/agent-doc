\* Positive run over NetChannel for the fixes IN CODE (F4, F5): safety under the
\* full adversary, liveness of the claim under FairLossy. One-commit-per-cycle is
\* NOT claimed here: it needs a fenced commit (ADC-fence, see the Fence configs).
\* No reconnect here (messages carry no generation, so a Reconnect is only a burst
\* of Drops); AgentDocCloseoutNetFencedTarget checks the same safety with one.
SPECIFICATION Spec

CONSTANTS
    MaxCopies = 2
    MaxGen = 0
    StableOwnerId = TRUE
    HeartbeatRetries = TRUE
    AbortOnLeaseLoss = TRUE
    CommitFenced = FALSE

INVARIANT TypeOK
INVARIANT NoSelfConflict
INVARIANT HeartbeatAliveWhileOwning
INVARIANT NoCommitAfterLostLease

PROPERTY ClaimEventuallyAnswered

\* Every closeout reaches a terminal phase; that is a resting state, not a deadlock.
CHECK_DEADLOCK FALSE
