[package]
name = "agent-doc-repair-command-io"
version = "0.35.285"
edition = "2024"
description = "Default repair command runtime bridge for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_repair_command_io"

[dependencies]
agent-doc-closeout-runtime-io = { path = "../agent-doc-closeout-runtime-io", version = "0.35.285" }
agent-doc-cycle-state-io = { path = "../agent-doc-cycle-state-io", version = "0.35.285" }
agent-doc-ops-log-io = { path = "../agent-doc-ops-log-io", version = "0.35.285" }
agent-doc-repair-io = { path = "../agent-doc-repair-io", version = "0.35.285" }
agent-doc-repair-runtime-io = { path = "../agent-doc-repair-runtime-io", version = "0.35.285" }
agent-doc-session-check-io = { path = "../agent-doc-session-check-io", version = "0.35.285" }
agent-doc-template = { path = "../agent-doc-template", version = "0.35.285" }
agent-doc-turn = { path = "../agent-doc-turn", version = "0.35.285" }
agent-doc-write-command-io = { path = "../agent-doc-write-command-io", version = "0.35.285" }
agent-doc-write-runtime-io = { path = "../agent-doc-write-runtime-io", version = "0.35.285" }
anyhow = "1"
serde_json = "1"

[dev-dependencies]
agent-doc-capture-io = { path = "../agent-doc-capture-io", version = "0.35.285" }
agent-doc-controller-io = { path = "../agent-doc-controller-io", version = "0.35.285", features = ["test-support"] }
agent-doc-cycle-state-io = { path = "../agent-doc-cycle-state-io", version = "0.35.285", features = ["test-support"] }
agent-doc-crdt-relay-io = { path = "../agent-doc-crdt-relay-io", version = "0.35.285" }
agent-doc-diff-io = { path = "../agent-doc-diff-io", version = "0.35.285" }
agent-doc-document-realtime-io = { path = "../agent-doc-document-realtime-io", version = "0.35.285" }
agent-doc-element = { path = "../agent-doc-element", version = "0.35.285" }
agent-doc-git-io = { path = "../agent-doc-git-io", version = "0.35.285" }
agent-doc-ops-log-io = { path = "../agent-doc-ops-log-io", version = "0.35.285" }
agent-doc-snapshot-io = { path = "../agent-doc-snapshot-io", version = "0.35.285" }
agent-doc-test-support = { path = "../agent-doc-test-support", version = "0.35.285" }
agent-doc-workflow = { path = "../agent-doc-workflow", version = "0.35.285" }
serde_json = "1"
tempfile = "3"
