agent-doc-cycle-state-io = { path = "../agent-doc-cycle-state-io", version = "0.35.149" }
agent-doc-diff = { path = "../agent-doc-diff", version = "0.35.149" }
agent-doc-document = { path = "../agent-doc-document", version = "0.35.149" }
agent-doc-document-realtime-io = { path = "../agent-doc-document-realtime-io", version = "0.35.149" }
agent-doc-flow = { path = "../agent-doc-flow", version = "0.35.149" }
agent-doc-flow-io = { path = "../agent-doc-flow-io", version = "0.35.149" }
agent-doc-element-exchange-io = { path = "../agent-doc-element-exchange-io", version = "0.35.149" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.35.149" }
