[package]
name = "agent-doc-stream-io"
version = "0.35.228"
edition = "2024"
description = "Stream command writeback I/O for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_stream_io"

[dependencies]
# `#relaylockpoison`: locks here are parking_lot, not `std::sync` — the workspace
# keeps `panic=unwind` so the cdylib's `catch_unwind` guards survive a panic in a
# host IDE, but that unwind passes THROUGH any live guard, so a poisoning mutex
# turns a survivable panic into a permanent process-wide outage.
parking_lot = "0.12"
agent-doc-agent-io = { path = "../agent-doc-agent-io", version = "0.35.228" }
agent-doc-capture-io = { path = "../agent-doc-capture-io", version = "0.35.228" }
agent-doc-config = { path = "../agent-doc-config", version = "0.35.228" }
agent-doc-controller-io = { path = "../agent-doc-controller-io", version = "0.35.228" }
agent-doc-crdt-relay-io = { path = "../agent-doc-crdt-relay-io", version = "0.35.228" }
agent-doc-cycle-state-io = { path = "../agent-doc-cycle-state-io", version = "0.35.228" }
agent-doc-diff-io = { path = "../agent-doc-diff-io", version = "0.35.228" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.35.228" }
agent-doc-fs = { path = "../agent-doc-fs", version = "0.35.228" }
agent-doc-hooks-io = { path = "../agent-doc-hooks-io", version = "0.35.228" }
agent-doc-lint-io = { path = "../agent-doc-lint-io", version = "0.35.228" }
agent-doc-merge = { path = "../agent-doc-merge", version = "0.35.228" }
agent-doc-merge-io = { path = "../agent-doc-merge-io", version = "0.35.228" }
agent-doc-model-tier = { path = "../agent-doc-model-tier", version = "0.35.228" }
agent-doc-ops-log-io = { path = "../agent-doc-ops-log-io", version = "0.35.228" }
agent-doc-project-root-io = { path = "../agent-doc-project-root-io", version = "0.35.228" }
agent-doc-prompt-context = { path = "../agent-doc-prompt-context", version = "0.35.228" }
agent-doc-prompt-context-io = { path = "../agent-doc-prompt-context-io", version = "0.35.228" }
agent-doc-run-context-io = { path = "../agent-doc-run-context-io", version = "0.35.228" }
agent-doc-secret-redact = { path = "../agent-doc-secret-redact", version = "0.35.228" }
agent-doc-session-accretion-io = { path = "../agent-doc-session-accretion-io", version = "0.35.228" }
agent-doc-snapshot-io = { path = "../agent-doc-snapshot-io", version = "0.35.228" }
agent-doc-template = { path = "../agent-doc-template", version = "0.35.228" }
agent-doc-template-io = { path = "../agent-doc-template-io", version = "0.35.228" }
agent-doc-turn = { path = "../agent-doc-turn", version = "0.35.228" }
agent-doc-turn-executor = { path = "../agent-doc-turn-executor", version = "0.35.228" }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
