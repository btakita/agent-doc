name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write

# A retry of this tag may clobber the same asset names, but two runs must never
# do that concurrently. Matrix legs within one run still upload distinct names
# in parallel after `prepare-release` creates the shared prerelease exactly once.
concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create or reuse the public prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          keep_incomplete_release_out_of_latest() {
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq SHA256SUMS; then
              return
            fi
            # GH #369: clients through v0.35.546 fetch the aggregate manifest.
            # Keep an incomplete tag public for direct asset downloads without
            # letting /releases/latest advertise an upgrade those clients cannot
            # install yet.
            gh release edit "$tag" --prerelease --latest=false
          }

          if gh release view "$tag" >/dev/null 2>&1; then
            keep_incomplete_release_out_of_latest
            echo "Release $tag already exists; retaining it for an idempotent retry"
            exit 0
          fi

          # The second view makes the operation safe even if an operator creates
          # the release between our first lookup and POST. Workflow concurrency
          # prevents another release.yml run for this tag from racing this one.
          if ! gh release create "$tag" \
            --verify-tag \
            --title "agent-doc $tag" \
            --prerelease \
            --generate-notes; then
            gh release view "$tag" >/dev/null
            keep_incomplete_release_out_of_latest
          fi

  build:
    needs: [prepare-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
            use_cross: false
            expected_arch: x86_64
          - target: aarch64-apple-darwin
            os: macos-15
            use_cross: false
            expected_arch: arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Check out agent-kit path dependency
        run: git clone --depth 1 https://github.com/btakita/agent-kit ../agent-kit

      - name: Check out tmux-router patch dependency
        run: git clone --depth 1 https://github.com/btakita/tmux-router ../tmux-router

      - name: Check out lazily-rs path dependency
        run: git clone --depth 1 https://github.com/btakita/lazily-rs ../lazily-rs

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Verify native Darwin runner architecture
        if: matrix.expected_arch != ''
        shell: bash
        run: |
          set -euo pipefail
          actual_arch="$(uname -m)"
          if [ "$actual_arch" != "${{ matrix.expected_arch }}" ]; then
            echo "::error::runner architecture $actual_arch does not match expected ${{ matrix.expected_arch }} for ${{ matrix.target }}"
            exit 1
          fi

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --version 0.2.5

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}
        env:
          CROSS_CONTAINER_ENGINE: docker

      - name: Build (cargo)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}

      # `x86_64-unknown-linux-musl` defaults to `+crt-static`, and Rust emits NO
      # cdylib for a statically linked CRT — the musl release directory holds
      # `libagent_doc.rlib` and no `.so` at all. Observed on the first v0.35.363
      # run, where this job's packaging guard fail-closed while the other five
      # targets packaged their library fine. The shipped musl binary must stay
      # statically linked (that is the point of the musl asset), so build the
      # library separately with the CRT dynamically linked, into its own target
      # directory so the static binary's artifacts are untouched.
      - name: Build FFI library (musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          set -euo pipefail
          cross build --release --target ${{ matrix.target }} --lib --target-dir target-ffi
          cp "target-ffi/${{ matrix.target }}/release/libagent_doc.so" \
            "target/${{ matrix.target }}/release/libagent_doc.so"
        env:
          CROSS_CONTAINER_ENGINE: docker
          RUSTFLAGS: "-C target-feature=-crt-static"

      # GH #52: the tarball used to hold the binary ALONE. `lib-path` resolves
      # the cdylib as a SIBLING of the executable, so every package install
      # failed to load FFI and silently ran the editor plugins in the degraded
      # file-based-IPC mode. `libagent_doc.so` shipped in no release asset for
      # any target — `make install` from a source checkout was the only way to
      # obtain it. Fail closed if the cdylib is missing: an asset without it is
      # the defect, not a smaller download.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          release_dir="target/${{ matrix.target }}/release"
          case "${{ matrix.target }}" in
            *-apple-darwin) lib="libagent_doc.dylib" ;;
            *) lib="libagent_doc.so" ;;
          esac
          if [ ! -f "$release_dir/$lib" ]; then
            echo "::error::$release_dir/$lib is missing; the release tarball cannot deliver FFI without it"
            ls -la "$release_dir"
            exit 1
          fi
          tar czf agent-doc-${{ matrix.target }}.tar.gz -C "$release_dir" agent-doc "$lib"
          tar tzf agent-doc-${{ matrix.target }}.tar.gz

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = "target/${{ matrix.target }}/release"
          $lib = Join-Path $releaseDir 'agent_doc.dll'
          if (-not (Test-Path $lib)) {
            Write-Output "::error::$lib is missing; the release archive cannot deliver FFI without it"
            Get-ChildItem $releaseDir
            exit 1
          }
          Compress-Archive -Path (Join-Path $releaseDir 'agent-doc.exe'), $lib -DestinationPath agent-doc-${{ matrix.target }}.zip

      # Publish this platform as soon as it is ready. The sidecar makes the
      # archive independently verifiable while `SHA256SUMS` remains the
      # all-platform completion marker consumed by PyPI and Homebrew. A failed
      # matrix leg cannot withhold archives uploaded by successful siblings;
      # Actions' "Re-run failed jobs" retries only the missing leg and
      # `--clobber` makes either a failed- or all-jobs retry idempotent.
      - name: Publish platform archive and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            *-pc-windows-msvc) archive="agent-doc-${{ matrix.target }}.zip" ;;
            *) archive="agent-doc-${{ matrix.target }}.tar.gz" ;;
          esac
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          gh release upload "$GITHUB_REF_NAME" "$archive" "$archive.sha256" --clobber

      - name: Request target-channel promotion
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run target-channel.yml \
            --ref "$GITHUB_REF_NAME" \
            -f target="${{ matrix.target }}" \
            -f version="${GITHUB_REF_NAME#v}" \
            -f allow_rollback=false

  # `#pluginzipeveryrelease`: the editor packages ship with EVERY tag, not on a
  # cadence of their own. They used to be published separately, so the gap
  # between plugin-bearing releases grew without bound — measured 2026-09-20,
  # exactly ONE release in the API window carried `agent-doc-jetbrains-*.zip`.
  # Plugin install/update then depended on how deep the asset search happened to
  # walk, which is what `#pluginassetpaging` (per_page=100 across 5 pages) had to
  # paper over. With the packages on the latest release, that page bound is slack
  # instead of load-bearing.
  #
  # This job is a hard dependency of `finalize-release` on purpose: a tag that cannot
  # produce editor packages must fail loudly rather than quietly publish the
  # asset gap this item exists to close.
  plugins:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A tag can publish even when branch CI failed. Recompute the generation
      # identity from checkout bytes here so shallow history cannot admit changed
      # plugin sources under an already-released version.
      - name: Verify editor package generations
        run: python3 scripts/check_plugin_versions.py

      # The JetBrains plugin consumes lazily-kt as a Gradle composite build when
      # the sibling checkout is present. Without it the build resolves
      # `io.github.lazily:lazily` from mavenLocal / GitHub Packages, which is
      # empty/unauthenticated on a runner. Same pair `ci.yml` clones.
      - name: Check out lazily-spec composite dependency
        run: git clone --depth 1 https://github.com/lazily-hub/lazily-spec ../lazily-spec

      - name: Check out lazily-kt composite dependency
        run: git clone --depth 1 https://github.com/lazily-hub/lazily-kt ../lazily-kt

      # #ci25gradle: JDK 25 (listed last, so it is the default JAVA_HOME) runs
      # Gradle 9.2.1 for editors/jetbrains-262. The classic editors/jetbrains
      # build stays on its Gradle 8.14 wrapper, whose Groovy cannot read JDK 25
      # class files ("Unsupported class file major version 69"); its
      # gradle/gradle-daemon-jvm.properties pins the daemon to Temurin 21,
      # which this step installs so the daemon needs no download.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      # #relcimavenlocal: v0.35.481 never published because this job lacked the
      # step ci.yml gained in #lz262resolve, so :backend:compileKotlin could not
      # resolve io.github.lazily:lazily. Same script as ci.yml.
      - name: Publish pinned lazily-kt release to mavenLocal (JetBrains 262)
        run: bash scripts/publish-pinned-lazily-kt.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Both copies are pinned to the declared version rather than globbed.
      # `build/distributions/` accumulates every version it has ever built plus
      # `-signed` siblings (four zips locally), so a glob is one cache-restore
      # away from attaching a stale or differently-signed artifact to a release
      # and reporting success.
      - name: Build JetBrains compatibility-ranged plugin zips
        run: |
          set -euo pipefail
          ( cd editors/jetbrains && ./gradlew --no-daemon --console=plain buildPlugin verifyClassicArtifact )
          ( cd editors/jetbrains-262 && gradle --no-daemon --console=plain test buildPlugin verifySplitArtifact verifySplitModeSandboxes )
          make jetbrains-263-check
          mkdir -p editor-packages
          classic_version=$(sed -n 's/^pluginVersion *= *//p' editors/jetbrains/gradle.properties | tr -d '[:space:]')
          modular_version=$(sed -n 's/^pluginVersion *= *//p' editors/jetbrains-262/gradle.properties | tr -d '[:space:]')
          modern_version=$(sed -n 's/^pluginVersion *= *//p' editors/jetbrains-263/gradle.properties | tr -d '[:space:]')
          test -n "$classic_version"
          test -n "$modular_version"
          test -n "$modern_version"
          test "$(printf '%s\n' "$classic_version" "$modular_version" "$modern_version" | sort -u | wc -l)" -eq 3
          cp "editors/jetbrains/build/distributions/agent-doc-jetbrains-$classic_version.zip" editor-packages/
          cp "editors/jetbrains-262/build/distributions/agent-doc-jetbrains-262-$modular_version.zip" editor-packages/
          cp "editors/jetbrains-262/build/distributions/agent-doc-jetbrains-263-$modern_version.zip" editor-packages/
          ls -la editor-packages

      # JetBrains' simple custom-repository format allows a plugin ID only once
      # per listing. Publish one stable feed URL per compatibility range (served
      # from `releases/latest/download/`); each listing pins its ZIP to THIS tag
      # so a feed and the archive it names can never come from different
      # releases. The generator refuses the pair (and writes neither listing)
      # unless the ID matches, versions differ, and the ranges are exactly
      # 242..261.*, 262..262.*, and 263..263.*. Remote Dev users configure the
      # matching build-line URL on both the backend and Client/Gateway.
      - name: Build and verify JetBrains custom-repository feeds
        run: |
          set -euo pipefail
          classic_version=$(sed -n 's/^pluginVersion *= *//p' editors/jetbrains/gradle.properties | tr -d '[:space:]')
          modular_version=$(sed -n 's/^pluginVersion *= *//p' editors/jetbrains-262/gradle.properties | tr -d '[:space:]')
          modern_version=$(sed -n 's/^pluginVersion *= *//p' editors/jetbrains-263/gradle.properties | tr -d '[:space:]')
          python3 scripts/jetbrains-custom-repository.py \
            --classic "editor-packages/agent-doc-jetbrains-$classic_version.zip" \
            --modular "editor-packages/agent-doc-jetbrains-262-$modular_version.zip" \
            --modern "editor-packages/agent-doc-jetbrains-263-$modern_version.zip" \
            --output-dir editor-packages \
            --download-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          test -f editor-packages/agent-doc-jetbrains-classic.xml
          test -f editor-packages/agent-doc-jetbrains-262.xml
          test -f editor-packages/agent-doc-jetbrains-263.xml

      - name: Build VS Code extension vsix
        run: |
          set -euo pipefail
          npm ci --prefix editors/vscode
          npm run package --prefix editors/vscode
          version=$(node -p "require('./editors/vscode/package.json').version")
          test -n "$version"
          cp "editors/vscode/agent-doc-$version.vsix" editor-packages/
          ls -la editor-packages

      # Prove all packages and both ranged feeds exist before the release job can depend on them, so
      # a silently-skipped build cannot publish a release missing its plugins.
      - name: Verify all editor packages and feeds were produced
        run: |
          set -euo pipefail
          classic_version=$(sed -n 's/^pluginVersion *= *//p' editors/jetbrains/gradle.properties | tr -d '[:space:]')
          modular_version=$(sed -n 's/^pluginVersion *= *//p' editors/jetbrains-262/gradle.properties | tr -d '[:space:]')
          modern_version=$(sed -n 's/^pluginVersion *= *//p' editors/jetbrains-263/gradle.properties | tr -d '[:space:]')
          test "$(printf '%s\n' "$classic_version" "$modular_version" "$modern_version" | sort -u | wc -l)" -eq 3
          test -f "editor-packages/agent-doc-jetbrains-$classic_version.zip"
          test -f "editor-packages/agent-doc-jetbrains-262-$modular_version.zip"
          test -f "editor-packages/agent-doc-jetbrains-263-$modern_version.zip"
          test -f editor-packages/agent-doc-jetbrains-classic.xml
          test -f editor-packages/agent-doc-jetbrains-262.xml
          test -f editor-packages/agent-doc-jetbrains-263.xml
          python3 scripts/jetbrains-custom-repository.py \
            --output-dir editor-packages \
            --verify-listings "$classic_version" "$modular_version" "$modern_version"
          jetbrains=$(find editor-packages -name 'agent-doc-jetbrains-*.zip' | wc -l)
          repositories=$(find editor-packages -name 'agent-doc-jetbrains-*.xml' | wc -l)
          vsix=$(find editor-packages -name '*.vsix' | wc -l)
          if [ "$jetbrains" -ne 3 ] || [ "$repositories" -ne 3 ] || [ "$vsix" -ne 1 ]; then
            echo "::error::expected 3 ranged JetBrains zips, 3 ranged feeds, and 1 vsix; got $jetbrains zips, $repositories feeds, and $vsix vsix"
            ls -la editor-packages
            exit 1
          fi

      # Marketplace is the preferred Remote Dev distribution channel: it
      # applies the same compatibility selection independently to the backend
      # and JetBrains Client, then synchronizes the selected modular ZIP to both
      # peers. Marketplace onboarding is external and must not block the core
      # GitHub/PyPI release; when configured, validate the complete three-update
      # set before the first upload.
      # Per-artifact release markers make a failed-job retry resume after the
      # last accepted update instead of attempting to upload that version twice.
      - name: Publish all compatibility-ranged JetBrains updates to Marketplace
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "::notice::JETBRAINS_MARKETPLACE_TOKEN is missing; Marketplace publication is deferred. The verified JetBrains ZIPs and custom-repository feeds will still publish with the core GitHub/PyPI release. Complete docs/reference/jetbrains-distribution.md#marketplace-onboarding and rerun this tag's Release workflow to publish them to Marketplace."
            exit 0
          fi

          classic_version=$(sed -n 's/^pluginVersion *= *//p' editors/jetbrains/gradle.properties | tr -d '[:space:]')
          modular_version=$(sed -n 's/^pluginVersion *= *//p' editors/jetbrains-262/gradle.properties | tr -d '[:space:]')
          modern_version=$(sed -n 's/^pluginVersion *= *//p' editors/jetbrains-263/gradle.properties | tr -d '[:space:]')
          artifacts=(
            "editor-packages/agent-doc-jetbrains-$classic_version.zip"
            "editor-packages/agent-doc-jetbrains-262-$modular_version.zip"
            "editor-packages/agent-doc-jetbrains-263-$modern_version.zip"
          )
          python3 scripts/jetbrains-custom-repository.py \
            --classic "${artifacts[0]}" \
            --modular "${artifacts[1]}" \
            --modern "${artifacts[2]}" \
            --verify-artifacts

          mkdir -p marketplace-state
          published_assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for artifact in "${artifacts[@]}"; do
            marker="marketplace-uploaded-${artifact##*/}.txt"
            if grep -Fxq "$marker" <<<"$published_assets"; then
              echo "Marketplace already accepted ${artifact##*/}; retaining $marker"
              continue
            fi
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $PUBLISH_TOKEN" \
              --form "xmlId=com.github.btakita.agent-doc" \
              --form "file=@$artifact" \
              --form "containsAds=false" \
              https://plugins.jetbrains.com/api/updates/upload
            printf '%s  %s\n' "$GITHUB_SHA" "${artifact##*/}" > "marketplace-state/$marker"
            gh release upload "$GITHUB_REF_NAME" "marketplace-state/$marker" --clobber
          done

      - name: Generate and publish editor-package checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd editor-packages && sha256sum agent-doc-* | sort -k2) > editor-packages/EDITOR-PACKAGES.sha256
          cat editor-packages/EDITOR-PACKAGES.sha256
          gh release upload "$GITHUB_REF_NAME" editor-packages/* --clobber

      - name: Request promotion for every archive already ready
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for target in \
            x86_64-unknown-linux-gnu \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin \
            x86_64-pc-windows-msvc; do
            gh workflow run target-channel.yml \
              --ref "$GITHUB_REF_NAME" \
              -f target="$target" \
              -f version="${GITHUB_REF_NAME#v}" \
              -f allow_rollback=false
          done

  # Per-target stability is independent of the six-platform aggregate, but not
  # independent of the editor packages. A Remote Dev backend upgraded to a tag
  # whose JetBrains Client package is absent is not a stable target. This fan-in
  # runs even when one matrix leg failed, promotes every archive that DID arrive,
  # and binds it to the verified editor-package manifest from the same tag.
  promote-target-channels:
    if: ${{ always() && needs.plugins.result == 'success' }}
    needs: [build, plugins]
    runs-on: ubuntu-latest
    concurrency:
      group: target-stable-channel-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4

      - name: Promote independently ready targets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CHANNEL_TAG: agent-doc-target-stable-v1
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! gh release view "$CHANNEL_TAG" >/dev/null 2>&1; then
            gh release create "$CHANNEL_TAG" \
              --target "$GITHUB_SHA" \
              --title "agent-doc per-target stable channels" \
              --notes "Machine-readable rolling pointers. Use ordinary versioned releases for downloads." \
              --prerelease \
              --latest=false
          fi

          mkdir -p promotion/editor promotion/current promotion/out
          gh release download "$GITHUB_REF_NAME" \
            --pattern EDITOR-PACKAGES.sha256 \
            --dir promotion/editor
          targets=(
            x86_64-unknown-linux-gnu
            x86_64-unknown-linux-musl
            aarch64-unknown-linux-gnu
            x86_64-apple-darwin
            aarch64-apple-darwin
            x86_64-pc-windows-msvc
          )
          for target in "${targets[@]}"; do
            case "$target" in
              *-pc-windows-msvc) archive="agent-doc-$target.zip" ;;
              *) archive="agent-doc-$target.tar.gz" ;;
            esac
            target_dir="promotion/$target"
            mkdir -p "$target_dir"
            if ! gh release download "$GITHUB_REF_NAME" \
              --pattern "$archive" \
              --pattern "$archive.sha256" \
              --dir "$target_dir"; then
              echo "::notice::$target is not ready in $GITHUB_REF_NAME; leaving its stable channel unchanged"
              continue
            fi

            current="promotion/current/stable-$target.json"
            gh release download "$CHANNEL_TAG" \
              --pattern "stable-$target.json" \
              --dir promotion/current >/dev/null 2>&1 || true
            result=$(python3 scripts/target-stable-channel.py \
              --target "$target" \
              --version "$version" \
              --archive "$target_dir/$archive" \
              --archive-sidecar "$target_dir/$archive.sha256" \
              --editor-manifest promotion/editor/EDITOR-PACKAGES.sha256 \
              --current "$current" \
              --output-dir promotion/out)
            echo "$result"
            if grep -Fxq action=stale <<<"$result"; then
              echo "::notice::$target already points to a newer stable release; refusing implicit rollback"
              continue
            fi
            # Two rolling assets cannot be atomically replaced. Uploading the
            # JSON first makes every intermediate state checksum-mismatched, so
            # clients fail closed until the sidecar completes the transaction.
            gh release upload "$CHANNEL_TAG" "promotion/out/stable-$target.json" --clobber
            gh release upload "$CHANNEL_TAG" "promotion/out/stable-$target.json.sha256" --clobber
          done

  # `SHA256SUMS` is deliberately a completion marker, not a partial manifest.
  # Successful platform legs are already public above. This fan-in verifies all
  # six public archives and their independently published sidecars before it
  # exposes the aggregate manifest that unlocks PyPI and Homebrew.
  finalize-release:
    needs: [build, plugins]
    runs-on: ubuntu-latest
    steps:
      - name: Verify public platform assets and generate release checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          archives=(
            agent-doc-x86_64-unknown-linux-gnu.tar.gz
            agent-doc-x86_64-unknown-linux-musl.tar.gz
            agent-doc-aarch64-unknown-linux-gnu.tar.gz
            agent-doc-x86_64-apple-darwin.tar.gz
            agent-doc-aarch64-apple-darwin.tar.gz
            agent-doc-x86_64-pc-windows-msvc.zip
          )
          mkdir -p artifacts
          for archive in "${archives[@]}"; do
            gh release download "$GITHUB_REF_NAME" \
              --pattern "$archive" \
              --pattern "$archive.sha256" \
              --dir artifacts
          done
          (
            cd artifacts
            for archive in "${archives[@]}"; do
              sha256sum --check "$archive.sha256"
            done
            sha256sum "${archives[@]}" | sort -k2 > SHA256SUMS
          )
          cat artifacts/SHA256SUMS

      - name: Publish the all-platform completion manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" artifacts/SHA256SUMS --clobber

      # Promotion is deliberately separate and ordered after the upload. Older
      # upgraders fetch SHA256SUMS from the stable latest release, so exposing
      # this tag there before the manifest exists recreates GH #369.
      - name: Promote the checksum-complete release to stable latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" --prerelease=false --latest

  # `#pypireleaseworkflow`: start the PyPI publish only once this run's
  # `finalize-release` has uploaded the complete SHA256SUMS. PyPI used to
  # run on its own tag push and poll a fixed 30 minutes for SHA256SUMS, which
  # lost the race whenever these builds ran longer (v0.35.485: ~33 minutes, run
  # 38086853278). The dispatch has to be explicit: GitHub raises no
  # `release: published` for a release created with GITHUB_TOKEN, but it does
  # raise `workflow_dispatch`. Dispatching (rather than `uses:`-calling
  # pypi.yml) keeps pypi.yml the top-level workflow, which is what PyPI's
  # trusted publisher is registered against. `--ref` is the tag, so the
  # dispatched run builds the tagged commit and its `verify` job runs.
  pypi:
    needs: [finalize-release]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Confirm the release carries SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS --dir /tmp/agent-doc-release-sums
          cat /tmp/agent-doc-release-sums/SHA256SUMS

      - name: Dispatch the PyPI publish for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run pypi.yml --ref "$GITHUB_REF_NAME"
          echo "Dispatched PyPI for $GITHUB_REF_NAME; follow it with: gh run list --workflow PyPI --limit 1"

  # GH #31: bump `btakita/homebrew-tap` to this tag's archives. Runs after the
  # release exists because the formula is rendered from the published
  # `SHA256SUMS`, including both Darwin archives built above.
  homebrew:
    needs: [finalize-release]
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
