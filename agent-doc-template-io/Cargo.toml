[package]
name = "agent-doc-template-io"
version = "0.34.67"
edition = "2024"
description = "I/O adapters for agent-doc template patch application"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_template_io"

[dependencies]
agent-doc-element = { path = "../agent-doc-element", version = "0.34.67" }
agent-doc-flow = { path = "../agent-doc-flow", version = "0.34.67" }
agent-doc-flow-io = { path = "../agent-doc-flow-io", version = "0.34.67" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.34.67" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.34.67" }
agent-doc-project-config-io = { path = "../agent-doc-project-config-io", version = "0.34.67" }
agent-doc-template = { path = "../agent-doc-template", version = "0.34.67" }
anyhow = "1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
