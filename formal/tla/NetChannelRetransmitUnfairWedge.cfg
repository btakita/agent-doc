\* Non-vacuity: the channel is NOT fair-lossy; only the resend is fair. The
\* adversary may drop every copy forever, so Completes MUST be violated. This
\* proves the positive run's liveness rests on NetChannel!FairLossy.
SPECIFICATION Spec

CONSTANTS
    N = 2
    MaxCopies = 2
    MaxGen = 1
    Retransmit = TRUE
    Idempotent = TRUE
    GenCheck = TRUE
    ChannelFair = FALSE

INVARIANT TypeOK
PROPERTY Completes

CHECK_DEADLOCK FALSE
