\* v0.35.502/503 (the 02:54:03Z wedge): a delivery whose reply returns after a
\* newer observation was admitted retires its own live endpoint, and the plugin
\* ignores the retired receipt. No handoff is possible here, so the
\* counterexample can only be the self-retirement. MUST violate
\* LiveEndpointNeverMuted / VisibleEventuallyMatchesEditor.
SPECIFICATION Spec

CONSTANTS
    MaxCopies = 1
    MaxGen = 0
    MaxSeq = 3
    MaxCGen = 3
    MaxHandoffs = 0
    RetireOnNewerReply = TRUE
    ReregisterOnRetired = FALSE
    RetireRaisesFence = TRUE
    RetiredFence = TRUE

INVARIANT TypeOK
PROPERTY LiveEndpointNeverMuted
PROPERTY VisibleEventuallyMatchesEditor

\* A settled focus is a resting state, not a deadlock.
CHECK_DEADLOCK FALSE
