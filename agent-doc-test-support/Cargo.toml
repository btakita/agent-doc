[package]
name = "agent-doc-test-support"
version = "0.35.150"
edition = "2024"
description = "Shared test support helpers for agent-doc crates"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_test_support"

[dependencies]
# `#relaylockpoison`: locks here are parking_lot, not `std::sync` — the workspace
# keeps `panic=unwind` so the cdylib's `catch_unwind` guards survive a panic in a
# host IDE, but that unwind passes THROUGH any live guard, so a poisoning mutex
# turns a survivable panic into a permanent process-wide outage.
parking_lot = "0.12"
agent-doc-controller-io = { path = "../agent-doc-controller-io", version = "0.35.150" }
agent-doc-crdt-relay-io = { path = "../agent-doc-crdt-relay-io", version = "0.35.150" }
agent-doc-harness = { path = "../agent-doc-harness", version = "0.35.150" }
agent-doc-ipc-io = { path = "../agent-doc-ipc-io", version = "0.35.150" }
agent-doc-merge = { path = "../agent-doc-merge", version = "0.35.150" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.35.150" }
agent-doc-reliable-sync-io = { path = "../agent-doc-reliable-sync-io", version = "0.35.150" }
agent-doc-project-root-io = { path = "../agent-doc-project-root-io", version = "0.35.150" }
agent-doc-sqlite = { path = "../agent-doc-sqlite", version = "0.35.150" }
agent-doc-template = { path = "../agent-doc-template", version = "0.35.150" }
agent-doc-tmux-io = { path = "../agent-doc-tmux-io", version = "0.35.150" }
serde_json = "1"
tmux-router = { path = "../../tmux-router", version = "0.3.14" }
