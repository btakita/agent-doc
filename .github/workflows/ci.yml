name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y tmux

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - run: make check

      - run: make tmux-ci
