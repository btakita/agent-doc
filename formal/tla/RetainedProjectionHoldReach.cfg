SPECIFICATION Spec

\* Non-vacuity in the other direction. `NeverAdoptsThroughContainment` MUST be
\* violated, proving the positive run actually takes the containment edge rather
\* than registering only through convergence, an unedited buffer, or publish.
CONSTANTS
    PerEditContainment = TRUE
    MaxEdits = 2

INVARIANT TypeOK
INVARIANT NeverAdoptsThroughContainment

CHECK_DEADLOCK FALSE
