[package]
name = "agent-doc-admin-io"
version = "0.34.84"
edition = "2024"
description = "Admin command IO host for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_admin_io"

[dependencies]
agent-doc-controller = { path = "../agent-doc-controller", version = "0.34.84" }
agent-doc-project-root-io = { path = "../agent-doc-project-root-io", version = "0.34.84" }
agent-doc-sqlite = { path = "../agent-doc-sqlite", version = "0.34.84" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
