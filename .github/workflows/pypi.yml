name: PyPI

# `#pypislim`: PyPI carries one platform-independent bootstrap wheel, not four
# copies of the native executable and FFI library. The launcher downloads the
# matching checksummed archive from this version's GitHub Release on first run.
# The wheel is small enough to publish on every tag without consuming the
# project's storage quota, and publish requires SHA256SUMS so a newly visible
# wheel never points at release assets that are still being assembled.
#
# `#pypireleaseworkflow`: this workflow is STARTED BY the Release workflow, never
# raced against it. It used to run on its own `v*` tag push and poll at most 30
# minutes for the Release's SHA256SUMS; v0.35.485's cross-platform builds took
# about 33 minutes, so publish failed at 21:45:30Z and the Release went up at
# 21:47:24Z (run 38086853278). Now `release.yml`'s `pypi` job, which `needs` the
# job that uploads every asset including SHA256SUMS, dispatches this workflow on
# the tag (`gh workflow run pypi.yml --ref <tag>`). Its GITHUB_TOKEN-authored
# `workflow_dispatch` is the one event GitHub still raises for token-authored
# actions; `release: published` is NOT raised for the token-created release,
# which is why 0.35.97 through 0.35.118 never reached PyPI. The readiness check
# below is therefore a single fail-closed check, never a wall-clock poll: when
# it runs, the assets already exist, or something is genuinely wrong.
#
# Triggers:
#   - `workflow_dispatch` on a `v*` tag ref: the trigger of record (dispatched
#     by release.yml) and the manual re-publish path,
#     `gh workflow run pypi.yml --ref v<version>`.
#   - `release: published`: hand-published releases only (token-created
#     releases never raise it). `skip-existing` absorbs any overlap.
#
# GH #225: `release: published` has no tag filter of its own, so publishing an
# editor-only prerelease such as `jetbrains-262-preview-c39de1b` started this
# workflow and its publish job failed waiting for a `SHA256SUMS` that non-`v*`
# releases never carry. Every job that a release event can reach is gated on
# `RELEASE_TAG_GATE` below: a `release` event runs only for a `v*` tag name.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    # RELEASE_TAG_GATE (GH #225): skip non-`v*` releases (editor-only previews).
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test and build the bootstrap wheel
        run: |
          set -euo pipefail
          python -m unittest discover -s python/tests -v
          python -m pip install --disable-pip-version-check build
          python -m build --wheel

      - name: Verify the wheel is universal and contains no native payload
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, os, sys, zipfile

          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              sys.exit(f"expected one wheel, found {wheels}")
          wheel = wheels[0]
          names = zipfile.ZipFile(wheel).namelist()
          native_suffixes = (".so", ".dylib", ".dll", ".exe")
          if not wheel.endswith("py3-none-any.whl") or any(name.endswith(native_suffixes) for name in names):
              sys.exit(f"wheel is not a native-free py3-none-any bootstrap: {wheel}\n" + "\n".join(names))
          if os.path.getsize(wheel) > 256 * 1024:
              sys.exit(f"bootstrap wheel unexpectedly exceeds 256 KiB: {wheel}")
          print(f"{wheel}: {os.path.getsize(wheel)} bytes, native-free")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-bootstrap
          path: dist
          retention-days: 1

  publish:
    needs: [build]
    # RELEASE_TAG_GATE (GH #225): repeated so publish never depends on skip
    # propagation through `needs` alone.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      # `#pypireleaseworkflow`: one check, no poll. Refuse a non-tag ref, a
      # release with no SHA256SUMS, a manifest that does not name exactly the
      # six platform archives, an archive the manifest names but the release
      # does not carry, and (where GitHub reports one) an asset digest that
      # disagrees with the manifest.
      - name: Verify the matching GitHub Release checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) tag="${GITHUB_REF#refs/tags/}" ;;
            *)
              echo "::error::PyPI publishes only from a v* tag ref; got $GITHUB_REF (dispatch with --ref v<version>)"
              exit 1
              ;;
          esac
          mkdir -p /tmp/agent-doc-release-ready
          if ! gh release download "$tag" --pattern SHA256SUMS --dir /tmp/agent-doc-release-ready; then
            echo "::error::GitHub Release $tag has no SHA256SUMS. This workflow runs after release.yml uploads every asset, so the Release is missing or incomplete: rerun the Release workflow's release job, then dispatch PyPI again."
            exit 1
          fi
          gh api "repos/$GH_REPO/releases/tags/$tag" \
            --jq '.assets[] | [.name, (.digest // "")] | @tsv' > /tmp/agent-doc-release-ready/assets.tsv
          python3 - "$tag" <<'PY'
          import sys

          tag = sys.argv[1]
          expected_count = 6
          manifest = {}
          for line in open("/tmp/agent-doc-release-ready/SHA256SUMS", encoding="ascii"):
              line = line.strip()
              if not line:
                  continue
              digest, name = line.split(maxsplit=1)
              manifest[name.lstrip("*")] = digest.lower()
          assets = {}
          for line in open("/tmp/agent-doc-release-ready/assets.tsv", encoding="utf-8"):
              name, _, digest = line.rstrip("\n").partition("\t")
              assets[name] = digest
          errors = []
          if len(manifest) != expected_count:
              errors.append(f"SHA256SUMS names {len(manifest)} archives, expected {expected_count}: {sorted(manifest)}")
          for name, digest in sorted(manifest.items()):
              if not name.startswith("agent-doc-"):
                  errors.append(f"SHA256SUMS names a non-platform asset {name}")
              if name not in assets:
                  errors.append(f"SHA256SUMS names {name}, which release {tag} does not carry")
              elif assets[name] and assets[name] != f"sha256:{digest}":
                  errors.append(f"{name}: release digest {assets[name]} disagrees with SHA256SUMS {digest}")
          if errors:
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)
          print(f"GitHub Release {tag} is ready: {len(manifest)} archives match SHA256SUMS")
          PY

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  # GH #52 part 2: PyPI drifted 20 versions behind the newest tag without
  # surfacing anywhere, because a failed upload only reddens a job nobody was
  # watching. Assert the version this run was supposed to publish is actually
  # installable through PyPI's simple index, so a quota block, skipped upload,
  # or JSON/simple-index propagation lag fails loudly instead of being
  # discovered by a user whose `pip install --upgrade` silently downgraded them.
  verify:
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for a clean PyPI install to fetch the pinned native release
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python -m venv /tmp/agent-doc-pypi-verify
          for attempt in $(seq 1 30); do
            if /tmp/agent-doc-pypi-verify/bin/pip install \
              --disable-pip-version-check \
              --no-cache-dir \
              --index-url https://pypi.org/simple \
              --retries 2 \
              --timeout 20 \
              "agent-doc==${version}"; then
              if installed=$(/tmp/agent-doc-pypi-verify/bin/agent-doc --version); then
                if [ "$installed" = "agent-doc ${version}" ]; then
                  echo "agent-doc ${version} is installable from PyPI's simple index"
                  exit 0
                fi
                echo "attempt ${attempt}: installed version was ${installed}; waiting"
              else
                echo "attempt ${attempt}: package installed but the pinned native release was not runnable yet; waiting"
              fi
            else
              echo "attempt ${attempt}: agent-doc ${version} is not installable from PyPI's simple index yet; waiting"
            fi
            sleep 20
          done
          echo "::error::agent-doc ${version} is not installable from PyPI's simple index after 10 minutes — check index propagation, the project size quota (pypi/support#12214), and the upload logs"
          exit 1
