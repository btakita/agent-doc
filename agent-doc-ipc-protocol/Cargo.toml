[package]
name = "agent-doc-ipc-protocol"
version = "0.34.83"
edition = "2024"
description = "Pure IPC protocol classification policy for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_ipc_protocol"

[dependencies]
agent-doc-hash = { path = "../agent-doc-hash", version = "0.34.83" }
agent-doc-markdown-ast = { path = "../agent-doc-markdown-ast", version = "0.34.83" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
