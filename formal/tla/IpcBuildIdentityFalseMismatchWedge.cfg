\* Non-vacuity obligation. With the identity taken from the build clock instead
\* of the sources, two peers running the SAME code must be rejected somewhere in
\* the state graph. That rejection is consumed as proof of divergence, and it
\* strands an attached document's replica (`EditorReplicaStrand`) for a
\* difference that does not exist. If this config ever passes, the soundness
\* property has stopped constraining the identity function.
SPECIFICATION Spec

CONSTANTS
    MaxCode = 3
    MaxClock = 3
    ContentDerived = FALSE

INVARIANT TypeOK
INVARIANT EquivalentCodeIsAdmitted
