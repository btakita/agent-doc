\* Without the retired-endpoint fence, an observation still in flight across a
\* frontend handoff drives tmux after the handoff's forget was applied. The
\* recovery must never be bought by lifting the fence. MUST violate
\* NoRetiredResurrection.
SPECIFICATION Spec

CONSTANTS
    MaxCopies = 2
    MaxGen = 0
    MaxSeq = 2
    MaxCGen = 3
    MaxHandoffs = 1
    RetireOnNewerReply = FALSE
    ReregisterOnRetired = TRUE
    RetireRaisesFence = TRUE
    RetiredFence = FALSE

INVARIANT NoRetiredResurrection

\* A settled focus is a resting state, not a deadlock.
CHECK_DEADLOCK FALSE
