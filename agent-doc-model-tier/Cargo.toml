[package]
name = "agent-doc-model-tier"
version = "0.35.0"
edition = "2024"
description = "Harness-agnostic model tier resolution for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_model_tier"

[dependencies]
anyhow = "1"
agent-doc-markdown-ast = { path = "../agent-doc-markdown-ast", version = "0.35.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
filetime = "0.2"
tempfile = "3"
