\* Positive run over NetChannel: every resend fix on, receipts keyed by version.
\* Liveness under FairLossy + weakly fair controller resends. One publication
\* and no reconnect keep SF-per-message tractable; the messages carry no
\* generation, so a Reconnect here would only be a burst of Drops.
\* VisibleDeliveryReceiptNetSafety.cfg checks safety with two publications and
\* a reconnect.
SPECIFICATION Spec

CONSTANTS
    MaxVersion = 1
    Budget = 1
    MaxCopies = 2
    MaxGen = 0
    WakeResend = TRUE
    RecoveryRearm = TRUE
    SaveResend = TRUE
    ReceiptsKeyedByVersion = TRUE
    TimeoutIsRefusal = FALSE

INVARIANT TypeOK
INVARIANT AvailabilityIsNotAReceipt
INVARIANT ReceiptImpliesEditorHasCut
INVARIANT SettledImpliesDiskCurrent
INVARIANT DropRequiresDefinitiveRefusal

CHECK_DEADLOCK FALSE
PROPERTY CanonicalEventuallySettled
