[package]
name = "agent-doc-response-toc-io"
version = "0.35.241"
edition = "2024"
description = "File and archive adapters for agent-doc response TOC commands"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_response_toc_io"

[dependencies]
agent-doc-document-realtime-io = { path = "../agent-doc-document-realtime-io", version = "0.35.241" }
agent-doc-response-toc = { path = "../agent-doc-response-toc", version = "0.35.241" }
agent-doc-sqlite = { path = "../agent-doc-sqlite", version = "0.35.241" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
