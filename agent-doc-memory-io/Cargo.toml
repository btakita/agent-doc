[package]
name = "agent-doc-memory-io"
version = "0.35.165"
edition = "2024"
description = "Semantic memory I/O adapters for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_memory_io"

[dependencies]
agent-doc-document = { path = "../agent-doc-document", version = "0.35.165" }
agent-doc-element = { path = "../agent-doc-element", version = "0.35.165" }
agent-doc-element-backlog = { path = "../agent-doc-element-backlog", version = "0.35.165" }
agent-doc-fs = { path = "../agent-doc-fs", version = "0.35.165" }
agent-doc-memory = { path = "../agent-doc-memory", version = "0.35.165" }
agent-doc-queue = { path = "../agent-doc-queue", version = "0.35.165" }
agent-doc-turn = { path = "../agent-doc-turn", version = "0.35.165" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tsift-memory = "0.1.70"

[dev-dependencies]
tempfile = "3"
