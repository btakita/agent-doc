[package]
name = "agent-doc-route-io"
version = "0.34.67"
edition = "2024"
description = "Route target session and pane resolution I/O for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_route_io"

[dependencies]
agent-doc-controller = { path = "../agent-doc-controller", version = "0.34.67" }
agent-doc-harness = { path = "../agent-doc-harness", version = "0.34.67" }
agent-doc-project-config-io = { path = "../agent-doc-project-config-io", version = "0.34.67" }
agent-doc-session-registry-io = { path = "../agent-doc-session-registry-io", version = "0.34.67" }
agent-doc-sync = { path = "../agent-doc-sync", version = "0.34.67" }
agent-doc-sync-io = { path = "../agent-doc-sync-io", version = "0.34.67" }
agent-doc-tmux-io = { path = "../agent-doc-tmux-io", version = "0.34.67" }
anyhow = "1"
tmux-router = { path = "../../tmux-router", version = "0.3.11" }

[dev-dependencies]
tempfile = "3"
