SPECIFICATION Spec

\* Non-vacuity in the other direction. `AgentNeverReachesAnEditor` MUST be
\* violated: forward merging still delivers agent work into open editors.
CONSTANTS
    Editors = {e1, e2}
    OperatorAtoms = {o1, o2}
    AgentAtoms = {a1}
    EditorAuthority = TRUE

INVARIANT TypeOK
INVARIANT AgentNeverReachesAnEditor
