agent-doc-document = { path = "../agent-doc-document", version = "0.35.149" }
agent-doc-document-realtime = { path = "../agent-doc-document-realtime", version = "0.35.149" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.35.149" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.35.149" }
agent-doc-markdown-ast = { path = "../agent-doc-markdown-ast", version = "0.35.149" }
agent-doc-ops-log-io = { path = "../agent-doc-ops-log-io", version = "0.35.149" }
agent-doc-project-root-io = { path = "../agent-doc-project-root-io", version = "0.35.149" }
agent-doc-session-registry-io = { path = "../agent-doc-session-registry-io", version = "0.35.149" }
