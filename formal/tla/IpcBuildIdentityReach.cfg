\* Reach obligation. Both safety properties are implications, so a handshake
\* that had become a constant would satisfy one of them vacuously. Under the fix
\* the handshake must still reach BOTH outcomes, so this must be violated.
SPECIFICATION Spec

CONSTANTS
    MaxCode = 3
    MaxClock = 3
    ContentDerived = TRUE

INVARIANT TypeOK
INVARIANT BothOutcomesUnreachable
