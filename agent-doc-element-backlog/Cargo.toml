[package]
name = "agent-doc-element-backlog"
version = "0.34.91"
edition = "2024"
description = "Backlog element model and descriptor for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_element_backlog"

[dependencies]
agent-doc-element = { path = "../agent-doc-element", version = "0.34.91" }
