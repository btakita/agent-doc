[package]
name = "agent-doc-preflight-command-io"
version = "0.35.289"
edition = "2024"
description = "Preflight command host runtime for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_preflight_command_io"
doctest = false

[dependencies]
agent-doc-controller = { path = "../agent-doc-controller", version = "0.35.289" }
# `#relaylockpoison`: locks here are parking_lot, not `std::sync` — the workspace
# keeps `panic=unwind` so the cdylib's `catch_unwind` guards survive a panic in a
# host IDE, but that unwind passes THROUGH any live guard, so a poisoning mutex
# turns a survivable panic into a permanent process-wide outage.
parking_lot = "0.12"
agent-doc-callback-io = { path = "../agent-doc-callback-io", version = "0.35.289" }
agent-doc-capture-io = { path = "../agent-doc-capture-io", version = "0.35.289" }
agent-doc-closeout-runtime-io = { path = "../agent-doc-closeout-runtime-io", version = "0.35.289" }
agent-doc-codex-hook-io = { path = "../agent-doc-codex-hook-io", version = "0.35.289" }
agent-doc-commit-io = { path = "../agent-doc-commit-io", version = "0.35.289" }
agent-doc-config = { path = "../agent-doc-config", version = "0.35.289" }
agent-doc-controller-io = { path = "../agent-doc-controller-io", version = "0.35.289" }
agent-doc-cycle-state-io = { path = "../agent-doc-cycle-state-io", version = "0.35.289" }
agent-doc-debounce = { path = "../agent-doc-debounce", version = "0.35.289" }
agent-doc-diff = { path = "../agent-doc-diff", version = "0.35.289" }
agent-doc-diff-io = { path = "../agent-doc-diff-io", version = "0.35.289" }
