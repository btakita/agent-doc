[package]
name = "agent-doc-op-capture-io"
version = "0.35.198"
edition = "2024"
description = "Durable editor operation capture state for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_op_capture_io"

[dependencies]
# `#relaylockpoison`: locks here are parking_lot, not `std::sync` — the workspace
# keeps `panic=unwind` so the cdylib's `catch_unwind` guards survive a panic in a
# host IDE, but that unwind passes THROUGH any live guard, so a poisoning mutex
# turns a survivable panic into a permanent process-wide outage.
parking_lot = "0.12"
agent-doc-controller = { path = "../agent-doc-controller", version = "0.35.198" }
agent-doc-fs = { path = "../agent-doc-fs", version = "0.35.198" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.35.198" }
agent-doc-merge = { path = "../agent-doc-merge", version = "0.35.198" }
agent-doc-project-root-io = { path = "../agent-doc-project-root-io", version = "0.35.198" }
agent-doc-snapshot-io = { path = "../agent-doc-snapshot-io", version = "0.35.198" }
agent-doc-sqlite = { path = "../agent-doc-sqlite", version = "0.35.198" }
agent-doc-state-backbone = { path = "../agent-doc-state-backbone", version = "0.35.198" }
agent-doc-state-wire = { path = "../agent-doc-state-wire", version = "0.35.198" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
