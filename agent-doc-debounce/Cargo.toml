[package]
name = "agent-doc-debounce"
version = "0.34.74"
edition = "2024"
description = "Editor debounce, live-buffer, and write-provenance sidecars for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_debounce"

[dependencies]
agent-doc-hash = { path = "../agent-doc-hash", version = "0.34.74" }
agent-doc-log-time = { path = "../agent-doc-log-time", version = "0.34.74" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
