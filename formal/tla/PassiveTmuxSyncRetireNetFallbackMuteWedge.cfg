\* The Remote Dev sibling: the frontend handoff legitimately retires the frame,
\* the backend fallback later resumes on that frame at the SAME per-process
\* generation, and without re-registration every observation is fenced. The
\* self-retirement edge is OFF, so the counterexample can only be the handoff.
\* MUST violate LiveEndpointNeverMuted.
SPECIFICATION Spec

CONSTANTS
    MaxCopies = 1
    MaxGen = 0
    MaxSeq = 3
    MaxCGen = 3
    MaxHandoffs = 1
    RetireOnNewerReply = FALSE
    ReregisterOnRetired = FALSE
    RetireRaisesFence = TRUE
    RetiredFence = TRUE

INVARIANT TypeOK
PROPERTY LiveEndpointNeverMuted

\* A settled focus is a resting state, not a deadlock.
CHECK_DEADLOCK FALSE
