[package]
name = "agent-doc-controller-io"
version = "0.34.67"
edition = "2024"
description = "Controller filesystem/log adapters for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_controller_io"

[dependencies]
agent-doc-controller = { path = "../agent-doc-controller", version = "0.34.67" }
agent-doc-fs = { path = "../agent-doc-fs", version = "0.34.67" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.34.67" }
agent-doc-secret-redact = { path = "../agent-doc-secret-redact", version = "0.34.67" }
agent-doc-tmux-commands = { path = "../agent-doc-tmux-commands", version = "0.34.67" }
anyhow = "1"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
