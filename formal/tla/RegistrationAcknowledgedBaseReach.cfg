SPECIFICATION Spec

\* Non-vacuity in the other direction. `NeverMergesFromAcknowledged` MUST be
\* violated, proving the positive run actually merges from the acknowledged
\* replica text rather than registering only through the settled shadow.
CONSTANTS
    UseAcknowledgedBase = TRUE
    AllowRowConflict = TRUE
    MaxEdits = 3

INVARIANT TypeOK
INVARIANT NeverMergesFromAcknowledged

CHECK_DEADLOCK FALSE
