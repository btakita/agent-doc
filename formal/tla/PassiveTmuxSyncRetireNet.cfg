\* Positive run of the fixed design over NetChannel: no self-retirement on a
\* superseded reply, a live endpoint re-registers above a retired generation,
\* forget raises the fence, and the retired fence stays. One frontend handoff
\* (with fallback) is allowed, so the Remote Dev path is covered. Liveness under
\* FairLossy + the editor re-sending the kept intent.
SPECIFICATION Spec

CONSTANTS
    MaxCopies = 1
    MaxGen = 0
    MaxSeq = 3
    MaxCGen = 2
    MaxHandoffs = 1
    RetireOnNewerReply = FALSE
    ReregisterOnRetired = TRUE
    RetireRaisesFence = TRUE
    RetiredFence = TRUE

INVARIANT TypeOK
INVARIANT NoRetiredResurrection
INVARIANT ControllerGenerationNeverAheadOfEditor

PROPERTY LiveEndpointNeverMuted
PROPERTY VisibleEventuallyMatchesEditor

\* A settled focus is a resting state, not a deadlock.
CHECK_DEADLOCK FALSE
