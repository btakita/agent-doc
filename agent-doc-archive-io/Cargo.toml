[package]
name = "agent-doc-archive-io"
version = "0.35.574"
edition = "2024"
description = "Compact archive file I/O adapters for agent-doc"
license = "Apache-2.0"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_archive_io"

[dependencies]
agent-doc-hash = { path = "../agent-doc-hash", version = "0.35.574" }
agent-doc-markdown-ast = { path = "../agent-doc-markdown-ast", version = "0.35.574" }
agent-doc-document = { path = "../agent-doc-document", version = "0.35.574" }
agent-doc-element = { path = "../agent-doc-element", version = "0.35.574" }
agent-doc-project-root-io = { path = "../agent-doc-project-root-io", version = "0.35.574" }
agent-doc-sqlite = { path = "../agent-doc-sqlite", version = "0.35.574" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
