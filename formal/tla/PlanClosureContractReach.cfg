\* Non-vacuity obligation (reach): a genuinely dispatched head must still close
\* out. Asserted negated, so this cfg is must-violate. Without it, a plan that
\* simply never emitted `--done` would satisfy every safety invariant while
\* being useless.
SPECIFICATION Spec

CONSTANTS
    Ids = {a, b}
    OperatorGated = {b}
    GateDoneOnDispatch = TRUE

INVARIANT TypeOK
INVARIANT NeverClosesAnything
