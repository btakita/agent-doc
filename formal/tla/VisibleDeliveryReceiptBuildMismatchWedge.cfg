\* Non-vacuity obligation, second knob: the drop edge is present but an
\* exhausted build mismatch is not classified as definitive. The endpoint
\* answered with a typed version rejection AND the reload-only recovery failed,
\* yet it stays "retryable", so nothing ever proves it stopped serving and the
\* canonical cut never reaches disk. One wedge PER KNOB - a single wedge would
\* let this fix go vacuous the moment the other one landed.
SPECIFICATION Spec

CONSTANTS
    MaxNonconvergence = 2
    DropOnDefinitiveRefusal = TRUE
    BuildMismatchIsDefinitive = FALSE

INVARIANT TypeOK
INVARIANT AvailabilityIsNotAReceipt
INVARIANT NeverSavesWithoutReceipt
INVARIANT DropRequiresDefinitiveRefusal
INVARIANT RefusalRequiresAnAnswer

PROPERTY CanonicalAlwaysEventuallyReachesDisk
