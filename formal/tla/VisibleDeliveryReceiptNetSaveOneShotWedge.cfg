\* F13 (and F12) pre-fix: the retained native save is not re-requested once its
\* budget is spent, so a dropped Save or Saved receipt leaves the cut unsaved
\* on an idle document forever. MUST violate CanonicalEventuallySettled.
SPECIFICATION Spec

CONSTANTS
    MaxVersion = 1
    Budget = 1
    MaxCopies = 2
    MaxGen = 0
    WakeResend = TRUE
    RecoveryRearm = TRUE
    SaveResend = FALSE
    ReceiptsKeyedByVersion = TRUE
    TimeoutIsRefusal = FALSE

INVARIANT TypeOK
PROPERTY CanonicalEventuallySettled

CHECK_DEADLOCK FALSE
