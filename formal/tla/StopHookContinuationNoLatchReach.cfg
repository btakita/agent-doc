\* Reach obligation, second half: blocking ONCE ever would also satisfy the
\* safety properties. The fix must still request a continuation on a later run,
\* so one non-advancing head cannot latch continuation off for the life of the
\* document. This must be violated.
SPECIFICATION Spec

CONSTANTS
    MaxRun = 3
    MaxHead = 3
    GuardKeyedToRun = TRUE

INVARIANT TypeOK
INVARIANT NeverBlocksTwice
