SPECIFICATION Spec

\* Non-vacuity. The shipped single-splice containment proof: after a disk
\* projection moves the binary-owned marker, the covering splice spans the
\* marker and the operator's edit together, canonical's marker differs, and the
\* hold has no exit. `EventuallyRegistered` MUST be violated -- the fpe.md wedge
\* of 2026-09-29. If it ever holds here, per-edit containment is decorative.
CONSTANTS
    PerEditContainment = FALSE
    MaxEdits = 2

INVARIANT TypeOK
INVARIANT NoOperatorTextLoss
PROPERTY EventuallyRegistered

CHECK_DEADLOCK FALSE
