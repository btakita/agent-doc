[package]
name = "agent-doc-tmux"
version = "0.35.552"
edition = "2024"
description = "Pure tmux realtime model state for agent-doc"
license = "Apache-2.0"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_tmux"

[dependencies]
agent-doc-state-scope = { path = "../agent-doc-state-scope", version = "0.35.552" }
lazily = { version = "0.61.0", features = ["thread-safe"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
