[package]
name = "agent-doc-write-runtime-io"
version = "0.35.87"
edition = "2024"
description = "Runtime write command adapters for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_write_runtime_io"

[dependencies]
# `#relaylockpoison`: locks here are parking_lot, not `std::sync` — the workspace
# keeps `panic=unwind` so the cdylib's `catch_unwind` guards survive a panic in a
# host IDE, but that unwind passes THROUGH any live guard, so a poisoning mutex
# turns a survivable panic into a permanent process-wide outage.
parking_lot = "0.12"
agent-doc-capture-io = { path = "../agent-doc-capture-io", version = "0.35.87" }
agent-doc-closeout-runtime-io = { path = "../agent-doc-closeout-runtime-io", version = "0.35.87" }
agent-doc-controller-io = { path = "../agent-doc-controller-io", version = "0.35.87" }
agent-doc-crdt-relay-io = { path = "../agent-doc-crdt-relay-io", version = "0.35.87" }
agent-doc-cycle-state-io = { path = "../agent-doc-cycle-state-io", version = "0.35.87" }
agent-doc-debounce = { path = "../agent-doc-debounce", version = "0.35.87" }
agent-doc-diff = { path = "../agent-doc-diff", version = "0.35.87" }
agent-doc-document = { path = "../agent-doc-document", version = "0.35.87" }
agent-doc-document-realtime = { path = "../agent-doc-document-realtime", version = "0.35.87" }
agent-doc-document-realtime-io = { path = "../agent-doc-document-realtime-io", version = "0.35.87" }
agent-doc-element = { path = "../agent-doc-element", version = "0.35.87" }
agent-doc-element-backlog-io = { path = "../agent-doc-element-backlog-io", version = "0.35.87" }
agent-doc-element-backlog-runtime-io = { path = "../agent-doc-element-backlog-runtime-io", version = "0.35.87" }
agent-doc-element-exchange = { path = "../agent-doc-element-exchange", version = "0.35.87" }
agent-doc-element-exchange-io = { path = "../agent-doc-element-exchange-io", version = "0.35.87" }
agent-doc-flow = { path = "../agent-doc-flow", version = "0.35.87" }
agent-doc-flow-io = { path = "../agent-doc-flow-io", version = "0.35.87" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.35.87" }
agent-doc-frontmatter-io = { path = "../agent-doc-frontmatter-io", version = "0.35.87" }
agent-doc-fs = { path = "../agent-doc-fs", version = "0.35.87" }
agent-doc-git-io = { path = "../agent-doc-git-io", version = "0.35.87" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.35.87" }
agent-doc-hooks-io = { path = "../agent-doc-hooks-io", version = "0.35.87" }
agent-doc-ipc-io = { path = "../agent-doc-ipc-io", version = "0.35.87" }
agent-doc-ipc-protocol = { path = "../agent-doc-ipc-protocol", version = "0.35.87" }
agent-doc-lint-io = { path = "../agent-doc-lint-io", version = "0.35.87" }
agent-doc-log-time = { path = "../agent-doc-log-time", version = "0.35.87" }
agent-doc-merge = { path = "../agent-doc-merge", version = "0.35.87" }
agent-doc-merge-io = { path = "../agent-doc-merge-io", version = "0.35.87" }
agent-doc-op-capture-io = { path = "../agent-doc-op-capture-io", version = "0.35.87" }
agent-doc-ops-log-io = { path = "../agent-doc-ops-log-io", version = "0.35.87" }
