[package]
name = "agent-doc-markdown-ast"
version = "0.35.562"
edition = "2024"
license = "Apache-2.0"
description = "Structured markdown block AST for agent-doc session documents (tree-sitter-md based)"
repository = "https://github.com/btakita/agent-doc"
publish = false

[dependencies]
agent-doc-element = { path = "../agent-doc-element", version = "0.35.562" }
agent-doc-element-queue = { path = "../agent-doc-element-queue", version = "0.35.562" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.35.562" }
agent-doc-queue-icons = { path = "../agent-doc-queue-icons", version = "0.35.562" }
serde_json = "1"
tree-sitter = "0.26"
tree-sitter-md = "0.5"

[dev-dependencies]
pulldown-cmark = "0.13"
