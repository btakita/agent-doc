[package]
name = "agent-doc-ffi"
version = "0.35.240"
edition = "2024"
description = "C/JNA FFI exports for agent-doc editor integrations"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_ffi"

[dependencies]
# `#relaylockpoison`: the replica registry uses parking_lot, not std::sync::Mutex.
# This cdylib is loaded into the host IDE and every export is wrapped in
# `ffi_guard`/`catch_unwind` so a replica panic degrades to ERR_FFI_PANIC instead
# of aborting the editor. But the guard unwinds THROUGH this registry's lock, so
# with a poisoning mutex that survivable panic left every later replica call
# returning -1/null for the life of the IDE -- exactly the outage catch_unwind
# exists to prevent.
parking_lot = "0.12"
agent-doc-document-realtime = { path = "../agent-doc-document-realtime", version = "0.35.240" }
agent-doc-element = { path = "../agent-doc-element", version = "0.35.240" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.35.240" }
agent-doc-markdown-ast = { path = "../agent-doc-markdown-ast", version = "0.35.240" }
agent-doc-merge = { path = "../agent-doc-merge", version = "0.35.240" }
agent-doc-syntax = { path = "../agent-doc-syntax", version = "0.35.240" }
agent-doc-template = { path = "../agent-doc-template", version = "0.35.240" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
