\* Non-vacuity obligation, instance 1 (`route_queue_activation` on
\* sampleorders.md): a transient refusal the caller does not RECOGNISE as
\* transient reads as an authored verdict and is never re-asked, so the caller
\* fails closed forever. With `ClassifyTransientRefusal = FALSE` the liveness
\* property MUST be violated.
SPECIFICATION Spec

CONSTANTS
    MaxRetryAttempts = 3
    MaxFaults = 2
    ClassifyTransientRefusal = FALSE
    WaitForWitness = TRUE
    ClassifyCrashAsTransient = TRUE

CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT OnlyAuthoredVerdictsStop

PROPERTY ProgressOnlyWhenServed
PROPERTY NeverRetriesAnAuthoredVerdict

PROPERTY StableResponderIsEventuallyServed
