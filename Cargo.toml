[workspace]
members = ["agent-doc-core", "agent-doc-sqlite", "agent-doc-orchestration", "agent-doc-markdown-ast"]

[package]
name = "agent-doc"
version = "0.34.8"
edition = "2024"
description = "Interactive document sessions with AI agents"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
readme = "README.md"
exclude = [
    "editors/jetbrains/build/**",
    "editors/jetbrains/gradle/**",
    "editors/jetbrains/.gradle/**",
    "editors/vscode/node_modules/**",
    "editors/vscode/out/**",
    ".agent-doc/**",
    "docs/book/**",
]

[lib]
name = "agent_doc"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "agent-doc"
path = "src/main.rs"

[dependencies]
agent-doc-core = { path = "agent-doc-core" }
agent-doc-markdown-ast = { path = "agent-doc-markdown-ast" }
agent-doc-orchestration = { path = "agent-doc-orchestration" }
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
sha2 = "0.11"
toml = "1.1"
ureq = { version = "3", features = ["json"] }
tempfile = "3"
zip = "8"
uuid = { version = "1", features = ["v4"] }
notify = "8"
agent-kit = { path = "../agent-kit", version = "0.4.0", features = ["hooks"] }
instruction-files = "0.3"
tmux-router = "0.3.10"
pulldown-cmark = "0.13"
indexmap = { version = "2", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
libc = "0.2"
tiny_http = { version = "0.12", default-features = false, features = ["ssl-rustls"] }

# Heavy deps removed from the CLI shell in #bz6s Wave 5 — now reached only
# transitively through agent-doc-orchestration (acceptance criterion #2):
# alacritty_terminal, fs2, hex, htmd, interprocess, portable-pty, regex,
# rusqlite, serde_yaml, signal-hook, tagpath, yrs.

[dev-dependencies]
# Enable orchestration's in-process controller test short-circuits for the CLI
# shell's own tests (project_controller moved to orchestration in #bz6s).
agent-doc-orchestration = { path = "agent-doc-orchestration", features = ["test-support"] }
assert_cmd = "2"
existence = "0.4"
filetime = "0.2"
hex = "0.4"
module-harness = "0.2.1"
predicates = "3"
proptest = "1"
tempfile = "3"

[patch.crates-io]
tmux-router = { path = "../tmux-router" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
