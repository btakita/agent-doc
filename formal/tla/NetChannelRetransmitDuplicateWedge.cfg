\* Non-vacuity (b): a non-idempotent receiver applies every copy it gets.
\* Duplicate (or a resend after a lost ack) delivers the same item twice, and
\* ExactlyOnce MUST be violated.
SPECIFICATION Spec

CONSTANTS
    N = 2
    MaxCopies = 2
    MaxGen = 1
    Retransmit = TRUE
    Idempotent = FALSE
    GenCheck = TRUE
    ChannelFair = TRUE

INVARIANT TypeOK
INVARIANT ExactlyOnce

CHECK_DEADLOCK FALSE
