\* F14/F15 pre-fix: SurfaceTracking advances before the swap and the reply is
\* Ok either way. One transient tmux failure leaves the wrong pane visible and
\* every re-send folds to Idle. MUST violate VisibleEventuallyMatchesEditor.
SPECIFICATION Spec

CONSTANTS
    MaxCopies = 2
    MaxGen = 0
    MaxFails = 1
    AdvanceOnEffect = FALSE
    SeqFence = TRUE

INVARIANT TypeOK
PROPERTY VisibleEventuallyMatchesEditor

\* A settled focus is a resting state, not a deadlock.
CHECK_DEADLOCK FALSE
