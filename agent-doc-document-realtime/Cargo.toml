[package]
name = "agent-doc-document-realtime"
version = "0.34.153"
edition = "2024"
description = "Realtime document authority state machine for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_document_realtime"

[dependencies]
agent-doc-document = { path = "../agent-doc-document", version = "0.34.153" }
agent-doc-diff = { path = "../agent-doc-diff", version = "0.34.153" }
agent-doc-element = { path = "../agent-doc-element", version = "0.34.153" }
agent-doc-element-backlog = { path = "../agent-doc-element-backlog", version = "0.34.153" }
agent-doc-element-exchange = { path = "../agent-doc-element-exchange", version = "0.34.153" }
agent-doc-flow = { path = "../agent-doc-flow", version = "0.34.153" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.34.153" }
agent-doc-merge = { path = "../agent-doc-merge", version = "0.34.153" }
agent-doc-prompt-lines = { path = "../agent-doc-prompt-lines", version = "0.34.153" }
agent-doc-queue = { path = "../agent-doc-queue", version = "0.34.153" }
agent-doc-state-backbone = { path = "../agent-doc-state-backbone", version = "0.34.153" }
agent-doc-template = { path = "../agent-doc-template", version = "0.34.153" }
agent-doc-turn = { path = "../agent-doc-turn", version = "0.34.153" }
anyhow = "1"
lazily = { version = "0.40.0", features = ["thread-safe"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
similar = "3"
