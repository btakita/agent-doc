[package]
name = "agent-doc-supervisor-process"
version = "0.34.70"
edition = "2024"
description = "Supervisor process effect boundary for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_supervisor_process"

[dependencies]
agent-doc-cycle-state-io = { path = "../agent-doc-cycle-state-io", version = "0.34.70" }
agent-doc-harness = { path = "../agent-doc-harness", version = "0.34.70" }
agent-doc-ops-log-io = { path = "../agent-doc-ops-log-io", version = "0.34.70" }
agent-doc-supervisor = { path = "../agent-doc-supervisor", version = "0.34.70" }
agent-doc-tmux = { path = "../agent-doc-tmux", version = "0.34.70" }
agent-doc-tmux-commands = { path = "../agent-doc-tmux-commands", version = "0.34.70" }
agent-doc-tmux-io = { path = "../agent-doc-tmux-io", version = "0.34.70" }
agent-doc-turn = { path = "../agent-doc-turn", version = "0.34.70" }
alacritty_terminal = "0.26"
anyhow = "1"
libc = "0.2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
signal-hook = "0.4"
tmux-router = { path = "../../tmux-router", version = "0.3.14" }

[dev-dependencies]
tempfile = "3"
