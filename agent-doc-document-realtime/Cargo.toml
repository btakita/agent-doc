[package]
name = "agent-doc-document-realtime"
version = "0.34.65"
edition = "2024"
description = "Realtime document authority state machine for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_document_realtime"

[dependencies]
agent-doc-document = { path = "../agent-doc-document", version = "0.34.65" }
agent-doc-element = { path = "../agent-doc-element", version = "0.34.65" }
agent-doc-merge = { path = "../agent-doc-merge", version = "0.34.65" }
anyhow = "1"
lazily = "0.13.1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
