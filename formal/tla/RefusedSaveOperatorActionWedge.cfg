SPECIFICATION Spec

\* Non-vacuity. With the refusal excluded from the terminal set -- the shipped
\* behaviour before `#refusedsaveopaque` -- an endpoint that answered and refused
\* every route reports `operator_action=none`, and
\* `AnsweredRefusalAlwaysSurfacesOperatorAction` MUST be violated. If it ever
\* holds here, the invariant is not being carried by the classification and the
\* fix is decorative.
CONSTANTS
    MaxPasses = 4
    ClassifyRefusalAsTerminal = FALSE

INVARIANT TypeOK
INVARIANT AnsweredRefusalAlwaysSurfacesOperatorAction

CHECK_DEADLOCK FALSE
