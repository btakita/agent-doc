\* Safety of the fixed design with DUPLICATED messages (MaxCopies = 2): a
\* duplicated retired receipt, forget, or observation must not re-register twice,
\* retire a newer registration, or resurrect a retired one. Smaller sequence
\* bound than PassiveTmuxSyncRetireNetSafety; invariants only.
SPECIFICATION Spec

CONSTANTS
    MaxCopies = 2
    MaxGen = 0
    MaxSeq = 2
    MaxCGen = 3
    MaxHandoffs = 2
    RetireOnNewerReply = FALSE
    ReregisterOnRetired = TRUE
    RetireRaisesFence = TRUE
    RetiredFence = TRUE

INVARIANT TypeOK
INVARIANT NoRetiredResurrection
INVARIANT ControllerGenerationNeverAheadOfEditor

\* A settled focus is a resting state, not a deadlock.
CHECK_DEADLOCK FALSE
