[package]
name = "agent-doc-model-tier"
version = "0.35.246"
edition = "2024"
description = "Harness-agnostic model tier resolution for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_model_tier"

[dependencies]
# `#relaylockpoison`: locks here are parking_lot, not `std::sync` — the workspace
# keeps `panic=unwind` so the cdylib's `catch_unwind` guards survive a panic in a
# host IDE, but that unwind passes THROUGH any live guard, so a poisoning mutex
# turns a survivable panic into a permanent process-wide outage.
parking_lot = "0.12"
anyhow = "1"
agent-doc-markdown-ast = { path = "../agent-doc-markdown-ast", version = "0.35.246" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
filetime = "0.2"
tempfile = "3"
