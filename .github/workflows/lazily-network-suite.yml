name: Lazily network suite

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lazily-*/**"
      - ".github/workflows/lazily-network-suite.yml"
  push:
    branches: [main]
    paths:
      - "src/lazily-*/**"
      - ".github/workflows/lazily-network-suite.yml"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: Network matrix tier
        required: true
        default: merge
        type: choice
        options: [pr, merge, nightly]

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Checkout Lazily bindings
        run: |
          git -c url.https://github.com/.insteadOf=git@github.com: submodule update --init \
            src/lazily-spec src/lazily-formal src/lazily-rs src/lazily-zig \
            src/lazily-py src/lazily-kt src/lazily-js src/lazily-dart \
            src/lazily-go src/lazily-cpp src/lazily-cs
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: dart-lang/setup-dart@v1
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Resolve matrix tier
        id: tier
        shell: bash
        run: |
          tier=pr
          if [[ "${{ github.event_name }}" == "push" ]]; then tier=merge; fi
          if [[ "${{ github.event_name }}" == "schedule" ]]; then tier=nightly; fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tier="${{ inputs.tier }}"
          fi
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
      - name: Run network matrix
        working-directory: src/lazily-interop
        run: make "network-suite-${{ steps.tier.outputs.tier }}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lazily-network-${{ steps.tier.outputs.tier }}
          path: src/lazily-interop/reports/*.json
          if-no-files-found: error
