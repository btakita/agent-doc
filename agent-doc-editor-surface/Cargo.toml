[package]
name = "agent-doc-editor-surface"
version = "0.35.61"
edition = "2024"
description = "Pure editor-surface observation and tmux-intent derivation for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_editor_surface"

[dependencies]
agent-doc-state-scope = { path = "../agent-doc-state-scope", version = "0.35.61" }
lazily = { version = "0.53.0", features = ["thread-safe"] }
serde = { version = "1", features = ["derive"] }
