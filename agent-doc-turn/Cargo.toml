[package]
name = "agent-doc-turn"
version = "0.35.374"
edition = "2024"
description = "Pure turn lifecycle and operation-scope models for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_turn"

[dependencies]
agent-doc-state-scope = { path = "../agent-doc-state-scope", version = "0.35.374" }
agent-doc-element = { path = "../agent-doc-element", version = "0.35.374" }
agent-doc-element-backlog = { path = "../agent-doc-element-backlog", version = "0.35.374" }
agent-doc-diff = { path = "../agent-doc-diff", version = "0.35.374" }
agent-doc-document = { path = "../agent-doc-document", version = "0.35.374" }
agent-doc-flow = { path = "../agent-doc-flow", version = "0.35.374" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.35.374" }
agent-doc-markdown-ast = { path = "../agent-doc-markdown-ast", version = "0.35.374" }
agent-doc-prompt-lines = { path = "../agent-doc-prompt-lines", version = "0.35.374" }
agent-doc-queue = { path = "../agent-doc-queue", version = "0.35.374" }
agent-doc-template = { path = "../agent-doc-template", version = "0.35.374" }
lazily = { version = "0.57.1", features = ["thread-safe"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
similar = "3"

[dev-dependencies]
# `#timestampresponseheader`: the cross-parser heading test drives the compact
# digest's topic summarizer alongside the three closeout parsers, so a format
# change cannot satisfy some readers and silently break others.
agent-doc-topic = { path = "../agent-doc-topic", version = "0.35.374" }
proptest = "1"
serde_json = "1"
