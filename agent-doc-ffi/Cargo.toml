[package]
name = "agent-doc-ffi"
version = "0.34.102"
edition = "2024"
description = "C/JNA FFI exports for agent-doc editor integrations"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_ffi"

[dependencies]
agent-doc-element = { path = "../agent-doc-element", version = "0.34.102" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.34.102" }
agent-doc-merge = { path = "../agent-doc-merge", version = "0.34.102" }
agent-doc-syntax = { path = "../agent-doc-syntax", version = "0.34.102" }
agent-doc-template = { path = "../agent-doc-template", version = "0.34.102" }
anyhow = "1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
