SPECIFICATION Spec

\* Non-vacuity for the `typingforkdup` projection. `DiskWorkNeverLandsBesideStaleTwin`
\* MUST be violated: with the shipped fix, a disk save carrying both a stale
\* revision of the operator's typing AND independent disk work still merges
\* that work. (With the projection off, the twin-pair guard refuses the whole
\* candidate and this property would hold -- the projection is load-bearing.)
CONSTANTS
    StopOnEqualsAuthority = FALSE
    DuplicateGuard = TRUE
    TwinPairGuard = TRUE
    TwinCollapse = "input"

INVARIANT TypeOK
INVARIANT DiskWorkNeverLandsBesideStaleTwin
