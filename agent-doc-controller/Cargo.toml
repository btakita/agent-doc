[package]
name = "agent-doc-controller"
version = "0.35.289"
edition = "2024"
description = "Project controller model and CAS vocabulary for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_controller"

[[example]]
name = "pane_layout_projection_benchmark"
test = false
bench = false

[dependencies]
agent-doc-element-backlog = { path = "../agent-doc-element-backlog", version = "0.35.289" }
agent-doc-flow = { path = "../agent-doc-flow", version = "0.35.289" }
agent-doc-fs = { path = "../agent-doc-fs", version = "0.35.289" }
agent-doc-queue = { path = "../agent-doc-queue", version = "0.35.289" }
agent-doc-supervisor = { path = "../agent-doc-supervisor", version = "0.35.289" }
agent-doc-tmux-commands = { path = "../agent-doc-tmux-commands", version = "0.35.289" }
agent-doc-turn = { path = "../agent-doc-turn", version = "0.35.289" }
agent-doc-turn-executor-tmux = { path = "../agent-doc-turn-executor-tmux", version = "0.35.289" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
