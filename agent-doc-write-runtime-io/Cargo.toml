agent-doc-write-command-io = { path = "../agent-doc-write-command-io", version = "0.35.87" }
agent-doc-write-converge-io = { path = "../agent-doc-write-converge-io", version = "0.35.87" }
agent-doc-write-ipc-io = { path = "../agent-doc-write-ipc-io", version = "0.35.87" }
anyhow = "1"
fs2 = "0.4"
serde_json = "1"
tempfile = "3"
tmux-router = { path = "../../tmux-router", version = "0.3.14" }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
agent-doc-reliable-sync-io = { path = "../agent-doc-reliable-sync-io", version = "0.35.87" }
agent-doc-closeout-runtime-io = { path = "../agent-doc-closeout-runtime-io", version = "0.35.87", features = ["test-support"] }
agent-doc-document-realtime-io = { path = "../agent-doc-document-realtime-io", version = "0.35.87", features = ["test-support"] }
agent-doc-preflight-runtime-io = { path = "../agent-doc-preflight-runtime-io", version = "0.35.87", features = ["test-support"] }
agent-doc-repair-runtime-io = { path = "../agent-doc-repair-runtime-io", version = "0.35.87" }
