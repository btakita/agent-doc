SPECIFICATION Spec

\* Non-vacuity for WHERE the `typingforkdup` collapse runs. Filtering each
\* rung's OUTPUT removes the twin but leaves it in the count guard's bound, and
\* that spare slot admits an unrelated duplicate (a twin plus two different
\* edits of one baseline item). `NoDuplicateItem` MUST be violated; the shipped
\* fix projects the merge INPUT instead.
CONSTANTS
    StopOnEqualsAuthority = FALSE
    DuplicateGuard = TRUE
    TwinPairGuard = TRUE
    TwinCollapse = "output"

INVARIANT TypeOK
INVARIANT NoDuplicateItem
