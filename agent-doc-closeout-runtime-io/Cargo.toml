[package]
name = "agent-doc-closeout-runtime-io"
version = "0.34.69"
edition = "2024"
description = "Closeout, session-check, and repair recovery runtime effects for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_closeout_runtime_io"

[features]
default = []
test-support = [
    "agent-doc-commit-io/test-support",
    "agent-doc-document-realtime-io/test-support",
    "agent-doc-preflight-runtime-io/test-support",
    "agent-doc-session-check-io/test-support",
]

[dependencies]
agent-doc-commit-io = { path = "../agent-doc-commit-io", version = "0.34.69" }
agent-doc-cycle-state-io = { path = "../agent-doc-cycle-state-io", version = "0.34.69" }
agent-doc-document-realtime-io = { path = "../agent-doc-document-realtime-io", version = "0.34.69" }
agent-doc-flow-io = { path = "../agent-doc-flow-io", version = "0.34.69" }
agent-doc-preflight-io = { path = "../agent-doc-preflight-io", version = "0.34.69" }
agent-doc-preflight-runtime-io = { path = "../agent-doc-preflight-runtime-io", version = "0.34.69" }
agent-doc-repair-io = { path = "../agent-doc-repair-io", version = "0.34.69" }
agent-doc-session-check-io = { path = "../agent-doc-session-check-io", version = "0.34.69" }
agent-doc-template-io = { path = "../agent-doc-template-io", version = "0.34.69" }
anyhow = "1"
