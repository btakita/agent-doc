\* Reachability obligation: the editor-first happy path must still be LIVE.
\*
\* This config asserts the negation of full convergence as an invariant, so TLC is
\* REQUIRED to violate it. The violation trace is the proof that a served endpoint
\* still reaches a published cut, a granular replay, and a saved projection.
\*
\* Without this, making the liveness claim conditional on `endpointServes` would
\* let an unreachable served branch satisfy every remaining property vacuously.
SPECIFICATION Spec

CONSTANT DemoteOnDefinitiveRejection = TRUE

INVARIANT TypeOK
INVARIANT FullConvergenceIsUnreachable
