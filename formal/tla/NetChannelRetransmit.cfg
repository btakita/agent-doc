\* Positive run: resend-until-ack, idempotent receiver, generation check.
\* Safety holds under the fully adversarial NetChannel (Drop, Duplicate,
\* Reconnect, any order); Completes holds under NetChannel!FairLossy.
SPECIFICATION Spec

CONSTANTS
    N = 2
    MaxCopies = 2
    MaxGen = 1
    Retransmit = TRUE
    Idempotent = TRUE
    GenCheck = TRUE
    ChannelFair = TRUE

INVARIANT TypeOK
INVARIANT ExactlyOnce
INVARIANT NoStaleApply
INVARIANT AckedImpliesApplied

PROPERTY Completes

\* Completion is a terminal resting state, not a deadlock.
CHECK_DEADLOCK FALSE
