[package]
name = "agent-doc-repair-io"
version = "0.34.67"
edition = "2024"
description = "Repair sidecar I/O for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_repair_io"

[dependencies]
agent-doc-hash = { path = "../agent-doc-hash", version = "0.34.67" }
agent-doc-project-root-io = { path = "../agent-doc-project-root-io", version = "0.34.67" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
