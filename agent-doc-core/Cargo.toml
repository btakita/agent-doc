[package]
name = "agent-doc-core"
version = "0.1.0"
edition = "2024"
description = "Pure document data layer for agent-doc (component parsing, frontmatter, template, CRDT, pending, diff classification, model tier)"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_core"

[dev-dependencies]
tempfile = "3"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
pulldown-cmark = "0.12"
yrs = "0.21"
similar = "2"
