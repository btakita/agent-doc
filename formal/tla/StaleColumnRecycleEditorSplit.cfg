\* `#stalewidenrestore` (GH #343): the fixed gate with editor split observations
\* interleaved with derived-count publications. Two publications cover a
\* restart's narrow frame followed by the editor's wider split; every GH #136
\* invariant must still hold alongside EditorRequestedStalePaneNeverHidden.
SPECIFICATION Spec

CONSTANTS
    MaxWidth = 3
    MaxPublications = 2
    MaxFanouts = 1
    GuardOverdue = TRUE
    GuardWiden = TRUE
    DurableRequest = TRUE
    LapseFanout = FALSE
    RefreshResetsClock = FALSE
    PromoteOverdue = TRUE
    EditorWidthAuthority = TRUE
    EditorSplits = {FALSE, TRUE}
    MaxCopies = 2
    MaxGen = 1

INVARIANT TypeOK
INVARIANT NoStashPromotionWhileOverdue
INVARIANT StashPromotionNeverWidens
INVARIANT NoFlapAfterOverdueRefusal
INVARIANT OverdueStalePaneNeverHidden
INVARIANT FlaggedPromotionRealisesThePublication
INVARIANT EditorRequestedStalePaneNeverHidden

PROPERTY EventuallyConsumed
