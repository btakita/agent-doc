\* GH #136: the fixed gate and the durable, level-triggered request, over
\* derived-count publications. `StaleColumnRecycleEditorSplit.cfg` adds editor
\* split observations (`#stalewidenrestore`) at a smaller publication bound.
SPECIFICATION Spec

CONSTANTS
    MaxWidth = 3
    MaxPublications = 3
    MaxFanouts = 1
    GuardOverdue = TRUE
    GuardWiden = TRUE
    DurableRequest = TRUE
    LapseFanout = FALSE
    RefreshResetsClock = FALSE
    PromoteOverdue = TRUE
    EditorWidthAuthority = TRUE
    EditorSplits = {FALSE}
    MaxCopies = 2
    MaxGen = 1

INVARIANT TypeOK
INVARIANT NoStashPromotionWhileOverdue
INVARIANT StashPromotionNeverWidens
INVARIANT NoFlapAfterOverdueRefusal
INVARIANT OverdueStalePaneNeverHidden
INVARIANT FlaggedPromotionRealisesThePublication
INVARIANT EditorRequestedStalePaneNeverHidden

PROPERTY EventuallyConsumed
