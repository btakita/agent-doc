SPECIFICATION Spec

\* Non-vacuity. The shipped shadow-only proof: an operator who keeps typing never
\* settles the shadow, canonical's copy of the typing and the buffer's copy are
\* then two changes of one slot, and registration holds beside a controller
\* write on a different slot. `NoSpuriousHold` MUST be violated -- the
\* agent-doc-bugs.md hold of 2026-10-28 12:57:53. If it ever holds here, the
\* acknowledged base is decorative.
CONSTANTS
    UseAcknowledgedBase = FALSE
    AllowRowConflict = TRUE
    MaxEdits = 3

INVARIANT TypeOK
INVARIANT NoOperatorTextLoss
INVARIANT NoControllerTextLoss
INVARIANT NoSpuriousHold

CHECK_DEADLOCK FALSE
