[package]
name = "agent-doc-crdt-relay-io"
version = "0.35.216"
edition = "2024"
description = "CRDT relay host IO boundary for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_crdt_relay_io"
doctest = false

[dependencies]
agent-doc-debounce = { path = "../agent-doc-debounce", version = "0.35.216" }
agent-doc-document-realtime = { path = "../agent-doc-document-realtime", version = "0.35.216" }
agent-doc-element = { path = "../agent-doc-element", version = "0.35.216" }
agent-doc-fs = { path = "../agent-doc-fs", version = "0.35.216" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.35.216" }
agent-doc-ipc-io = { path = "../agent-doc-ipc-io", version = "0.35.216" }
agent-doc-ipc-protocol = { path = "../agent-doc-ipc-protocol", version = "0.35.216" }
agent-doc-merge = { path = "../agent-doc-merge", version = "0.35.216" }
agent-doc-ops-log-io = { path = "../agent-doc-ops-log-io", version = "0.35.216" }
agent-doc-project-root-io = { path = "../agent-doc-project-root-io", version = "0.35.216" }
agent-doc-reliable-sync-io = { path = "../agent-doc-reliable-sync-io", version = "0.35.216" }
agent-doc-sqlite = { path = "../agent-doc-sqlite", version = "0.35.216" }
agent-doc-snapshot-io = { path = "../agent-doc-snapshot-io", version = "0.35.216" }
agent-doc-turn = { path = "../agent-doc-turn", version = "0.35.216" }
anyhow = "1"
lazily = { version = "0.56.0", features = ["ipc", "durable-sqlite"] }
# `#relaylockpoison`: the relay registries use parking_lot, not std::sync::Mutex.
# The workspace deliberately keeps `panic = "unwind"` so the cdylib's
# catch_unwind guards survive a replica panic inside the host IDE; a poisoning
# mutex would turn that survivable panic into a permanent, process-wide relay
# outage for every document in that IDE.
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
