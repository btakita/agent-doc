SPECIFICATION Spec

\* Non-vacuity for the 2026-10-15 incident itself: the pre-fix ladder (all
\* three guards on), restricted to a disk cut AHEAD of the authority's.
\* `NoDuplicateWhenDiskAhead` MUST be violated, and the trace is the incident:
\* the merge copies the corrected line from disk as a new item, then the
\* in-flight correction rewrites the editor's own item into the same text.
CONSTANTS
    Policy = "ladder"
    N = 4
    LedgerBased = TRUE

INVARIANT TypeOK
INVARIANT NoDuplicateWhenDiskAhead
