agent-doc-state-backbone = { path = "../agent-doc-state-backbone", version = "0.35.222" }
agent-doc-supervisor = { path = "../agent-doc-supervisor", version = "0.35.222" }
agent-doc-supervisor-io = { path = "../agent-doc-supervisor-io", version = "0.35.222" }
agent-doc-supervisor-process = { path = "../agent-doc-supervisor-process", version = "0.35.222" }
agent-doc-supervisor-process-io = { path = "../agent-doc-supervisor-process-io", version = "0.35.222" }
agent-doc-tmux-commands = { path = "../agent-doc-tmux-commands", version = "0.35.222" }
