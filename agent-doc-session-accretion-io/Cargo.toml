agent-doc-ops-log-io = { path = "../agent-doc-ops-log-io", version = "0.35.214" }
agent-doc-project-config-io = { path = "../agent-doc-project-config-io", version = "0.35.214" }
agent-doc-session-accretion = { path = "../agent-doc-session-accretion", version = "0.35.214" }
agent-doc-sqlite = { path = "../agent-doc-sqlite", version = "0.35.214" }
agent-doc-supervisor-io = { path = "../agent-doc-supervisor-io", version = "0.35.214" }
anyhow = "1"
serde_json = "1"

[dev-dependencies]
