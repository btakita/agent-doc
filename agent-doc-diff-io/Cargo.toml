[package]
name = "agent-doc-diff-io"
version = "0.34.173"
edition = "2024"
description = "Snapshot-backed diff IO adapters for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_diff_io"

[dependencies]
agent-doc-debounce = { path = "../agent-doc-debounce", version = "0.34.173" }
agent-doc-diff = { path = "../agent-doc-diff", version = "0.34.173" }
agent-doc-fs = { path = "../agent-doc-fs", version = "0.34.173" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.34.173" }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
