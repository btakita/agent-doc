[package]
name = "agent-doc-orchestration"
version = "0.35.8"
edition = "2024"
description = "Orchestration layer for agent-doc (routing, git, sessions, IPC, supervision, sync) — adapts the CLI to focused domain crates"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_orchestration"

[features]
# Exposes the in-process controller test short-circuits to downstream crates'
# test builds (the `agent-doc` CLI shell enables this in dev-dependencies so its
# tests that call `project_controller` behave as they did pre-extraction).
test-support = []

