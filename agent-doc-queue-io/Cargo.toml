[package]
name = "agent-doc-queue-io"
version = "0.34.89"
edition = "2024"
description = "Queue-related I/O for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_queue_io"

[dependencies]
agent-doc-debounce = { path = "../agent-doc-debounce", version = "0.34.89" }
agent-doc-document-realtime = { path = "../agent-doc-document-realtime", version = "0.34.89" }
agent-doc-element = { path = "../agent-doc-element", version = "0.34.89" }
agent-doc-element-backlog = { path = "../agent-doc-element-backlog", version = "0.34.89" }
agent-doc-capture-io = { path = "../agent-doc-capture-io", version = "0.34.89" }
agent-doc-controller-io = { path = "../agent-doc-controller-io", version = "0.34.89" }
agent-doc-cycle-state-io = { path = "../agent-doc-cycle-state-io", version = "0.34.89" }
agent-doc-document = { path = "../agent-doc-document", version = "0.34.89" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.34.89" }
agent-doc-fs = { path = "../agent-doc-fs", version = "0.34.89" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.34.89" }
agent-doc-markdown-ast = { path = "../agent-doc-markdown-ast", version = "0.34.89" }
agent-doc-owner-pane-io = { path = "../agent-doc-owner-pane-io", version = "0.34.89" }
agent-doc-ops-log-io = { path = "../agent-doc-ops-log-io", version = "0.34.89" }
agent-doc-queue = { path = "../agent-doc-queue", version = "0.34.89" }
agent-doc-snapshot-io = { path = "../agent-doc-snapshot-io", version = "0.34.89" }
agent-doc-sqlite = { path = "../agent-doc-sqlite", version = "0.34.89" }
agent-doc-state-backbone = { path = "../agent-doc-state-backbone", version = "0.34.89" }
agent-doc-workflow-io = { path = "../agent-doc-workflow-io", version = "0.34.89" }
anyhow = "1"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
