[package]
name = "agent-doc-git-io"
version = "0.34.67"
edition = "2024"
description = "Git command I/O adapters for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_git_io"

[dependencies]
agent-doc-diff = { path = "../agent-doc-diff", version = "0.34.67" }
agent-doc-document = { path = "../agent-doc-document", version = "0.34.67" }
agent-doc-element-exchange-io = { path = "../agent-doc-element-exchange-io", version = "0.34.67" }
agent-doc-git = { path = "../agent-doc-git", version = "0.34.67" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.34.67" }
agent-doc-turn = { path = "../agent-doc-turn", version = "0.34.67" }
anyhow = "1"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
