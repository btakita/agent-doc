\* Non-vacuity obligation. With the demotion edge removed, a definitively refused
\* re-registration must leave the document with NO authority — the production
\* wedge. `EventuallyResolved` must be reported violated; run_tla.sh lists this
\* config as must-violate so the positive run above cannot go vacuous again.
\*
\* The safety invariants are still checked here: the wedge must be a stall, never
\* a corruption.
SPECIFICATION Spec

CONSTANT DemoteOnDefinitiveRejection = FALSE

INVARIANT TypeOK
INVARIANT OperatorIntentIsMonotonic
INVARIANT PublishedBaselineContainsOperatorCut
INVARIANT SavedProjectionContainsOperatorCut
INVARIANT RefusalNeverPublishesACut
INVARIANT OperatorCutSurvivesRefusal
INVARIANT DiskAuthorityRequiresRefusal

PROPERTY EventuallyResolved
