[package]
name = "agent-doc-start-runtime-io"
version = "0.35.222"
edition = "2024"
description = "Start command host runtime for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_start_runtime_io"
doctest = false

[dependencies]
uuid = { version = "1", features = ["v4"] }
# `#relaylockpoison`: locks here are parking_lot, not `std::sync` — the workspace
# keeps `panic=unwind` so the cdylib's `catch_unwind` guards survive a panic in a
# host IDE, but that unwind passes THROUGH any live guard, so a poisoning mutex
# turns a survivable panic into a permanent process-wide outage.
parking_lot = "0.12"
agent-doc-agent-io = { path = "../agent-doc-agent-io", version = "0.35.222" }
agent-doc-codex-hook-io = { path = "../agent-doc-codex-hook-io", version = "0.35.222" }
agent-doc-commit-io = { path = "../agent-doc-commit-io", version = "0.35.222" }
agent-doc-config = { path = "../agent-doc-config", version = "0.35.222" }
agent-doc-controller = { path = "../agent-doc-controller", version = "0.35.222" }
agent-doc-controller-io = { path = "../agent-doc-controller-io", version = "0.35.222" }
agent-doc-crdt-relay-io = { path = "../agent-doc-crdt-relay-io", version = "0.35.222" }
agent-doc-cycle-state-io = { path = "../agent-doc-cycle-state-io", version = "0.35.222" }
agent-doc-debounce = { path = "../agent-doc-debounce", version = "0.35.222" }
agent-doc-document = { path = "../agent-doc-document", version = "0.35.222" }
agent-doc-document-realtime = { path = "../agent-doc-document-realtime", version = "0.35.222" }
agent-doc-document-realtime-io = { path = "../agent-doc-document-realtime-io", version = "0.35.222" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.35.222" }
agent-doc-frontmatter-io = { path = "../agent-doc-frontmatter-io", version = "0.35.222" }
agent-doc-fs = { path = "../agent-doc-fs", version = "0.35.222" }
agent-doc-git-io = { path = "../agent-doc-git-io", version = "0.35.222" }
agent-doc-harness = { path = "../agent-doc-harness", version = "0.35.222" }
agent-doc-session-actor-io = { path = "../agent-doc-session-actor-io", version = "0.35.222" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.35.222" }
agent-doc-hooks-io = { path = "../agent-doc-hooks-io", version = "0.35.222" }
agent-doc-ipc-io = { path = "../agent-doc-ipc-io", version = "0.35.222" }
agent-doc-model-tier = { path = "../agent-doc-model-tier", version = "0.35.222" }
agent-doc-ops-log-io = { path = "../agent-doc-ops-log-io", version = "0.35.222" }
agent-doc-preflight-io = { path = "../agent-doc-preflight-io", version = "0.35.222" }
agent-doc-project-config-io = { path = "../agent-doc-project-config-io", version = "0.35.222" }
agent-doc-project-root-io = { path = "../agent-doc-project-root-io", version = "0.35.222" }
agent-doc-queue = { path = "../agent-doc-queue", version = "0.35.222" }
agent-doc-queue-io = { path = "../agent-doc-queue-io", version = "0.35.222" }
agent-doc-repair-command-io = { path = "../agent-doc-repair-command-io", version = "0.35.222" }
agent-doc-run-context-io = { path = "../agent-doc-run-context-io", version = "0.35.222" }
agent-doc-session-accretion-io = { path = "../agent-doc-session-accretion-io", version = "0.35.222" }
