\* ADC-fence (remaining item): with every heartbeat fix in place but an
\* unfenced commit, the lease expires between the last refresh A saw and its
\* commit, B claims and commits too. MUST violate AtMostOneCommit.
SPECIFICATION Spec

CONSTANTS
    MaxCopies = 2
    MaxGen = 1
    StableOwnerId = TRUE
    HeartbeatRetries = TRUE
    AbortOnLeaseLoss = TRUE
    CommitFenced = FALSE

INVARIANT AtMostOneCommit

\* Every closeout reaches a terminal phase; that is a resting state, not a deadlock.
CHECK_DEADLOCK FALSE
