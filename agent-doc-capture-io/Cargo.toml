[package]
name = "agent-doc-capture-io"
version = "0.34.91"
edition = "2024"
description = "Response capture ledger path I/O for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_capture_io"

[dependencies]
agent-doc-cycle-state-io = { path = "../agent-doc-cycle-state-io", version = "0.34.91" }
agent-doc-element = { path = "../agent-doc-element", version = "0.34.91" }
agent-doc-fs = { path = "../agent-doc-fs", version = "0.34.91" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.34.91" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.34.91" }
agent-doc-model-tier = { path = "../agent-doc-model-tier", version = "0.34.91" }
agent-doc-ops-log-io = { path = "../agent-doc-ops-log-io", version = "0.34.91" }
agent-doc-project-root-io = { path = "../agent-doc-project-root-io", version = "0.34.91" }
agent-doc-secret-redact = { path = "../agent-doc-secret-redact", version = "0.34.91" }
agent-doc-snapshot-io = { path = "../agent-doc-snapshot-io", version = "0.34.91" }
agent-doc-turn = { path = "../agent-doc-turn", version = "0.34.91" }
agent-doc-workflow = { path = "../agent-doc-workflow", version = "0.34.91" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
