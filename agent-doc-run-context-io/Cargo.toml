agent-doc-fs = { path = "../agent-doc-fs", version = "0.34.151" }
agent-doc-git-io = { path = "../agent-doc-git-io", version = "0.34.151" }
agent-doc-model-tier = { path = "../agent-doc-model-tier", version = "0.34.151" }
