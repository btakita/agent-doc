\* Without the sequence fence a reordered older focus is applied after a
\* newer one. MUST violate NoStaleFocusApplied.
SPECIFICATION Spec

CONSTANTS
    MaxCopies = 2
    MaxGen = 0
    MaxFails = 1
    AdvanceOnEffect = TRUE
    SeqFence = FALSE

INVARIANT NoStaleFocusApplied

\* A settled focus is a resting state, not a deadlock.
CHECK_DEADLOCK FALSE
