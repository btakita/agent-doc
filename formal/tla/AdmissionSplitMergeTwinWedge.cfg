SPECIFICATION Spec

\* Non-vacuity for `typingforkdup` (2026-10-11). The count guard is ON, the
\* revision-twin collapse is OFF -- the shipped ladder on that day. Disk holds
\* an intermediate revision of the item the operator is typing; the line rung
\* keeps it as a second item and the guard counts it as a disk addition.
\* `NoDuplicateItem` MUST be violated.
CONSTANTS
    StopOnEqualsAuthority = FALSE
    DuplicateGuard = TRUE
    TwinPairGuard = FALSE
    TwinCollapse = "off"

INVARIANT TypeOK
INVARIANT NoDuplicateItem
