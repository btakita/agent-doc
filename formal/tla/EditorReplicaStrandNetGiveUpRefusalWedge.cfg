\* R2/R3 class (owned by #netadv5): an expired receipt wait counted as a
\* refusal demotes a SERVING endpoint whose receipts were merely lost.
\* MUST violate DemotionRequiresProof.
SPECIFICATION Spec

CONSTANTS
    MaxReregisterAttempts = 2
    MaxCopies = 2
    MaxGen = 0
    RearmUnanswered = TRUE
    GiveUpIsRefusal = TRUE

INVARIANT DemotionRequiresProof

\* A permanently silent endpoint is an intended resting state (silence is not
\* proof), so deadlock checking is off; the liveness properties carry the signal.
CHECK_DEADLOCK FALSE
