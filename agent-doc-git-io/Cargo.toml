[package]
name = "agent-doc-git-io"
version = "0.35.158"
edition = "2024"
description = "Git command I/O adapters for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_git_io"

[features]
default = ["adstatechart"]
adstatechart = ["dep:agent-doc-state-backbone"]

[dependencies]
# `#relaylockpoison`: locks here are parking_lot, not `std::sync` — the workspace
# keeps `panic=unwind` so the cdylib's `catch_unwind` guards survive a panic in a
# host IDE, but that unwind passes THROUGH any live guard, so a poisoning mutex
# turns a survivable panic into a permanent process-wide outage.
parking_lot = "0.12"
agent-doc-debounce = { path = "../agent-doc-debounce", version = "0.35.158" }
agent-doc-diff = { path = "../agent-doc-diff", version = "0.35.158" }
agent-doc-document = { path = "../agent-doc-document", version = "0.35.158" }
agent-doc-element-boundary = { path = "../agent-doc-element-boundary", version = "0.35.158" }
agent-doc-element-exchange = { path = "../agent-doc-element-exchange", version = "0.35.158" }
agent-doc-element-exchange-io = { path = "../agent-doc-element-exchange-io", version = "0.35.158" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.35.158" }
agent-doc-git = { path = "../agent-doc-git", version = "0.35.158" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.35.158" }
agent-doc-merge = { path = "../agent-doc-merge", version = "0.35.158" }
agent-doc-queue = { path = "../agent-doc-queue", version = "0.35.158" }
agent-doc-state-backbone = { path = "../agent-doc-state-backbone", version = "0.35.158", optional = true }
agent-doc-template = { path = "../agent-doc-template", version = "0.35.158" }
agent-doc-turn = { path = "../agent-doc-turn", version = "0.35.158" }
agent-doc-workflow = { path = "../agent-doc-workflow", version = "0.35.158" }
anyhow = "1"
similar = "2"
tempfile = "3"
