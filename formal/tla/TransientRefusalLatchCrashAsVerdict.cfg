\* Non-vacuity obligation, instances 2 and 4: a responder that panicked before
\* answering authored no verdict, but the client surfaced `project controller
\* closed connection without a response` as a reasoned refusal and the agent
\* correctly stopped on it. With `ClassifyCrashAsTransient = FALSE` the liveness
\* property MUST be violated.
SPECIFICATION Spec

CONSTANTS
    MaxRetryAttempts = 3
    MaxFaults = 2
    ClassifyTransientRefusal = TRUE
    WaitForWitness = TRUE
    ClassifyCrashAsTransient = FALSE

CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT OnlyAuthoredVerdictsStop

PROPERTY ProgressOnlyWhenServed
PROPERTY NeverRetriesAnAuthoredVerdict

PROPERTY StableResponderIsEventuallyServed
