agent-doc-document-realtime-io = { path = "../agent-doc-document-realtime-io", version = "0.35.94" }
agent-doc-element = { path = "../agent-doc-element", version = "0.35.94" }
agent-doc-element-boundary = { path = "../agent-doc-element-boundary", version = "0.35.94" }
