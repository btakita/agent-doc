[package]
name = "agent-doc-crdt-relay-io"
version = "0.34.91"
edition = "2024"
description = "CRDT relay host IO boundary for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_crdt_relay_io"
doctest = false

[dependencies]
agent-doc-debounce = { path = "../agent-doc-debounce", version = "0.34.91" }
agent-doc-document-realtime = { path = "../agent-doc-document-realtime", version = "0.34.91" }
agent-doc-fs = { path = "../agent-doc-fs", version = "0.34.91" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.34.91" }
agent-doc-ipc-io = { path = "../agent-doc-ipc-io", version = "0.34.91" }
agent-doc-ops-log-io = { path = "../agent-doc-ops-log-io", version = "0.34.91" }
agent-doc-plugin-owner = { path = "../agent-doc-plugin-owner", version = "0.34.91" }
agent-doc-project-root-io = { path = "../agent-doc-project-root-io", version = "0.34.91" }
agent-doc-reliable-sync-io = { path = "../agent-doc-reliable-sync-io", version = "0.34.91" }
agent-doc-sqlite = { path = "../agent-doc-sqlite", version = "0.34.91" }
agent-doc-snapshot-io = { path = "../agent-doc-snapshot-io", version = "0.34.91" }
anyhow = "1"
lazily = { version = "0.38.1", features = ["ipc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
agent-doc-merge = { path = "../agent-doc-merge", version = "0.34.91" }
tempfile = "3"
