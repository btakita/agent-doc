\* Non-vacuity (a): fire-and-forget. Each item is sent once and never resent,
\* so a single Drop stalls the protocol forever (MaxGen = 0: no reconnects, so
\* the counterexample is pure loss). Completes MUST be violated, because
\* NetChannel!FairLossy only promises delivery of a message that is put in
\* flight infinitely often.
SPECIFICATION Spec

CONSTANTS
    N = 2
    MaxCopies = 2
    MaxGen = 0
    Retransmit = FALSE
    Idempotent = TRUE
    GenCheck = TRUE
    ChannelFair = TRUE

INVARIANT TypeOK
PROPERTY Completes

CHECK_DEADLOCK FALSE
