\* `#predecessorlandandack` pre-fix: a predecessor's ACK deletes the row and leaves
\* no receipt the successor acts on, so a row it landed and acknowledged after the
\* successor's load leaves nothing to drain. MUST violate EventuallyFolded.
SPECIFICATION Spec

CONSTANTS
    FoldOnLateDuplicate = TRUE
    ReconcileAckReceipts = FALSE
    OrphanRule = "refold"

PROPERTY EventuallyFolded

CHECK_DEADLOCK FALSE
