SPECIFICATION Spec

\* `#queuecutexclusive` + `#keylogrebase`: the shipped rule. A component both
\* planes changed takes the authority's version; a component only disk changed
\* whose body is a state of the correctly based op ledger is the editor's own
\* text and keeps the authority's version too. The editor's own ops roll both
\* forward exactly once.
CONSTANTS
    Policy = "provenance"
    N = 4
    LedgerBased = TRUE

INVARIANT TypeOK
INVARIANT NoDuplicateInConcurrentComponent
INVARIANT ConvergesConcurrent
INVARIANT ConvergesAttributed
