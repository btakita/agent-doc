\* Non-vacuity in the other direction. NeverCompletesUnderAdversary MUST be
\* violated: the positive run reaches completion AFTER the adversary delivered
\* a duplicate and a message that survived a Reconnect, so the green result
\* is not an artifact of a channel that never misbehaves.
SPECIFICATION Spec

CONSTANTS
    N = 2
    MaxCopies = 2
    MaxGen = 1
    Retransmit = TRUE
    Idempotent = TRUE
    GenCheck = TRUE
    ChannelFair = TRUE

INVARIANT TypeOK
INVARIANT NeverCompletesUnderAdversary

CHECK_DEADLOCK FALSE
