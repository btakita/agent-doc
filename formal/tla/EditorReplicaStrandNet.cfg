\* Positive run over NetChannel: unanswered budgets re-arm, a lost receipt is
\* never a refusal. Safety under the full adversary; liveness under FairLossy.
SPECIFICATION Spec

CONSTANTS
    MaxReregisterAttempts = 2
    MaxCopies = 2
    MaxGen = 1
    RearmUnanswered = TRUE
    GiveUpIsRefusal = FALSE

INVARIANT TypeOK
INVARIANT NeverReadsDiskWhileEndpointServes
INVARIANT DemotionRequiresProof
INVARIANT DemotionRequiresAnAnswer
INVARIANT EditorReplicaOutranksDisk

PROPERTY AnsweringEndpointResolves
PROPERTY ServingEndpointReattaches

\* A permanently silent endpoint is an intended resting state (silence is not
\* proof), so deadlock checking is off; the liveness properties carry the signal.
CHECK_DEADLOCK FALSE
