SPECIFICATION Spec

\* Non-vacuity for provenance: the text-only rule (`#queuecutexclusive` alone)
\* MUST violate `NoDuplicateWhenCovered`. A component only disk changed is
\* merged, and when that change is the editor's own in-flight typing it
\* arrives twice -- text cannot tell it from independent disk work.
CONSTANTS
    Policy = "exclusive"
    N = 4
    LedgerBased = TRUE

INVARIANT TypeOK
INVARIANT NoDuplicateWhenCovered
