[package]
name = "agent-doc-agent-io"
version = "0.34.92"
edition = "2024"
description = "Agent backend process adapters for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_agent_io"

[dependencies]
agent-doc-config = { path = "../agent-doc-config", version = "0.34.92" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.34.92" }
agent-doc-git-io = { path = "../agent-doc-git-io", version = "0.34.92" }
agent-doc-harness = { path = "../agent-doc-harness", version = "0.34.92" }
agent-doc-turn-executor = { path = "../agent-doc-turn-executor", version = "0.34.92" }
anyhow = "1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
