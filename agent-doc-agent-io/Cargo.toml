[package]
name = "agent-doc-agent-io"
version = "0.35.271"
edition = "2024"
description = "Agent backend process adapters for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_agent_io"

[dependencies]
# `#relaylockpoison`: locks here are parking_lot, not `std::sync` — the workspace
# keeps `panic=unwind` so the cdylib's `catch_unwind` guards survive a panic in a
# host IDE, but that unwind passes THROUGH any live guard, so a poisoning mutex
# turns a survivable panic into a permanent process-wide outage.
parking_lot = "0.12"
agent-doc-config = { path = "../agent-doc-config", version = "0.35.271" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.35.271" }
agent-doc-git-io = { path = "../agent-doc-git-io", version = "0.35.271" }
agent-doc-harness = { path = "../agent-doc-harness", version = "0.35.271" }
agent-doc-turn-executor = { path = "../agent-doc-turn-executor", version = "0.35.271" }
anyhow = "1"
libc = "0.2"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
