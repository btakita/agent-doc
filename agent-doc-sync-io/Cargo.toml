[package]
name = "agent-doc-sync-io"
version = "0.35.267"
edition = "2024"
description = "Sync lock and process-effect adapters for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_sync_io"

[dependencies]
agent-doc-state-scope = { path = "../agent-doc-state-scope", version = "0.35.267" }
# `#relaylockpoison`: locks here are parking_lot, not `std::sync` — the workspace
# keeps `panic=unwind` so the cdylib's `catch_unwind` guards survive a panic in a
# host IDE, but that unwind passes THROUGH any live guard, so a poisoning mutex
# turns a survivable panic into a permanent process-wide outage.
parking_lot = "0.12"
agent-doc-capture-io = { path = "../agent-doc-capture-io", version = "0.35.267" }
agent-doc-controller = { path = "../agent-doc-controller", version = "0.35.267" }
agent-doc-controller-io = { path = "../agent-doc-controller-io", version = "0.35.267" }
agent-doc-cycle-state-io = { path = "../agent-doc-cycle-state-io", version = "0.35.267" }
agent-doc-document = { path = "../agent-doc-document", version = "0.35.267" }
agent-doc-element = { path = "../agent-doc-element", version = "0.35.267" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.35.267" }
agent-doc-frontmatter-io = { path = "../agent-doc-frontmatter-io", version = "0.35.267" }
agent-doc-fs = { path = "../agent-doc-fs", version = "0.35.267" }
agent-doc-git-io = { path = "../agent-doc-git-io", version = "0.35.267" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.35.267" }
agent-doc-harness = { path = "../agent-doc-harness", version = "0.35.267" }
agent-doc-log-time = { path = "../agent-doc-log-time", version = "0.35.267" }
agent-doc-ops-log-io = { path = "../agent-doc-ops-log-io", version = "0.35.267" }
agent-doc-process-owner-io = { path = "../agent-doc-process-owner-io", version = "0.35.267" }
agent-doc-project-config-io = { path = "../agent-doc-project-config-io", version = "0.35.267" }
agent-doc-project-root-io = { path = "../agent-doc-project-root-io", version = "0.35.267" }
agent-doc-run-context-io = { path = "../agent-doc-run-context-io", version = "0.35.267" }
agent-doc-session-actor-io = { path = "../agent-doc-session-actor-io", version = "0.35.267" }
agent-doc-session-registry-io = { path = "../agent-doc-session-registry-io", version = "0.35.267" }
agent-doc-snapshot-io = { path = "../agent-doc-snapshot-io", version = "0.35.267" }
agent-doc-sqlite = { path = "../agent-doc-sqlite", version = "0.35.267" }
agent-doc-supervisor = { path = "../agent-doc-supervisor", version = "0.35.267" }
agent-doc-supervisor-io = { path = "../agent-doc-supervisor-io", version = "0.35.267" }
agent-doc-supervisor-process = { path = "../agent-doc-supervisor-process", version = "0.35.267" }
agent-doc-sync = { path = "../agent-doc-sync", version = "0.35.267" }
agent-doc-tmux = { path = "../agent-doc-tmux", version = "0.35.267" }
agent-doc-tmux-io = { path = "../agent-doc-tmux-io", version = "0.35.267" }
agent-doc-turn = { path = "../agent-doc-turn", version = "0.35.267" }
agent-doc-workflow-io = { path = "../agent-doc-workflow-io", version = "0.35.267" }
anyhow = "1"
lazily = "0.56.1"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tmux-router = { path = "../../tmux-router", version = "0.3.14" }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
