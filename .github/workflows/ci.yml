name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # #ci-per-test-timeout-guard backstop: CI runs `make check` via the plain
    # `cargo test` fallback (cargo-nextest is not installed here), which has no
    # per-test timeout, so a lock/IPC deadlock would otherwise hang until
    # GitHub's 6-hour default. Cap the job well above a legitimate cold run
    # (~25-40 min incl. compile + tmux-ci) but far below that ceiling. Precise
    # per-test termination lives in .config/nextest.toml for the nextest path.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check out agent-kit path dependency
        run: git clone --depth 1 https://github.com/btakita/agent-kit ../agent-kit

      - name: Check out tmux-router patch dependency
        run: git clone --depth 1 https://github.com/btakita/tmux-router ../tmux-router

      - name: Check out lazily-rs path dependency
        run: git clone --depth 1 https://github.com/btakita/lazily-rs ../lazily-rs

      - name: Install tmux for integration tests
        run: sudo apt-get update && sudo apt-get install -y tmux

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run make check
        run: make check

      - name: Run make tmux-ci
        run: |
          echo "Running make tmux-ci"
          make tmux-ci
