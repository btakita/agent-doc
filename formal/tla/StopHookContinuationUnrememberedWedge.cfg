\* Second direction of the same wedge, stated as the cause rather than the
\* symptom: under the marker-hosted bound the hook can block without anything
\* being remembered at all. That is "absent, not weak", and it must be violated
\* here or `EveryRequestIsRemembered` is not constraining the arming path.
SPECIFICATION Spec

CONSTANTS
    MaxRun = 3
    MaxHead = 3
    GuardKeyedToRun = FALSE

INVARIANT TypeOK
INVARIANT EveryRequestIsRemembered
