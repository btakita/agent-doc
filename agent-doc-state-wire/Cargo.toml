[package]
name = "agent-doc-state-wire"
version = "0.35.190"
edition = "2024"
description = "Lazily-spec snapshot and delta wire format for agent-doc state projections"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_state_wire"

[dependencies]
agent-doc-state-backbone = { path = "../agent-doc-state-backbone", version = "0.35.190" }
agent-doc-turn = { path = "../agent-doc-turn", version = "0.35.190" }
anyhow = "1"
base64 = "0.22"
interprocess = { version = "2", default-features = false }
lazily = { version = "0.56.0", features = ["ipc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
