\* F9 pre-fix: one deliver_crdt_remote wake per publication. A single Drop
\* strands the update; no foreground waiter is guaranteed to charge the streak,
\* so nothing ever notices. MUST violate CanonicalEventuallySettled.
SPECIFICATION Spec

CONSTANTS
    MaxVersion = 1
    Budget = 1
    MaxCopies = 2
    MaxGen = 0
    WakeResend = FALSE
    RecoveryRearm = TRUE
    SaveResend = TRUE
    ReceiptsKeyedByVersion = TRUE
    TimeoutIsRefusal = FALSE

INVARIANT TypeOK
PROPERTY CanonicalEventuallySettled

CHECK_DEADLOCK FALSE
