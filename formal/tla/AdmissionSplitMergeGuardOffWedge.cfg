SPECIFICATION Spec

\* Stopping on `equals_authority` instead of guarding is not enough: the identity rung may
\* decline, which still hands the split to the line rung. `NoDuplicateItem`
\* MUST be violated -- the count guard is the load-bearing edge.
CONSTANTS
    StopOnEqualsAuthority = TRUE
    DuplicateGuard = FALSE

INVARIANT TypeOK
INVARIANT NoDuplicateItem
