[package]
name = "agent-doc-prompt-contract"
version = "0.35.60"
edition = "2024"
description = "Prompt contract detection and requirement counting policy for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_prompt_contract"

[dependencies]
agent-doc-diff = { path = "../agent-doc-diff", version = "0.35.60" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.35.60" }
agent-doc-fs = { path = "../agent-doc-fs", version = "0.35.60" }
anyhow = "1"
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
