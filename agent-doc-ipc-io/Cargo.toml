[package]
name = "agent-doc-ipc-io"
version = "0.34.80"
edition = "2024"
description = "Socket and file-signal IPC adapters for agent-doc editor integrations"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_ipc_io"

[dependencies]
agent-doc-debounce = { path = "../agent-doc-debounce", version = "0.34.80" }
agent-doc-document-realtime = { path = "../agent-doc-document-realtime", version = "0.34.80" }
agent-doc-ipc-protocol = { path = "../agent-doc-ipc-protocol", version = "0.34.80" }
agent-doc-ops-log-io = { path = "../agent-doc-ops-log-io", version = "0.34.80" }
agent-doc-plugin-owner = { path = "../agent-doc-plugin-owner", version = "0.34.80" }
anyhow = "1"
interprocess = { version = "2", default-features = false }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
