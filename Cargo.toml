[package]
name = "agent-doc"
version = "0.34.0"
edition = "2024"
description = "Interactive document sessions with AI agents"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
readme = "README.md"
exclude = [
    "editors/jetbrains/build/**",
    "editors/jetbrains/gradle/**",
    "editors/jetbrains/.gradle/**",
    "editors/vscode/node_modules/**",
    "editors/vscode/out/**",
    ".agent-doc/**",
    "docs/book/**",
]

[lib]
name = "agent_doc"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "agent-doc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
fs2 = "0.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
similar = "2"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
tempfile = "3"
zip = "2"
uuid = { version = "1", features = ["v4"] }
notify = "7"
agent-kit = { path = "../agent-kit", version = "0.4.0", features = ["hooks"] }
instruction-files = "0.2"
tmux-router = "0.3.10"
pulldown-cmark = "0.12"
regex = "1"
yrs = "0.21"
interprocess = { version = "2", default-features = false }
htmd = "0.5.3"
indexmap = { version = "2", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
libc = "0.2"
portable-pty = "0.8"
alacritty_terminal = "0.26"
signal-hook = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
tagpath = { version = "0.11.1", default-features = false }
tiny_http = { version = "0.12", default-features = false, features = ["ssl-rustls"] }

[dev-dependencies]
assert_cmd = "2"
existence = "0.4"
filetime = "0.2"
module-harness = "0.2.1"
predicates = "3"
proptest = "1"
tempfile = "3"

[patch.crates-io]
module-harness = { path = "../module-harness" }
tmux-router = { path = "../tmux-router" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
