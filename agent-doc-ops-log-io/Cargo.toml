[package]
name = "agent-doc-ops-log-io"
version = "0.35.15"
edition = "2024"
description = "Ops log read/write adapters for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_ops_log_io"

[dependencies]
# `#relaylockpoison`: locks here are parking_lot, not `std::sync` — the workspace
# keeps `panic=unwind` so the cdylib's `catch_unwind` guards survive a panic in a
# host IDE, but that unwind passes THROUGH any live guard, so a poisoning mutex
# turns a survivable panic into a permanent process-wide outage.
parking_lot = "0.12"
lazily = "0.48.1"
agent-doc-cycle-state-io = { path = "../agent-doc-cycle-state-io", version = "0.35.15" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.35.15" }
agent-doc-git-io = { path = "../agent-doc-git-io", version = "0.35.15" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.35.15" }
agent-doc-log-time = { path = "../agent-doc-log-time", version = "0.35.15" }
agent-doc-project-root-io = { path = "../agent-doc-project-root-io", version = "0.35.15" }
agent-doc-turn = { path = "../agent-doc-turn", version = "0.35.15" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
