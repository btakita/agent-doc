[package]
name = "agent-doc-ipc-io"
version = "0.35.67"
edition = "2024"
description = "Socket and file-signal IPC adapters for agent-doc editor integrations"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_ipc_io"

[dependencies]
# `#relaylockpoison`: locks here are parking_lot, not `std::sync` — the workspace
# keeps `panic=unwind` so the cdylib's `catch_unwind` guards survive a panic in a
# host IDE, but that unwind passes THROUGH any live guard, so a poisoning mutex
# turns a survivable panic into a permanent process-wide outage.
parking_lot = "0.12"
agent-doc-ipc-protocol = { path = "../agent-doc-ipc-protocol", version = "0.35.67" }
agent-doc-ops-log-io = { path = "../agent-doc-ops-log-io", version = "0.35.67" }
anyhow = "1"
interprocess = { version = "2", default-features = false }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
