[package]
name = "agent-doc-reliable-sync-io"
version = "0.35.264"
edition = "2024"
description = "Unix-domain-socket carrier for Lazily reliable-sync intent and visibility receipts"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_reliable_sync_io"

[dependencies]
# `#relaylockpoison`: the liveness plane uses parking_lot, not std::sync::Mutex.
# It is the authority for "is an editor attached", and `panic = "unwind"` is kept
# deliberately so the cdylib's catch_unwind guards survive a replica panic in the
# host IDE. With a poisoning mutex, a caught panic taken under this lock made
# every later read fall back to "no editor" -- silently flipping every document
# in that process to disk authority.
parking_lot = "0.12"
agent-doc-hash = { path = "../agent-doc-hash", version = "0.35.264" }
agent-doc-ipc-io = { path = "../agent-doc-ipc-io", version = "0.35.264" }
agent-doc-merge = { path = "../agent-doc-merge", version = "0.35.264" }
anyhow = "1"
base64 = "0.22"
lazily = { version = "0.56.0", features = ["ipc", "ipc-msgpack", "serde"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
