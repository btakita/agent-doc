[package]
name = "agent-doc-tmux-io"
version = "0.35.484"
edition = "2024"
description = "Effectful tmux command execution adapter for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_tmux_io"

[dependencies]
agent-doc-project-config-io = { path = "../agent-doc-project-config-io", version = "0.35.484" }
agent-doc-state-scope = { path = "../agent-doc-state-scope", version = "0.35.484" }
agent-doc-fs = { path = "../agent-doc-fs", version = "0.35.484" }
agent-doc-editor-surface = { path = "../agent-doc-editor-surface", version = "0.35.484" }
agent-doc-state-backbone = { path = "../agent-doc-state-backbone", version = "0.35.484" }
agent-doc-process-owner-io = { path = "../agent-doc-process-owner-io", version = "0.35.484" }
agent-doc-tmux = { path = "../agent-doc-tmux", version = "0.35.484" }
agent-doc-tmux-commands = { path = "../agent-doc-tmux-commands", version = "0.35.484" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
lazily = "0.57.1"
tmux-router = { path = "../../tmux-router", version = "0.3.14" }

[dev-dependencies]
serde_json = "1"
