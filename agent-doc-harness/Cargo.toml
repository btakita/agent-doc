[package]
name = "agent-doc-harness"
version = "0.35.6"
edition = "2024"
description = "Harness prompt and terminal chrome policy for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_harness"

[dependencies]
agent-doc-config = { path = "../agent-doc-config", version = "0.35.6" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.35.6" }
agent-doc-prompt-contract = { path = "../agent-doc-prompt-contract", version = "0.35.6" }
agent-doc-secret-redact = { path = "../agent-doc-secret-redact", version = "0.35.6" }
agent-doc-turn-executor = { path = "../agent-doc-turn-executor", version = "0.35.6" }
agent-doc-turn-executor-tmux = { path = "../agent-doc-turn-executor-tmux", version = "0.35.6" }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
