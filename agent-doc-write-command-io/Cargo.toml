[package]
name = "agent-doc-write-command-io"
version = "0.35.563"
edition = "2024"
description = "Write command request types for agent-doc"
license = "Apache-2.0"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_write_command_io"

[dependencies]
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.35.563" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
