\* Non-vacuity obligation, instance 3: recognising the refusal is NOT enough.
\* Every missing-replica recovery latch is keyed on the liveness witness, so an
\* attempt spent at an unchanged witness is a provable no-op - and the budget is
\* bounded, so a caller that neither waits nor gates burns it and then fails
\* closed for good. With `WaitForWitness = FALSE` the liveness property MUST be
\* violated. This is the config that makes widening the retry predicate alone
\* insufficient, and why the production fix blocks on
\* `wait_for_editor_replica_liveness_change`.
SPECIFICATION Spec

CONSTANTS
    MaxRetryAttempts = 3
    MaxFaults = 2
    ClassifyTransientRefusal = TRUE
    WaitForWitness = FALSE
    ClassifyCrashAsTransient = TRUE

CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT OnlyAuthoredVerdictsStop

PROPERTY ProgressOnlyWhenServed
PROPERTY NeverRetriesAnAuthoredVerdict

PROPERTY StableResponderIsEventuallyServed
