    MaxWidth = 3
    MaxPublications = 3
    MaxFanouts = 1
    GuardOverdue = TRUE
    GuardWiden = TRUE
    DurableRequest = TRUE
    LapseFanout = FALSE
    RefreshResetsClock = FALSE
    PromoteOverdue = TRUE
    EditorWidthAuthority = TRUE
    EditorSplits = {FALSE}
    MaxCopies = 2
    MaxGen = 1

INVARIANT NeverPromotesFlagged
