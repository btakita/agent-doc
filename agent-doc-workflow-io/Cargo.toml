[package]
name = "agent-doc-workflow-io"
version = "0.34.66"
edition = "2024"
description = "Workflow proof ledger I/O for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_workflow_io"

[dependencies]
agent-doc-hash = { path = "../agent-doc-hash", version = "0.34.66" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
