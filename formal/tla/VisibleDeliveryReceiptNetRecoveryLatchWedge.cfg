\* F10 pre-fix: the non-convergence recovery is latched on its first send. A
\* dropped Recover never yields the Refuse the drop edge needs, so a refusing
\* replica vetoes the receipt forever. MUST violate CanonicalEventuallySettled.
SPECIFICATION Spec

CONSTANTS
    MaxVersion = 1
    Budget = 1
    MaxCopies = 2
    MaxGen = 0
    WakeResend = TRUE
    RecoveryRearm = FALSE
    SaveResend = TRUE
    ReceiptsKeyedByVersion = TRUE
    TimeoutIsRefusal = FALSE

INVARIANT TypeOK
PROPERTY CanonicalEventuallySettled

CHECK_DEADLOCK FALSE
