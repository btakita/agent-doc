# Heavy deps removed from the CLI shell in #bz6s Wave 5. Keep them out of the
# root CLI dependency surface (acceptance criterion #2):
# alacritty_terminal, fs2, hex, htmd, interprocess, portable-pty, regex,
# rusqlite, serde_yaml, signal-hook, tagpath, yrs.

[dev-dependencies]
agent-doc-controller-io = { path = "agent-doc-controller-io", version = "0.35.214", features = ["test-support"] }
agent-doc-document-realtime-io = { path = "agent-doc-document-realtime-io", version = "0.35.214", features = ["test-support"] }
agent-doc-element-queue = { path = "agent-doc-element-queue", version = "0.35.214" }
agent-doc-test-support = { path = "agent-doc-test-support", version = "0.35.214" }
assert_cmd = "2"
existence = "0.4"
filetime = "0.2"
libloading = "0.8"
module-harness = "0.2.1"
predicates = "3"
proptest = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# NOTE: `panic = "abort"` is intentionally NOT set. The shipped cdylib
# (libagent_doc) is loaded into the host IDE process via JNA, and every
# `extern "C"` replica export is wrapped in `catch_unwind`. With abort, a Rust
# panic would `raise(SIGABRT)` and kill IntelliJ before catch_unwind can run;
# unwinding lets the guard map a panic to a benign error code instead. (Crash
# root cause, 2026-07-09: `agent_doc_replica_apply_local` → SIGABRT.)
strip = true

[profile.release-local]
inherits = "release"
lto = "off"
codegen-units = 256
incremental = true
strip = false
