\* PRE-FIX (`#stalewidenrestore`, GH #343): GH #136's width bound measured an
\* editor split observation against the window's current pane count, so a
\* pending stale stash pane the editor's own split names stayed hidden after a
\* restart's 1-window frame. MUST violate EditorRequestedStalePaneNeverHidden.
SPECIFICATION Spec

CONSTANTS
    MaxWidth = 3
    MaxPublications = 2
    MaxFanouts = 1
    GuardOverdue = TRUE
    GuardWiden = TRUE
    DurableRequest = TRUE
    LapseFanout = FALSE
    RefreshResetsClock = FALSE
    PromoteOverdue = TRUE
    EditorWidthAuthority = FALSE
    EditorSplits = {FALSE, TRUE}
    MaxCopies = 2
    MaxGen = 1

INVARIANT EditorRequestedStalePaneNeverHidden
