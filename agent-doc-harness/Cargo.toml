[package]
name = "agent-doc-harness"
version = "0.35.190"
edition = "2024"
description = "Harness prompt and terminal chrome policy for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_harness"

[dependencies]
# `#relaylockpoison`: locks here are parking_lot, not `std::sync` — the workspace
# keeps `panic=unwind` so the cdylib's `catch_unwind` guards survive a panic in a
# host IDE, but that unwind passes THROUGH any live guard, so a poisoning mutex
# turns a survivable panic into a permanent process-wide outage.
parking_lot = "0.12"
agent-doc-config = { path = "../agent-doc-config", version = "0.35.190" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.35.190" }
agent-doc-prompt-contract = { path = "../agent-doc-prompt-contract", version = "0.35.190" }
agent-doc-secret-redact = { path = "../agent-doc-secret-redact", version = "0.35.190" }
agent-doc-turn-executor = { path = "../agent-doc-turn-executor", version = "0.35.190" }
agent-doc-turn-executor-tmux = { path = "../agent-doc-turn-executor-tmux", version = "0.35.190" }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
