[package]
name = "lazily-interop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Cross-binding Lazily network conformance orchestrator"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
jsonschema = { version = "0.46.8", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.9.12"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
