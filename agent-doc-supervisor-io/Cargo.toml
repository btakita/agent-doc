[package]
name = "agent-doc-supervisor-io"
version = "0.34.67"
edition = "2024"
description = "Supervisor marker storage I/O for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"

[lib]
name = "agent_doc_supervisor_io"

[dependencies]
agent-doc-config = { path = "../agent-doc-config", version = "0.34.67" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.34.67" }
agent-doc-fs = { path = "../agent-doc-fs", version = "0.34.67" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.34.67" }
agent-doc-log-time = { path = "../agent-doc-log-time", version = "0.34.67" }
agent-doc-project-config-io = { path = "../agent-doc-project-config-io", version = "0.34.67" }
agent-doc-session-registry-io = { path = "../agent-doc-session-registry-io", version = "0.34.67" }
agent-doc-supervisor = { path = "../agent-doc-supervisor", version = "0.34.67" }
anyhow = "1"
indexmap = { version = "2", features = ["serde"] }
interprocess = { version = "2", default-features = false }
libc = "0.2"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
