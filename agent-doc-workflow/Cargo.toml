[package]
name = "agent-doc-workflow"
version = "0.35.14"
edition = "2024"
description = "Pure workflow evidence-to-decision kernel for agent-doc"
license = "MIT"
repository = "https://github.com/btakita/agent-doc"
publish = false

[lib]
name = "agent_doc_workflow"

[dependencies]
agent-doc-diff = { path = "../agent-doc-diff", version = "0.35.14" }
agent-doc-element-backlog = { path = "../agent-doc-element-backlog", version = "0.35.14" }
agent-doc-element-queue = { path = "../agent-doc-element-queue", version = "0.35.14" }
agent-doc-frontmatter = { path = "../agent-doc-frontmatter", version = "0.35.14" }
agent-doc-hash = { path = "../agent-doc-hash", version = "0.35.14" }
agent-doc-markdown-ast = { path = "../agent-doc-markdown-ast", version = "0.35.14" }
agent-doc-prompt-contract = { path = "../agent-doc-prompt-contract", version = "0.35.14" }
agent-doc-queue = { path = "../agent-doc-queue", version = "0.35.14" }
agent-doc-turn = { path = "../agent-doc-turn", version = "0.35.14" }
anyhow = "1"
htmd = "0.5.3"
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
