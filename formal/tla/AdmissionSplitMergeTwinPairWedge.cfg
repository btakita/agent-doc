SPECIFICATION Spec

\* Non-vacuity for the twin-pair guard (`typingforkdup`). The input projection
\* is ON but removes only an EARLIER disk revision; a disk revision NEWER than
\* the operator's (a native save ahead of the authority's replica) reaches the
\* line rung, which keeps both. With the pair guard OFF, `NoDuplicateItem`
\* MUST be violated.
CONSTANTS
    StopOnEqualsAuthority = FALSE
    DuplicateGuard = TRUE
    TwinPairGuard = FALSE
    TwinCollapse = "input"

INVARIANT TypeOK
INVARIANT NoDuplicateItem
